title: "Zwei weitere Forks, Live-Kopien und früher Zugang zu Navigation und Surround"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView installiert auf diesem sunnypilot-Fork für Teslas mit HW1, nennt ihn und zeichnet den Bildschirm von sunnypilot mit allem, was sunnypilot hinzufügt."
  - title: "carrotpilot"
    text: "CommaView installiert auf diesem openpilot-Fork für Hyundai, Kia und Genesis und zeichnet dafür den Bildschirm von openpilot. Was carrotpilot seinem eigenen Bildschirm hinzufügt, etwa seine Navigation und Blitzer, wird noch nicht gezeichnet. Nachdem sich carrotpilot selbst aktualisiert hat, bittet die App um einen Neustart, der Live View zurückbringt."
  - title: "Live-Kopien"
    text: "Einstellungen › Aufnahmen › Aufnehmen in Live View wählt, was Aufnehmen erstellt: eine Wiedergabe nach der Fahrt (das beste Bild, bis zu 10 Minuten, wie bisher), eine Live-Kopie dessen, was Live View zeigt, fertig in dem Moment, in dem Sie anhalten, ohne 10-Minuten-Grenze, oder beides. Eine Live-Kopie hat 720p oder 1080p, läuft bei gesperrtem Handy weiter, endet sauber, bevor Ihr Speicher voll ist, und bleibt auf Ihrem Handy."
  - title: "Einstellungen, die den ganzen Bildschirm nutzen"
    text: "Aufnahmen, Anzeige und Livestream nutzen den ganzen Bildschirm, in zwei Spalten, wo sie passen, die Liste der Einstellungen sagt, was jede Seite enthält, und jede Seite richtet sich auf Tablets, Infotainments und quer gehaltenen Handys aus."
  - title: "Zugang aktualisieren"
    text: "Einstellungen › Konto › Zugang und Funktionen sagt, wann Ihr Zugang sich erneuert, und Zugang aktualisieren bringt eine für Sie ein- oder ausgeschaltete Funktion sofort, wo das bis zu einen Tag dauerte."
  - title: "Warum eine Installation fehlschlug"
    text: "Schlägt die Einrichtung, ein Runtime-Update oder eine Deinstallation fehl, sagt die App, was schiefging und was zu tun ist (ein Fork, den CommaView nicht unterstützt, ein Auto, das gerade fährt, kein Internet auf dem comma), ob Ihr comma auf den alten Stand zurückgesetzt wurde, und Details kopieren kopiert den Bericht, den der Support braucht."
  - title: "Eine Karte für Updates"
    text: "Ein Runtime-Update erscheint nur auf der Update-Karte auf Start. Eines, das fehlschlug, erscheint dort mit Erneut versuchen und Schließen."
  - title: "Schnellere Wiedergaben"
    text: "Eine Wiedergabe lädt nur das Video herunter, das sie zeigt, die nächste Fahrt lädt, während eine erstellt wird, und die GPU zeichnet das HUD ab Android 9. Eine Aufnahme, die durch das Schließen der App, die 10-Minuten-Grenze oder das Ausschalten des Autos abbrach, bekommt jetzt Wiedergabe erstellen."
  - title: "Die Qualität der Wiedergabe funktioniert wieder"
    text: "Balanced, High und Max erstellen wieder unterschiedliche Wiedergaben; jede Wiedergabe war mit 40 Mbit/s erstellt worden. High, der Standard, erstellt von einem comma 3X etwa halb so große Dateien."
  - title: "Der Knopf Debug Clip ist weg"
    text: "Share bug report sendet nur noch Logs. Debug-Clips, die Sie behalten haben, bleiben in Aufnahmen."
  - title: "Korrekturen"
    text: "Die Einstellungen bleiben auf ihrer Seite, wenn ein Infotainment in den Nachtmodus wechselt. Quer gehaltene Handys mit Android 15 halten Abstand zur Kameraaussparung. Das Importieren Ihres eigenen SSH-Schlüssels schließt die App auf einem Infotainment ohne Dateiauswahl nicht mehr."
earlyAccessNote: "Navigation, Surround, Live gehen und An CommaView senden sind in früher Entwicklung. Wir geben sie an eine kleine Gruppe von Testern frei, während wir Rückmeldungen sammeln, und einige laufen über kostenpflichtige Dienste, etwa die Routen der Navigation, daher halten wir die Gruppe klein, bis wir wissen, was normale Nutzung kostet. Wenn Sie beim Testen helfen möchten, melden Sie sich bei uns auf Discord: Wir bitten Tester, sie auf ihren Fahrten zu nutzen und uns zu sagen, wie sie sich schlagen."
earlyAccess:
  - title: "Navigation"
    text: "Zielführung mit Abbiegehinweisen, von Start bis Live View: Suchen Sie einen Ort, vergleichen Sie bis zu drei Routen und folgen Sie dann der Abbiegekarte, den Sprachansagen und, auf dem Bildschirm von CommaView, den Pfeilen auf Ihrer Spur. Nach einer falschen Abzweigung steht in Sekunden eine neue Route. Sie dient nur der Anzeige: Nichts wird an Ihr comma oder Ihr Auto gesendet, und Ihre Orte bleiben auf Ihrem Handy."
  - title: "Surround"
    text: "Eine 3D-Ansicht der Straße rund um Ihr Auto, als vierte Fahransicht: die Straße, wie die Kamera sie sieht, mit Fahrbahnlinien, Kreuzungen und Zebrastreifen; Autos, Lkw und Busse, die gleiten und ihre Bremslichter zeigen; und die Ampeln vor Ihnen, in der Farbe beleuchtet, die sie zeigen. Es lässt einen eigenen Autodetektor auf Ihrem Handy laufen, auf dem Infotainment eines Autos etwa 13-mal so schnell wie zuvor."
  - title: "Live gehen"
    text: "Streamen Sie, was Live View zeigt, auf Ihren YouTube-Kanal oder einen anderen RTMP-Server, in 720p oder 1080p. Melden Sie sich einmal bei YouTube an, und Live gehen legt die Übertragung an, startet und beendet sie, mit Ton vom Mikrofon Ihres comma oder Ihres Handys, wenn Sie eines wählen."
  - title: "An CommaView senden"
    text: "Senden Sie uns aus Aufnahmen eine aufgenommene Fahrt mit einer Notiz dazu, was passiert ist. Nie dabei sind die Fahrerkamera, der Ton oder die Fahrgestellnummer Ihres Autos."
runtime:
  - title: "Zwei weitere Forks"
    text: "Die Runtime erkennt SunnyPilot-TeslaHW1 und carrotpilot."
  - title: "Eine fehlgeschlagene Installation sagt, warum"
    text: "Das Installationsprogramm nennt die Ursache, etwa einen Fork, den es nicht unterstützt, damit die App es Ihnen sagen kann."
  - title: "Schnellere Downloads für Wiedergaben"
    text: "Die App fragt bis zu 4 MiB vom Video einer Fahrt auf einmal an, wo es 256 KiB waren, und ein Handy in sehr schwachem WLAN hält die anderen Antworten des comma nicht mehr auf."
  - title: "Wiedergaben für Fahrten, deren Ende niemand sah"
    text: "Das comma sagt, wann die Fahrt einer Aufnahme vorbei ist, damit die App ihre Wiedergabe auch dann erstellen kann, wenn das Handy das Ende nicht gesehen hat."
  - title: "Das Mikrofon Ihres comma im Stream"
    text: "Für Konten mit Live gehen: Das Mikrofon des comma geht nur an Ihr Handy, solange Sie es für einen Stream gewählt haben. Die eigene Audioaufnahme von openpilot wird nicht eingeschaltet, und das comma speichert den Ton nie."
