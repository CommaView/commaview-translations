title: "StarPilot, Bildschirme passend zu Ihrem Fork und eine neue Bestenliste"
out:
  - title: "StarPilot"
    text: "CommaView läuft jetzt mit StarPilot auf dem comma 3X und dem comma four, installiert über das eigene Installationsprogramm von StarPilot. Live View folgt seiner Camera View, Fahrerkamera eingeschlossen, und sagt Ihnen, wenn seine Einstellung Disable Logging das Video gestoppt hat."
  - title: "Bildschirme passend zu Ihrem Fork"
    text: "Die Bildschirme von comma four und comma 3X zeichnen, was Ihr Fork auf dem comma zeichnet: seine Schrift, seine Warnungen und wie er das Kamerabild abstimmt. Bei StarPilot bringen sie sein eigenes HUD, seinen Fahrpfad und seine Widgets, etwa sein Tempolimit-Schild, Infos zum Vorderfahrzeug, die Navigationskarte und die Entwickler-Seitenleiste."
  - title: "Einen Bildschirm in Anzeige wählen"
    text: "Einstellungen › Anzeige wählt die Fahransicht aus einem Auswahlmenü, und ihre Vorschau zeigt den Fork und die Kameras Ihres eigenen comma."
  - title: "Jedes Bild in Live View"
    text: "Live View zeichnet jetzt jedes Bild, das das comma sendet, bis zu 20 pro Sekunde, wo es früher einige übersprang. Den Bildschirm des comma 3X zeichnet die GPU des Handys (ab Android 9), damit er mit dem Video mithält."
  - title: "Live View, das sich erholt"
    text: "Es bleibt nicht mehr bei „Reconnecting… Attempt 1“ hängen, und bei ausgeschaltetem Auto wartet es und öffnet das Video von selbst, wenn das Auto startet. Ein einziger Statusbereich sagt mit seinen Knöpfen, was passiert, statt beim Start des Videos kurz „openpilot Unavailable“ aufblitzen zu lassen."
  - title: "Ein Neustart nach Runtime-Updates"
    text: "Nachdem die Runtime Ihres comma installiert oder aktualisiert wurde, bittet die App Sie mit einem Knopf Neustart, es neu zu starten, und Live View und Aufnehmen warten, bis Sie das tun; das comma startet nie von selbst neu. Die Update-Karte auf Start ist kleiner: Tippen Sie darauf, um jeden Schritt zu sehen."
  - title: "Start hält Schritt"
    text: "Start zeigt innerhalb von Sekunden, ob jedes comma da ist, ohne Herunterziehen zum Aktualisieren, und sagt Wird geprüft, während es nachsieht. Ein neues App-Update erscheint kurz nach seinem Erscheinen, jedes Mal, wenn Sie zur App zurückkehren."
  - title: "Eine neu gestaltete Bestenliste"
    text: "Rangliste und Erfolge, für Diese Woche, Letzte Woche oder Gesamt: wie weit das comma über Ihnen vorn liegt, was bis zu Ihrem nächsten Erfolg fehlt, und alle 17, die es zu verdienen gibt. Ihr Profil sammelt Ihre Zahlen und Einstellungen, und Tablets und Infotainments behalten neben der Liste einen Bereich Sie."
  - title: "Das Podest, bevor Sie mitmachen"
    text: "Start zeigt das Podest dieser Woche auf drei gestuften Plätzen mit ihren Medaillen, und Sie können die Bestenliste ansehen, bevor Sie zustimmen."
  - title: "Eine ruhigere Warteschlange für Wiedergaben"
    text: "Jede Fahrt ist eine Zeile mit ihrem Fortschritt, Pausieren, Fortsetzen oder Erneut versuchen und einem Menü, um sie zu verschieben, zu melden oder zu entfernen, und Sie können Fahrten in eine neue Reihenfolge ziehen. Der Fortschritt bleibt nicht mehr bei 99 % stehen: Das Speichern der fertigen Wiedergabe erscheint als eigener Schritt."
  - title: "Wiedergaben wie Live View"
    text: "Wiedergaben zeichnen den Bildschirm Ihres Forks und das Tempolimit-Schild aus den Offline-Karten so, wie Live View es tat, und markieren alle Momente, für die das comma keine HUD-Daten gespeichert hat."
  - title: "Bessere Offline-Karten"
    text: "Die Suche in Karte hinzufügen funktioniert mit der Bildschirmtastatur, Herunterladen bleibt unter Android 15 auf dem Bildschirm, und Downloads laufen im Hintergrund weiter. Wo Ihre Karten keine Antwort haben, zeigt das Schild das Limit von sunnypilot."
  - title: "Korrekturen"
    text: "Ein Handy oder Infotainment mit falscher Uhrzeit sperrt Sie nicht mehr aus der Beta aus. Die Warnungen GREEN LIGHT und LEAD DEPARTING bei sunnypilot zeigen immer ihren Kreis, und die Zahlen auf den Tempolimit-Schildern von CommaView berühren sich nicht mehr fast."
runtime:
  - title: "Jede Fahrt zählt"
    text: "Ihr comma zeichnet jede Fahrt auf, während Sie fahren, daher behält eines, das sich mit dem Auto ausschaltet, seine Fahrten, auch die, die beginnen, bevor es die Uhrzeit kennt. Diese Woche in der Bestenliste füllt sich während der Fahrt."
  - title: "StarPilot und der Bildschirm Ihres Forks"
    text: "Die Runtime installiert auf StarPilot, findet Fahrten, die mit seinen Einstellungen High Bitrate Recording oder Konik gespeichert wurden, und sendet, was der Bildschirm Ihres Forks zeichnet, damit die Bildschirme von comma four und comma 3X dazu passen."
  - title: "Live View bekommt seine Kamera zurück"
    text: "Ihr Handy oder Infotainment holt sich die Kamera sofort zurück, wenn es sich neu verbindet, und eines, das aus dem Netz fällt, gibt sie innerhalb von etwa zehn Sekunden frei."
  - title: "Leichter für Ihr comma"
    text: "Die Runtime baut die Telemetrie von openpilot selbst und sendet sie kompakt, behält HUD-Daten nur rund um eine Aufnahme und sagt der App innerhalb von Sekunden, ob Ihr comma da ist. Aufnehmen schlägt auf einem ausgelasteten comma nicht mehr fehl."
  - title: "Wiedergaben, die verfügbar bleiben"
    text: "Fertige Fahrten werden nicht mehr als beschädigt markiert, nachdem das comma im Stand neu gestartet ist, und eine lange Fahrt kann die Wiedergaben anderer Fahrten nicht mehr aufhalten."
