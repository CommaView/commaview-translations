title: "Offline-Karten und Tempolimits, regionale Schilder und eine Warteschlange für Wiedergaben"
out:
  - title: "Offline-Karten und Tempolimits"
    text: "Laden Sie ein Land oder einen US-Bundesstaat unter Einstellungen › Offline-Karten herunter, und CommaView zeigt das Tempolimit anhand der Live-GPS-Position Ihres comma, sobald dessen Standort an ist. Downloads lassen sich pausieren, fortsetzen und aktualisieren, und die Limits dienen nur der Anzeige."
  - title: "Tempolimit-Schilder für Ihre Region"
    text: "Das Schild von CommaView nimmt anhand des Standorts Ihres comma einen von sieben Stilen an: den Kreis mit rotem Rand aus den meisten Ländern, Großbritannien und Taiwan eingeschlossen, oder die Schilder der USA, Kanadas, Japans, Schwedens, Finnlands und Islands, Irlands und Brasiliens oder Australiens."
  - title: "Ein Lenk-Halbmond"
    text: "Ein Halbmond unter dem Geschwindigkeitsblock der Einblendungen von CommaView zeigt, wie stark openpilot lenkt, und der Block hat seinen Glaslook zurück. MAX und das Tempolimit bleiben an ihrem Platz, auch wenn sie unbekannt sind."
  - title: "Bildschirm füllen oder ganzes Kamerabild"
    text: "Im Querformat füllen die Einblendungen von CommaView den Bildschirm, indem sie das Kamerabild beschneiden, oder zeigen mit Ganzes Kamerabild das ganze Bild. Neue Aufnahmen behalten den gewählten Ausschnitt."
  - title: "Eine Warteschlange für Wiedergaben"
    text: "Stellen Sie mehrere Fahrten in die Warteschlange, und ihre Wiedergaben werden im Hintergrund erstellt und machen dort weiter, wo sie aufgehört haben, wenn die Verbindung abbricht. Pausieren, fortsetzen, erneut versuchen oder umordnen können Sie sie unter Warteschlange in Aufnahmen."
  - title: "Aufnahmen und Karten für jeden Bildschirm"
    text: "Aufnahmen und die Bibliothek der Offline-Karten sind neu gestaltet und passen auf Handys, Tablets und Infotainments, und Standort des Autos passt jetzt auf kurze Bildschirme und zu großem Text."
  - title: "Klarere Probleme bei Aufnahmen"
    text: "Wenn aus einer Fahrt keine Wiedergabe werden kann, sagt Aufnahmen, warum, und ein von dort gesendeter Bericht enthält die Details, die wir zum Nachsehen brauchen."
  - title: "Start und die Bestenliste"
    text: "Fahrten dieser Woche und Standort des Autos bleiben auf Start, während Sie offline sind, und Start zeigt das Podest dieser Woche. Sobald Sie der Bestenliste beigetreten sind, synchronisieren sich Ihre Summen von selbst, auch über den Hotspot des comma."
  - title: "Runtime-Updates ohne App-Update"
    text: "Die Runtime Ihres comma lässt sich aktualisieren, wenn eine passende erscheint, ohne auf eine neue App zu warten, und ihr Fortschritt ist klarer."
  - title: "Anmeldung zur Beta"
    text: "Während der Beta bittet CommaView Sie, sich mit dem Konto anzumelden, an das Ihre Einladung ging. Ihre Kopplungen und Einstellungen bleiben erhalten, und die App funktioniert offline, solange Ihr Zugangspass gültig ist."
  - title: "Klareres WLAN-Energiesparen"
    text: "Das WLAN-Energiesparen Ihres comma ist eine einfache Wahl zwischen an und aus, die die Systemvorgabe zeigt und sagt, wann eine Änderung wirkt."
runtime:
  - title: "Neustart aus der App"
    text: "Wenn ein Update einen Neustart Ihres comma braucht, startet comma jetzt neu starten in der App es für Sie neu. Das geht nur, solange das Auto aus ist oder parkt."
  - title: "Tempolimits aus frischem GPS"
    text: "Bei sunnypilot sendet Ihr comma seine neueste GPS-Position statt einer zwischengespeicherten, damit die Tempolimits aus den Offline-Karten Ihrem Standort folgen."
  - title: "Klarerer Status der Fahrten"
    text: "Ihr comma unterscheidet eine noch unvollständige Fahrt von einer, die weg ist, damit Aufnahmen erklären kann, welche es ist, und hält fertige Fahrten intakt."
