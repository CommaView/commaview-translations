title: "Live gehen für alle, Fahrten senden und mehr openpilot-Forks, ohne Gewähr"
out:
  - title: "Live gehen, für alle"
    text: "Streamen Sie, was Live View zeigt, auf Ihren YouTube-Kanal oder einen anderen RTMP-Server, in 720p oder 1080p, mit Ton vom Mikrofon Ihres comma oder Ihres Handys, wenn Sie eines wählen. Richten Sie es unter Einstellungen › Livestream ein. Streams starten als Nicht gelistet, und wer zusieht, sieht, wo Sie fahren."
  - title: "An CommaView senden, für Mitglieder"
    text: "Senden Sie uns eine oder mehrere Fahrten aus Aufnahmen, mit einer Notiz dazu, was passiert ist: von jeder das Video der Straßen- und der Weitwinkelkamera und ihr Log, nie die Fahrerkamera, den Ton oder die Fahrgestellnummer Ihres Autos. Ein einziges Fenster An CommaView senden trägt jetzt alles, was Sie uns schicken, Probleme wie Ideen."
  - title: "Mehrere Fahrten auf einmal"
    text: "Wählen Sie Fahrten in Aufnahmen, um sie gemeinsam zu teilen, ihre Wiedergaben zu erstellen, sie zu senden oder zu löschen."
  - title: "Ihre Anfragen"
    text: "Wenn Sie angemeldet ein Problem melden oder eine Idee senden, können wir antworten: Einstellungen › Support & Diagnose › Ihre Anfragen zeigt unsere Antworten, Sie bekommen eine E-Mail, und das Gespräch geht auf my.commaview.com weiter."
  - title: "Live View passt auf jeden Bildschirm"
    text: "Seine Bedienelemente scrollen nicht mehr und schneiden Verlassen nicht mehr ab: Was nicht passt, kommt in Mehr, und größerer Text verschiebt Bedienelemente nach Mehr, statt etwas zu verkleinern. Live View belastet das Handy weniger und kommt von selbst wieder in Gang, statt einzufrieren."
  - title: "Einstellungen, neu geordnet"
    text: "Datenschutz & Teilen sagt, was Ihr Handy verlässt, unter Support & Diagnose melden Sie ein Problem und finden Ihre Anfragen, und Konto endet mit Konto löschen. CommaView verbessern helfen fragt einmal, ob Absturzberichte gesendet werden sollen und welche Fahrsoftware auf Ihrem comma läuft."
  - title: "Die Bestenliste, für jedes Mitglied"
    text: "Sie hängt nicht mehr an einem Feature-Flag. Die Karte auf Start aktualisiert sich höchstens alle 30 Minuten und sagt, wann zuletzt."
  - title: "CommaView unterstützen"
    text: "Einstellungen › Support & Diagnose › CommaView unterstützen öffnet unsere Seite bei Buy Me a Coffee, um Hosting, Tests und die iOS-App mitzufinanzieren. Sie schaltet nichts frei."
  - title: "Korrekturen"
    text: "Ein Infotainment mit Android 16 schließt CommaView in Live View nicht mehr, wenn sein Video-Decoder ausfällt, der comma-3X-Bildschirm von StarPilot zeichnet seine Kamera auf Infotainments, die sie schwarz zeigten, und die Anmeldung bei YouTube und Live gehen funktionieren über ein VPN."
earlyAccessNote: "Navigation, Surround, Surround V2 und Experimentelle Tools sind weiterhin in früher Entwicklung, hinter Feature-Flags für eine kleine Gruppe von Testern, während wir Rückmeldungen sammeln. Einige laufen über kostenpflichtige Dienste, etwa die Routen der Navigation, daher halten wir die Gruppe klein. Wenn Sie beim Testen helfen möchten, melden Sie sich bei uns auf Discord."
earlyAccess:
  - title: "Navigation"
    text: "Eine Karte in Live View während einer Fahrt, neben dem Video oder in seiner Ecke, und ohne Fahrt Wohin?. Auf der Eckkarte sind Beenden und Stummschalten immer da, Beenden lässt sich 8 Sekunden lang rückgängig machen, und Sie können sagen, wohin es gehen soll."
  - title: "Kartenstile"
    text: "Die Karte der Navigation hat jetzt einen hellen und einen dunklen Stil, die bei Sonnenaufgang und Sonnenuntergang am Ort Ihres comma wechseln, damit sie auch in der Sonne lesbar ist. Wählen Sie Auto, Wie das Handy, Hell oder Dunkel unter Einstellungen › Karten & Navigation › Kartenstil."
  - title: "Surround und Surround V2"
    text: "Surround setzt in Wiedergaben ein geparktes Auto dorthin, wo es steht, und blendet ein nur von der Kamera erkanntes Auto aus, das in Wahrheit das des Radars ist. Surround V2 ist ein experimenteller zweiter Renderer, unter Einstellungen › Experimentelle Tools."
runtime:
  - title: "Nur gekoppelte Handys"
    text: "Die Kameras und Daten Ihres comma gehen nur an die damit gekoppelten Handys und Infotainments. Aktualisieren Sie zuerst CommaView auf jedem Handy und Infotainment: Eines, das auf 0.0.164 bleibt, bekommt von einem comma mit dieser Runtime kein Video."
  - title: "Zur Autoerkennung beitragen"
    text: "Für Mitglieder: Geben Sie ganze Fahrten, um den Autodetektor von Surround zu trainieren, mit einem Tippen oder automatisch, in den Netzen, die Sie aus den gespeicherten WLANs Ihres comma und den mobilen Daten Ihres Handys wählen, jedes auf Wunsch mit einem Monatslimit. Ein Beitrag ist endgültig: Er lässt sich später nicht entfernen. Nichts nennt Sie oder Ihr comma, aber die Strecke und das Video einer Fahrt können zeigen, wo Sie fahren."
  - title: "Mehr openpilot-Forks, ohne Gewähr"
    text: "CommaView installiert jetzt auf mehr openpilot-Forks, ohne Gewähr: Die Einrichtung prüft einen Fork, den CommaView nicht listet, ohne etwas zu ändern, und fügt die Ansicht von CommaView hinzu, sobald Sie zustimmen. Runtime deinstallieren stellt die Dateien des Forks wieder her."
  - title: "Installationen, die sich erholen"
    text: "Ein Stromausfall oder Neustart mitten in der Installation stellt das vorherige Release wieder her, ein hängender Download macht dort weiter, wo er stehen blieb, und eine Installation läuft weiter, wenn die App nicht mehr zuhört."
  - title: "Experimentalmodus auf neuerem openpilot"
    text: "Auf dem Nightly von openpilot und sunnypilot dev zeigt Live View den Experimentalmodus so wie openpilot."
