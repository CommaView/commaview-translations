title: "Ein neu gestaltetes CommaView, unsere eigenen Einblendungen und die Bestenliste"
out:
  - title: "Eine neu gestaltete App"
    text: "Jeder Bildschirm ist in einem neuen Design neu gebaut: Start, Live View, Aufnahmen, Einstellungen, Kopplung und Einrichtung. Dazu kommen ein neues Symbol, ein neuer Startbildschirm und ein Tageslichtmodus für helle Tage."
  - title: "Ein neuer Start"
    text: "Ihr Auto auf seiner Bühne mit Live View öffnen, darunter Fahrten dieser Woche, Standort des Autos, Ihre letzten Aufnahmen und die Bestenliste. Ordnen Sie ihn mit Start anpassen an. Ihr comma erscheint von selbst als verbunden, ohne dass Sie auf Neu verbinden tippen müssen."
  - title: "Für Tablets und Infotainments gemacht"
    text: "Auf einem breiteren Bildschirm wird Start zum Armaturenbrett, Einstellungen und Aufnahmen öffnen sich neben ihren Listen, und die Kopplung passt auf jedes Infotainment."
  - title: "Die Einblendungen von CommaView"
    text: "Unsere eigene Fahransicht: Ihre Geschwindigkeit, MAX und das Tempolimit in einem Block, Fahrbahnlinien, die zeigen, wie sicher sich das Modell ist, Fahrerüberwachung und Warnungen, die Ihnen nicht im Weg sind, und das kanadische Schild MAXIMUM, wo es gilt. Die Bildschirme von comma 3X und comma four sind auch da, und Sie können die Ansicht direkt in Live View wechseln."
  - title: "Einfachere Anzeige-Einstellungen"
    text: "Ein einziger Bereich für die Einblendungen mit Live-Vorschau, und CommaView ist für Sie vorgewählt."
  - title: "Bessere Aufnahmen"
    text: "Wiedergaben sehen genau aus wie Live View, spielen in der App ab und lassen sich erstellen, während das Auto in P steht. Sie zeigen ihren Fortschritt, während sie erstellt werden. Jede Fahrt hat ein Vorschaubild, und Sie werden gewarnt, bevor Ihr comma eine löscht."
  - title: "Aufnahmen auf all Ihren Geräten"
    text: "Ihre Aufnahmen folgen Ihnen zwischen Ihren gekoppelten Handys und Infotainments."
  - title: "Fahrstatistik und Standort des Autos"
    text: "Strecke, Fahrzeit und Fahrten Ihrer Woche aus den eigenen Logs Ihres comma, und wo Ihr Auto ist und wo Sie geparkt haben, auf einer dunklen Karte. Der Standort bleibt aus, bis Sie ihn einschalten."
  - title: "Eine Geräteseite"
    text: "Status und Runtime Ihres comma an einem Ort. Von dort öffnen Sie Live View, verwalten das WLAN-Energiesparen, reparieren und teilen Logs, wenn Sie Hilfe brauchen."
  - title: "Updates in der App"
    text: "App-Updates laden im Hintergrund herunter, mit einem Update-Knopf auf jedem Bildschirm. Runtime-Updates, Reparaturen und Deinstallieren brauchen kein SSH. Jedes Update zeigt seine Schritte, während es läuft, und Start hält Sie auf dem Laufenden. Alles, was während der Fahrt nicht geschehen kann, wartet, bis das Auto in P steht."
  - title: "Bestenliste"
    text: "Machen Sie auf Start mit einem Anzeigenamen mit, um das Podest dieser Woche, die Ergebnisse der letzten Woche und die Gesamtwertung zu sehen. Abzeichen verdienen Sie mit der vom comma selbst aufgezeichneten Strecke, und eine Gesamtliste von comma.ai zeigt die Summe, die comma.ai für Ihr comma hat."
  - title: "Absturzberichte"
    text: "Sie helfen uns, Probleme schneller zu beheben, ohne persönliche Angaben. Sie können sie in den Einstellungen ausschalten."
  - title: "Korrekturen"
    text: "Die MAX-Geschwindigkeit des comma four flackert im aktiven Zustand nicht mehr. Das comma 3 sagt jetzt klar, dass es nicht unterstützt wird; CommaView läuft auf dem comma 3X und dem comma four."
runtime:
  - title: "Updates in P, auch zu Hause"
    text: "Lassen Sie das Auto in P an, mit deaktiviertem openpilot, oder richten Sie das comma auf Ihrem Schreibtisch ein. Eine Fahrt wird nie unterbrochen."
  - title: "Sicherere Updates"
    text: "Eines nach dem anderen, und wenn etwas schiefgeht, kehrt Ihr comma zu seiner bisherigen Version zurück."
  - title: "Was hinter den neuen Funktionen steckt"
    text: "Fahrstatistik, Standort des Autos, Aufnahmen auf allen Ihren Geräten und die Synchronisierung der Bestenliste kommen alle von der neuen Runtime. Die App installiert sie für Sie."
