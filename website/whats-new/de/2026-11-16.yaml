title: "Ein Schlüssel für jedes Handy, CommaView in 11 weiteren Sprachen und Browser View"
out:
  - title: "CommaView in Ihrer Sprache"
    text: "Einstellungen › Sprache: Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文 und 繁體中文 neben English. Sie sind maschinell übersetzt und noch nicht von Muttersprachlern geprüft, sagen Sie uns also, was falsch klingt. Die eigenen Bildschirme Ihres comma bleiben in seiner Sprache."
  - title: "Browser View"
    text: "Live View im Webbrowser Ihres Autos, auch bei Tesla: Starten Sie es in den Details von Live View und tippen Sie den kurzen Link in den Browser des Autos. Das Bild geht über den Hotspot von Ihrem Handy ins Auto, nie über das Internet."
  - title: "Diesen Moment speichern"
    text: "Speichern in Live View behält die letzten 3 Minuten und die nächste Minute einer Fahrt als MP4 auf Ihrem Handy, kopiert, sobald Sie parken."
  - title: "Ganze Fahrt exportieren… und Fahrten automatisch abrufen"
    text: "Kopieren Sie eine ganze Fahrt als ein MP4, oder lassen Sie neue Fahrten etwa jede halbe Stunde in den WLAN-Netzen, die Sie wählen, nach Hause kopieren, bis zu dem Platz, den Sie ihnen geben."
  - title: "Der Store für Overlay-Pakete"
    text: "Pakete fügen Live View hinzu, was Ihr Fork auf seinem eigenen Bildschirm zeichnet. Mitglieder stöbern in den Paketen Offiziell und Community und in Für Ihr comma; jeder kann eines aus einer Datei oder über einen Link hinzufügen."
  - title: "Navigation mit Ihrem eigenen Schlüssel für Stadia Maps"
    text: "Für Mitglieder: Wohin?, Routen und Abbiegehinweise mit Ihrem eigenen Konto bei Stadia Maps, der Schlüssel versiegelt auf Ihrem Handy."
  - title: "CommaView von selbst öffnen"
    text: "Wenn ein Infotainment startet, wenn Bluetooth sich verbindet, und direkt in Live View, wenn sich Ihr comma verbindet. Jedes davon ist aus, bis Sie es unter Einstellungen › Anzeige einschalten."
  - title: "Mit dem Entwickler meines Forks teilen…"
    text: "Ein Clip, eine Zusammenfassung und das Log von CommaView für diesen Abschnitt, geteilt über das Teilen-Menü von Android, dorthin, wo Ihr Fork Berichte annimmt. Nichts geht an CommaView."
  - title: "Live View sagt, was passiert"
    text: "Es wartet auf einen Neustart, den das comma braucht, sagt, wenn die Fahrzeugdaten ausfallen oder das Bild verzögert ist, sagt, warum es sich neu verbindet, und spielt auf mehr Infotainments ab, indem es einen anderen Video-Decoder versucht."
  - title: "CommaView aktualisieren"
    text: "Für Mitglieder, ab 0.0.166: Das Update zeigt seine Version, lässt sich abbrechen und lädt im Hintergrund weiter herunter."
  - title: "Korrekturen"
    text: "Bei großem Text in kurzen Fenstern wird nichts mehr abgeschnitten, Live gehen bleibt stumm, wenn Ton aus ist, und eine Wiedergabe einer Fahrt, bei der das comma den Strom verlor, nutzt alles bis zur Unterbrechung."
earlyAccessNote: "Live gehen auf X, Twitch, Kick und Facebook, Nur Video, die Fork-Einstellungen, das Erstellen von Overlay-Paketen und Surround sind hinter Feature-Flags für eine kleine Gruppe von Testern da, während wir Rückmeldungen sammeln. Wenn Sie beim Testen helfen möchten, melden Sie sich bei uns auf Discord."
earlyAccess:
  - title: "Live gehen auf mehr Plattformen"
    text: "X, Twitch, Kick und Facebook, jede hinter einem eigenen Flag, bis mit einem echten Konto dorthin gestreamt wurde."
  - title: "Nur Video"
    text: "Für FrogPilot und KisaPilot, zu deren Bildschirm CommaView seine Ansicht nicht hinzufügen kann: die Kameras und Fahrdaten in der eigenen Ansicht von CommaView, ohne Änderung am Fork."
  - title: "Fork-Einstellungen"
    text: "Die eigenen Einstellungen Ihrer Fahrsoftware in den Einstellungen des Geräts Ihres comma, geändert im Stand, mit Sicherungen auf Ihrem Handy."
runtime:
  - title: "Ein Schlüssel für jedes Handy"
    text: "Jedes Handy bekommt von selbst einen eigenen Schlüssel für Ihr comma, und niemand muss neu koppeln. Handys mit älteren Apps funktionieren noch 90 Tage, nachdem das erste Handy seinen Schlüssel bekommen hat; danach brauchen sie 0.0.166 und eine Einladung."
  - title: "BluePilot, dragonpilot und OPGM"
    text: "Jetzt gelistete Forks, mit Namen genannt und im Look ihrer Basis gezeichnet."
  - title: "Geprüfte Installationen, nie zurück"
    text: "Die App prüft die Signatur jeder Runtime vor der Installation, und ein comma lehnt eine ältere Runtime ab."
  - title: "carrotpilot und StarPilot 7.0"
    text: "Mehr vom Bildschirm von carrotpilot, in seiner eigenen Schrift für Koreanisch, Japanisch, Chinesisch und Thai, und der Entwicklungs-Branch von StarPilot 7.0, ohne Gewähr."
