title: "Ключ для кожного телефона, CommaView ще 11 мовами й Browser View"
out:
  - title: "CommaView вашою мовою"
    text: "Налаштування › Мова: Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文 і 繁體中文 поряд з англійською. Це машинний переклад, ще не перевірений носіями мов, тож повідомте нам, що звучить не так. Власні екрани comma лишаються його мовою."
  - title: "Browser View"
    text: "Live View у вебпереглядачі вашого авто, зокрема в Tesla: запустіть його в «Подробицях» Live View і введіть коротке посилання в браузері авто. Картинка йде з телефона в авто через його точку доступу, ніколи не через інтернет."
  - title: "Зберегти цей момент"
    text: "Кнопка «Зберегти» в Live View зберігає останні 3 хвилини й наступну хвилину поїздки як MP4 на телефоні; копіюється, щойно ви припаркуєтеся."
  - title: "Експортувати всю поїздку… і Автоматично отримувати поїздки"
    text: "Скопіюйте всю поїздку одним MP4 або налаштуйте копіювання нових поїздок додому приблизно щопівгодини у вибраному Wi‑Fi, у межах місця, яке ви їм відвели."
  - title: "Магазин пакетів накладок"
    text: "Пакети додають у Live View те, що ваш форк малює на власному екрані. Учасники переглядають Офіційні пакети, пакети Спільноти й пакети для вашого comma; будь-хто може додати пакет із файлу чи за посиланням."
  - title: "Навігація з власним ключем Stadia Maps"
    text: "Для учасників: «Куди їдемо?», маршрути й покрокові підказки з вашим власним обліковим записом Stadia Maps, а ключ надійно захищено на телефоні."
  - title: "Відкривати CommaView самостійно"
    text: "Коли запускається мультимедійна система, коли підключається Bluetooth і одразу в Live View, коли підключається comma. Кожен варіант вимкнено, доки ви не ввімкнете його в Налаштування › Дисплей."
  - title: "Поділитися з розробником мого форка"
    text: "Кліп, підсумок і журнал CommaView за цей відрізок — через меню «Поділитися» Android туди, де ваш форк приймає звіти. До CommaView нічого не надходить."
  - title: "Live View пояснює, що відбувається"
    text: "Він чекає перезавантаження, потрібного comma, повідомляє, коли дані авто перестають надходити чи картинка запізнюється, пояснює, чому перепідключається, і відтворює на більшій кількості мультимедійних систем, пробуючи інший відеодекодер."
  - title: "Оновлення CommaView"
    text: "Для учасників, починаючи з 0.0.166: оновлення показує свою версію, його можна скасувати, а завантаження триває у фоні."
  - title: "Виправлення"
    text: "Ніщо не обрізається за великого тексту в низьких вікнах, трансляція мовчить із вимкненим звуком, а повтор поїздки, під час якої comma втратив живлення, використовує все до моменту обриву."
earlyAccessNote: "Трансляції на X, Twitch, Kick і Facebook, «Лише відео», налаштування форка, створення пакетів накладок і Surround доступні обмеженій групі тестувальників за прапорцями функцій, поки ми збираємо відгуки. Щоб допомогти з тестуванням, напишіть нам у Discord."
earlyAccess:
  - title: "Трансляції на більше платформ"
    text: "X, Twitch, Kick і Facebook — кожна за власним прапорцем, доки на неї не проведуть трансляцію зі справжнього облікового запису."
  - title: "Лише відео"
    text: "Для FrogPilot і KisaPilot, до екрана яких CommaView не може додати свій вид: камери й дані водіння у власному виді CommaView, без жодних змін у форку."
  - title: "Налаштування форка"
    text: "Власні налаштування вашого ПЗ водіння в налаштуваннях пристрою comma, змінювані на паркуванні, з резервними копіями на телефоні."
runtime:
  - title: "Ключ для кожного телефона"
    text: "Кожен телефон сам отримує власний ключ до вашого comma, і нікому не треба сполучатися заново. Телефони зі старішими застосунками працюють ще 90 днів після того, як перший телефон отримає ключ; після цього їм потрібні 0.0.166 і запрошення."
  - title: "BluePilot, dragonpilot і OPGM"
    text: "Тепер у списку форків: із назвами й у вигляді їхньої основи."
  - title: "Перевірені встановлення, ніколи назад"
    text: "Застосунок перевіряє підпис кожного середовища виконання перед встановленням, а comma відмовляється від старішого середовища виконання."
  - title: "carrotpilot і StarPilot 7.0"
    text: "Більше з екрана carrotpilot — його власним шрифтом для корейської, японської, китайської й тайської, — і гілка розробки StarPilot 7.0, без гарантій."
