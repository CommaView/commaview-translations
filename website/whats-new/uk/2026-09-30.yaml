title: "Нова головна, зображення вашого авто й одне місце для облікового запису"
out:
  - title: "Ваш обліковий запис на my.commaview.com"
    text: "Увійдіть за кодом, надісланим на email, завантажте застосунок і подивіться, що нового. Звідси тепер надходять Beta й оновлення; Firebase App Distribution більше немає."
  - title: "Оновлення з облікового запису"
    text: "Застосунок перевіряє ваш обліковий запис на нові випуски й пропонує їх у застосунку. Кожен випуск застосунку постачається із середовищем виконання, з яким його перевірено."
  - title: "Відгуки й дошка ідей"
    text: "Надішліть ідею, проблему чи похвалу з Налаштувань у застосунку — з пакетом для підтримки, якщо хочете, щоб ми подивилися уважніше, — і голосуйте за те, що ми створимо далі, на дошці ідей на my.commaview.com."
  - title: "Нове зображення вашого авто"
    text: "Кожне підтримуване авто має нове зображення в одному стилі, однакового розміру й освітлення, що охайно виглядає на будь-якому екрані."
next:
  - title: "Нова головна «Пристрої»"
    text: "Ваше авто на сцені в одній картці з «Відкрити Live View», далі «Водіння цього тижня», «Місце авто» й останні записи."
  - title: "Створено для планшетів і мультимедійних систем"
    text: "На ширшому екрані головна стає панеллю приладів, а Налаштування й Налаштування пристрою відкриваються поряд зі своїм списком."
runtime:
  - title: "Статистика водіння"
    text: "Тижнева відстань, час за кермом і поїздки з власних журналів comma."
  - title: "Місце авто"
    text: "Де авто під час поїздки і де ви припаркувалися. Вимкнено, доки ви не ввімкнете."
