title: "Офлайн-карти й обмеження швидкості, регіональні знаки та черга повторів"
out:
  - title: "Офлайн-карти й обмеження швидкості"
    text: "Завантажте країну чи штат США в Налаштування › Карти офлайн, і CommaView показуватиме обмеження швидкості за живим GPS вашого comma, щойно ввімкнено його місцезнаходження. Завантаження можна призупиняти, продовжувати й оновлювати, а обмеження — лише для відображення."
  - title: "Знаки обмеження швидкості для місця, де ви їдете"
    text: "Знак CommaView бере один із семи стилів за місцезнаходженням comma: коло з червоною облямівкою, що використовується в більшості країн, зокрема у Великій Британії й на Тайвані, або знаки США, Канади, Японії, Швеції, Фінляндії та Ісландії, Ірландії та Бразилії чи Австралії."
  - title: "Півмісяць керування"
    text: "Півмісяць під блоком швидкості накладки CommaView показує, наскільки сильно кермує openpilot, а блок знову має скляний вигляд. МАКС і обмеження швидкості лишаються на місці, навіть коли невідомі."
  - title: "Заповнити екран або Уся камера"
    text: "У горизонтальному положенні накладка CommaView заповнює екран, обрізаючи камеру, або показує всю картинку з «Уся камера». Нові записи зберігають вибране вами обрізання."
  - title: "Черга повторів"
    text: "Поставте в чергу кілька поїздок, і їхні повтори створюватимуться у фоні, продовжуючи з місця зупинки, якщо з’єднання обірветься. Призупиняйте, продовжуйте, повторюйте чи змінюйте порядок у «Черга» в Записах."
  - title: "Записи й карти для будь-якого екрана"
    text: "Записи й бібліотеку офлайн-карт перероблено під телефони, планшети й мультимедійні системи, а «Місце авто» тепер уміщається на низьких екранах і з великим текстом."
  - title: "Зрозуміліші проблеми із записами"
    text: "Коли з поїздки не вдається створити повтор, Записи пояснюють чому, а звіт, надісланий звідти, містить подробиці, потрібні нам для розслідування."
  - title: "Головна й таблиця лідерів"
    text: "«Водіння цього тижня» й «Місце авто» лишаються на Головній, коли ви офлайн, а Головна показує п’єдестал цього тижня. Щойно ви приєдналися до таблиці лідерів, ваші підсумки синхронізуються самі, навіть через точку доступу comma."
  - title: "Оновлення середовища виконання без оновлення застосунку"
    text: "Середовище виконання comma можна оновити, щойно вийде сумісне, не чекаючи нового застосунку, а його прогрес зрозуміліший."
  - title: "Вхід у Beta"
    text: "Під час Beta CommaView просить увійти з обліковим записом, на який надійшло запрошення. Ваші сполучення й налаштування зберігаються, а застосунок працює офлайн, поки ваша перепустка дійсна."
  - title: "Зрозуміліше енергозбереження Wi‑Fi"
    text: "Енергозбереження Wi‑Fi вашого comma — простий вибір «увімкнено чи вимкнено», що показує системне типове значення й пояснює, коли зміна набуде чинності."
runtime:
  - title: "Перезавантаження із застосунку"
    text: "Коли оновлення потребує перезапуску comma, «Перезавантажити comma зараз» у застосунку зробить це за вас. Працює лише тоді, коли авто вимкнене чи припарковане."
  - title: "Обмеження швидкості зі свіжого GPS"
    text: "На sunnypilot comma надсилає найновішу позицію GPS, а не кешовану, тож обмеження швидкості з офлайн-карт стежать за тим, де ви є."
  - title: "Зрозуміліший стан поїздок"
    text: "comma відрізняє поїздку, ще не завершену, від тієї, якої вже немає, тож Записи можуть пояснити, яка саме, і зберігає завершені поїздки цілими."
