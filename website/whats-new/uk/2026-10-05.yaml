title: "Оновлений CommaView, наша власна накладка й таблиця лідерів"
out:
  - title: "Оновлений застосунок"
    text: "Кожен екран перебудовано в новому дизайні: головна, Live View, Записи, Налаштування, сполучення й налаштування comma. Разом із ним — нова іконка й екран запуску та денний режим для сонячних днів."
  - title: "Нова головна"
    text: "Ваше авто на сцені з «Відкрити Live View», далі «Водіння цього тижня», «Місце авто», останні записи й таблиця лідерів. Упорядкуйте все через «Налаштувати головну». comma сам показується підключеним, без кнопки «Підключитися знову»."
  - title: "Створено для планшетів і мультимедійних систем"
    text: "На ширшому екрані головна стає панеллю приладів, Налаштування й Записи відкриваються поряд зі своїми списками, а сполучення вміщається на будь-якій мультимедійній системі."
  - title: "Накладка CommaView"
    text: "Наш власний екран водіння: швидкість, МАКС і обмеження швидкості в одному блоці, розмітка, що показує, наскільки впевнена модель, моніторинг водія й сповіщення, які не заважають, і канадський знак MAXIMUM там, де він діє. Екрани comma 3X і comma four теж є, і перемикати екрани можна прямо з Live View."
  - title: "Простіші налаштування дисплея"
    text: "Один розділ накладки водіння з живим попереднім переглядом, і CommaView вибрано за вас."
  - title: "Кращі записи"
    text: "Повтори виглядають точнісінько як Live View, відтворюються в застосунку й можуть створюватися, коли авто на P. Під час створення вони показують прогрес. Кожна поїздка має мініатюру, а вас попереджають, перш ніж comma її видалить."
  - title: "Записи на всіх ваших пристроях"
    text: "Ваші записи йдуть за вами між сполученими телефонами й мультимедійними системами."
  - title: "Статистика водіння й Місце авто"
    text: "Тижнева відстань, час за кермом і поїздки з власних журналів comma, а також де ваше авто і де ви припаркувалися, на темній карті. Місцезнаходження вимкнено, доки ви його не ввімкнете."
  - title: "Сторінка пристрою"
    text: "Стан comma й середовище виконання в одному місці. Звідти можна відкрити Live View, керувати енергозбереженням Wi‑Fi, відновлювати й ділитися журналами, коли потрібна допомога."
  - title: "Оновлення в застосунку"
    text: "Оновлення застосунку завантажуються у фоні, а кнопка оновлення є на кожному екрані. Оновлення середовища виконання, відновлення й видалення не потребують SSH. Кожне оновлення показує кроки під час виконання, а головна тримає вас у курсі. Усе, що не можна робити під час руху, чекає, доки авто стане на P."
  - title: "Таблиця лідерів"
    text: "Приєднайтеся з головної з показуваним ім’ям, щоб бачити п’єдестал цього тижня, результати минулого тижня й рейтинг за весь час. Значки заробляються за відстанню, записаною вашим comma, а таблиця comma.ai за весь час показує підсумок, який comma.ai має для вашого comma."
  - title: "Звіти про збої"
    text: "Вони допомагають нам швидше виправляти проблеми, а особисті дані з них прибрано. Їх можна вимкнути в Налаштуваннях."
  - title: "Виправлення"
    text: "Швидкість МАКС на comma four більше не мерехтить, коли систему активовано. comma 3 тепер прямо повідомляє, що не підтримується; CommaView працює на comma 3X і comma four."
runtime:
  - title: "Оновлення на P, навіть удома"
    text: "Тримайте авто заведеним на P з вимкненим openpilot або налаштуйте comma на своєму столі. Поїздку ніколи не буде перервано."
  - title: "Безпечніші оновлення"
    text: "По одному, а якщо щось піде не так, comma повернеться до версії, яка була."
  - title: "Що живить нові функції"
    text: "Статистика водіння, Місце авто, записи на всіх пристроях і синхронізація таблиці лідерів — усе це з нового середовища виконання. Застосунок встановить його за вас."
