title: "StarPilot, екрани, що відповідають вашому форку, і нова таблиця лідерів"
out:
  - title: "StarPilot"
    text: "CommaView тепер працює зі StarPilot на comma 3X і comma four, встановленим власним інсталятором StarPilot. Live View дотримується його Camera View, зокрема камери водія, і повідомляє, коли налаштування Disable Logging зупинило відео."
  - title: "Екрани, що відповідають вашому форку"
    text: "Екрани comma four і comma 3X малюють те, що ваш форк малює на comma: його шрифт, сповіщення й те, як він обробляє колір камери. На StarPilot вони приносять його власний HUD, траєкторію й віджети, як-от знак обмеження швидкості, інформацію про авто попереду, картку навігації й бічну панель розробника."
  - title: "Вибір екрана в Дисплеї"
    text: "Налаштування › Дисплей вибирає екран водіння зі списку, а попередній перегляд показує форк і камери саме вашого comma."
  - title: "Кожен кадр у Live View"
    text: "Live View тепер малює кожен кадр, який надсилає comma, до 20 на секунду, — раніше деякі пропускалися. Екран comma 3X малює GPU телефона (Android 9 і новіші), тож він встигає за відео."
  - title: "Live View, що відновлюється"
    text: "Він більше не застрягає на «Reconnecting… Attempt 1», а коли авто вимкнене, чекає й сам відкриває відео, коли авто заводиться. Одна панель стану з кнопками пояснює, що відбувається, замість миттєвого «openpilot Unavailable» на старті відео."
  - title: "Перезавантаження після оновлень середовища виконання"
    text: "Після встановлення чи оновлення середовища виконання comma застосунок просить перезавантажити його кнопкою «Перезавантажити», а Live View і Запис чекають, доки ви це зробите; comma ніколи не перезавантажується сам. Картка оновлення на Головній стала меншою: торкніться її, щоб побачити всі кроки."
  - title: "Головна встигає"
    text: "Головна за секунди показує, чи на місці кожен comma, без потягування для оновлення, і показує «Перевірка», поки перевіряє. Нове оновлення застосунку з’являється невдовзі після виходу, щоразу, як ви повертаєтеся в застосунок."
  - title: "Оновлена таблиця лідерів"
    text: "Рейтинг і Досягнення за Цей тиждень, Минулий тиждень чи За весь час: наскільки ви відстаєте від comma над вами, що лишилося до наступного досягнення і всі 17, які можна здобути. Профіль збирає ваші показники й налаштування, а планшети й мультимедійні системи тримають панель «Ви» поряд із таблицею."
  - title: "П’єдестал до приєднання"
    text: "Головна показує п’єдестал цього тижня трьома сходинками з медалями, і таблицю лідерів можна переглянути, ще не приєднавшись."
  - title: "Спокійніша черга повторів"
    text: "Кожна поїздка — один рядок із прогресом, кнопками «Призупинити», «Продовжити» чи «Повторити» і меню, щоб перемістити, повідомити чи прибрати її, а поїздки можна перетягувати в новому порядку. Прогрес більше не зупиняється на 99%: збереження готового повтору показується окремим кроком."
  - title: "Повтори, що відповідають Live View"
    text: "Повтори малюють екран вашого форка й знак обмеження швидкості з офлайн-карт так, як це робив Live View, і позначають моменти, для яких comma не зберіг даних HUD."
  - title: "Кращі офлайн-карти"
    text: "Пошук у «Додати карту» працює з екранною клавіатурою, кнопка «Завантажити» лишається на екрані на Android 15, а завантаження тривають у фоні. Там, де ваші карти не мають відповіді, знак показує обмеження sunnypilot."
  - title: "Виправлення"
    text: "Телефон чи мультимедійна система з неправильним годинником більше не блокує вам доступ до Beta. Сповіщення ЗЕЛЕНЕ СВІТЛО й АВТО ПОПЕРЕДУ РУШИЛО на sunnypilot завжди показують своє коло, а цифри на знаках обмеження швидкості CommaView більше майже не торкаються одна одної."
runtime:
  - title: "Кожна поїздка рахується"
    text: "comma записує кожну поїздку під час руху, тож той, що вимикається разом з авто, зберігає свої поїздки, навіть ті, що почалися, перш ніж він дізнався час. «Цей тиждень» у таблиці лідерів заповнюється під час поїздки."
  - title: "StarPilot і екран вашого форка"
    text: "Середовище виконання встановлюється на StarPilot, знаходить поїздки, збережені з його налаштуваннями High Bitrate Recording чи Konik, і надсилає те, що малює екран вашого форка, щоб екрани comma four і comma 3X могли йому відповідати."
  - title: "Live View повертає камеру"
    text: "Телефон чи мультимедійна система одразу забирає камеру назад, коли перепідключається, а той, що випав із мережі, звільняє її приблизно за десять секунд."
  - title: "Легше для comma"
    text: "Середовище виконання саме збирає телеметрію openpilot і надсилає її в компактному вигляді, зберігає дані HUD лише довкола запису й за секунди повідомляє застосунку, чи на місці comma. Запис більше не зривається на завантаженому comma."
  - title: "Повтори, що лишаються доступними"
    text: "Завершені поїздки більше не позначаються пошкодженими після перезапуску comma на паркуванні, а одна довга поїздка більше не може зупинити повтори інших поїздок."
