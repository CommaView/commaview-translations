title: "Ще два форки, живі копії й ранній доступ до навігації та Surround"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView встановлюється на цей форк sunnypilot для авто Tesla з HW1, називає його й малює екран sunnypilot з усім, що додає sunnypilot."
  - title: "carrotpilot"
    text: "CommaView встановлюється на цей форк openpilot для авто Hyundai, Kia і Genesis і малює для нього екран openpilot. Те, що carrotpilot додає на власний екран, як-от навігація й камери швидкості, поки не малюється. Після того як carrotpilot оновиться, застосунок попросить перезавантаження, яке поверне Live View."
  - title: "Живі копії"
    text: "Налаштування › Записи › Запис у Live View вибирає, що створює Запис: повтор після поїздки (найкраща картинка, до 10 хвилин, як і раніше), живу копію того, що показує Live View, готову щойно ви зупинитеся й без обмеження в 10 хвилин, або обидва. Жива копія — це 720p чи 1080p; вона триває із заблокованим телефоном, акуратно зупиняється до того, як закінчиться сховище, і лишається на телефоні."
  - title: "Налаштування на весь екран"
    text: "Записи, Дисплей і Пряма трансляція займають увесь екран у дві колонки, де вони вміщаються, список Налаштувань показує, що на кожній сторінці, а кожна сторінка рівно вирівнюється на планшетах, мультимедійних системах і телефонах у горизонтальному положенні."
  - title: "Оновити доступ"
    text: "Налаштування › Обліковий запис › Доступ і функції показує, коли поновиться ваш доступ, а «Оновити доступ» одразу застосовує функцію, яку для вас увімкнули чи вимкнули, — раніше на це йшло до доби."
  - title: "Чому встановлення не вдалося"
    text: "Якщо налаштування, оновлення середовища виконання чи видалення завершується помилкою, застосунок пояснює, що пішло не так і що робити (форк, який CommaView не підтримує, авто в русі, немає інтернету на comma), чи повернуто comma як було, а «Копіювати подробиці» копіює звіт, потрібний підтримці."
  - title: "Одна картка для оновлень"
    text: "Оновлення середовища виконання показується лише на картці оновлень на Головній. Невдале оновлення показується там із кнопками «Спробувати ще раз» і «Закрити»."
  - title: "Швидші повтори"
    text: "Повтор завантажує лише те відео, яке показує, наступна поїздка завантажується, поки створюється попередня, а HUD на Android 9 і новіших малює GPU. Запис, перерваний закриттям застосунку, лімітом у 10 хвилин або вимкненням авто, тепер має «Створити повтор»."
  - title: "Якість повтору знову працює"
    text: "Збалансована, Висока й Максимальна знову дають різні повтори; раніше кожен повтор створювався з 40 Mbit/s. Висока, типова, дає файли приблизно вдвічі менші з comma 3X."
  - title: "Кнопки Debug Clip більше немає"
    text: "«Поділитися звітом про помилку» надсилає лише журнали. Збережені вами налагоджувальні кліпи лишаються в Записах."
  - title: "Виправлення"
    text: "Налаштування лишаються на своїй сторінці, коли мультимедійна система перемикається в нічний режим. Телефони в горизонтальному положенні на Android 15 не заходять на виріз камери. Імпорт власного ключа SSH більше не закриває застосунок на мультимедійній системі без засобу вибору файлів."
earlyAccessNote: "Навігація, Surround, В ефір і «Надіслати до CommaView» на ранньому етапі розробки. Ми відкриваємо їх обмеженій групі тестувальників, поки збираємо відгуки, а деякі працюють на платних сервісах, як-от маршрути навігації, тож ми тримаємо групу невеликою, доки не зрозуміємо, скільки коштує звичайне використання. Щоб допомогти з тестуванням, напишіть нам у Discord: ми просимо тестувальників користуватися ними в поїздках і розповідати, як вони працюють."
earlyAccess:
  - title: "Навігація"
    text: "Покрокові підказки від Головної до Live View: знайдіть місце, порівняйте до трьох маршрутів, а далі стежте за карткою повороту, голосовими підказками й — на екрані CommaView — шевронами, намальованими у вашій смузі. Після неправильного повороту новий маршрут з’являється за секунди. Це лише відображення: нічого не надсилається ні на comma, ні в авто, а ваші місця лишаються на телефоні."
  - title: "Surround"
    text: "3D-вигляд дороги довкола вашого авто як четвертий екран водіння: дорога такою, як її бачить камера, з розміткою, перехрестями й пішохідними переходами; легкові авто, вантажівки й автобуси, що плавно рухаються й показують стоп-сигнали; і світлофори, звернені до вас, що світяться своїм кольором. Він запускає власний детектор авто на телефоні — приблизно в 13 разів швидше, ніж раніше, на мультимедійній системі авто."
  - title: "В ефір"
    text: "Транслюйте те, що показує Live View, на свій канал YouTube або інший сервер RTMP у 720p чи 1080p. Увійдіть у YouTube один раз, і «В ефір» сам створить, запустить і завершить трансляцію, зі звуком із мікрофона comma чи телефона, якщо ви його виберете."
  - title: "Надіслати до CommaView"
    text: "Надішліть нам записану поїздку з нотаткою про те, що сталося, із Записів. Вона ніколи не містить камери водія, звуку чи VIN вашого авто."
runtime:
  - title: "Ще два форки"
    text: "Середовище виконання розпізнає SunnyPilot-TeslaHW1 і carrotpilot."
  - title: "Невдале встановлення пояснює причину"
    text: "Інсталятор називає причину, як-от форк, який він не підтримує, тож застосунок може вам її повідомити."
  - title: "Швидше завантаження повторів"
    text: "Застосунок запитує до 4 MiB відео поїздки за раз замість 256 KiB, а телефон на дуже слабкому Wi‑Fi більше не затримує інших відповідей comma."
  - title: "Повтори поїздок, що завершилися непомітно"
    text: "comma повідомляє, коли поїздка запису завершилася, тож застосунок може створити повтор, навіть якщо телефон не бачив її кінця."
  - title: "Мікрофон comma в трансляції"
    text: "Для облікових записів із трансляціями: мікрофон comma йде на телефон лише тоді, коли ви вибрали його для трансляції. Власний запис звуку openpilot не вмикається, а comma ніколи не зберігає звук."
