title: "Трансляції для всіх, надсилання поїздок і більше форків openpilot без гарантій"
out:
  - title: "Трансляції — для всіх"
    text: "Транслюйте те, що показує Live View, на свій канал YouTube або інший сервер RTMP у 720p чи 1080p, зі звуком із мікрофона comma чи телефона, якщо ви його виберете. Налаштуйте в Налаштування › Пряма трансляція. Трансляції стартують як «Не для всіх», і кожен, хто дивиться, бачить, де ви їдете."
  - title: "Надіслати до CommaView — для учасників"
    text: "Надішліть нам одну чи кілька поїздок із Записів з нотаткою про те, що сталося: дорожнє й ширококутне відео та журнал кожної, ніколи — камеру водія, звук чи VIN вашого авто. Один аркуш «Надіслати до CommaView» тепер містить усе, що ви нам надсилаєте, — і проблеми, і ідеї."
  - title: "Кілька поїздок одразу"
    text: "Виберіть поїздки в Записах, щоб поділитися ними, створити їхні повтори, надіслати чи видалити разом."
  - title: "Ваші запити"
    text: "Коли ви повідомляєте про проблему чи надсилаєте ідею, увійшовши в обліковий запис, ми можемо відповісти: Налаштування › Підтримка й діагностика › Ваші запити показує наші відповіді, ви отримуєте email, а розмова продовжується на my.commaview.com."
  - title: "Live View вміщається на будь-якому екрані"
    text: "Його елементи керування більше не прокручуються й не обрізають «Вийти»: те, що не вміщається, переходить у «Більше», а великий текст переносить елементи керування в «Більше» замість того, щоб щось зменшувати. Live View менше навантажує телефон і сам відновлюється замість того, щоб зависати."
  - title: "Перебудовані налаштування"
    text: "«Приватність і обмін» пояснює, що залишає телефон, «Підтримка й діагностика» — місце, щоб повідомити про проблему й знайти свої запити, а «Обліковий запис» закінчується пунктом «Видалити обліковий запис». «Допоможіть покращити CommaView» один раз запитує, чи надсилати звіти про збої і яке ПЗ водіння працює на comma."
  - title: "Таблиця лідерів — для кожного учасника"
    text: "Вона більше не залежить від прапорця функції. Картка на Головній оновлюється щонайбільше раз на 30 хвилин і показує, коли це було востаннє."
  - title: "Підтримати CommaView"
    text: "Налаштування › Підтримка й діагностика › Підтримати CommaView відкриває нашу сторінку Buy Me a Coffee, щоб допомогти покрити хостинг, тестування й застосунок для iOS. Нічого не розблоковує."
  - title: "Виправлення"
    text: "Мультимедійна система на Android 16 більше не закриває CommaView у Live View, коли її відеодекодер дає збій, екран comma 3X від StarPilot малює камеру на мультимедійних системах, де вона була чорною, а вхід через YouTube і трансляції працюють через VPN."
earlyAccessNote: "Навігація, Surround, Surround V2 та Експериментальні інструменти досі на ранньому етапі розробки — для обмеженої групи тестувальників за прапорцями функцій, поки ми збираємо відгуки. Деякі працюють на платних сервісах, як-от маршрути навігації, тож ми тримаємо групу невеликою. Щоб допомогти з тестуванням, напишіть нам у Discord."
earlyAccess:
  - title: "Навігація"
    text: "Карта в Live View під час поїздки — поряд із відео або в його куті, — а без поїздки «Куди їдемо?». На кутовій карті «Завершити» й «Вимкнути звук» завжди під рукою, завершення можна скасувати протягом 8 секунд, а куди їхати, можна сказати голосом."
  - title: "Теми карти"
    text: "Карта навігації тепер має світлу й темну теми, що перемикаються на світанку й на заході сонця там, де перебуває comma, тож її видно й на сонці. Виберіть «Авто», «Як у телефоні», «Світла» або «Темна» в Налаштування › Карти й навігація › Тема карти."
  - title: "Surround і Surround V2"
    text: "Surround ставить припарковане авто на його справжнє місце в повторах і приховує авто, видиме лише камері, яке насправді є авто з радара. Surround V2 — експериментальний другий рендерер, у Налаштування › Експериментальні інструменти."
runtime:
  - title: "Лише сполучені телефони"
    text: "Камери й дані вашого comma йдуть лише на сполучені з ним телефони й мультимедійні системи. Спершу оновіть CommaView на кожному телефоні й мультимедійній системі: той, що лишився на 0.0.164, не отримає відео з comma на цьому середовищі виконання."
  - title: "Внесок у виявлення авто"
    text: "Для учасників: віддавайте цілі поїздки для навчання детектора авто, яким користується Surround, — одним дотиком або автоматично, у мережах, які ви вибрали серед збережених на comma Wi‑Fi і мобільних даних телефона, за бажання з місячним лімітом для кожної. Внесок — назавжди: його не можна видалити пізніше. Ніщо не називає вас чи ваш comma, але маршрут і відео поїздки можуть показати, де ви їздите."
  - title: "Більше форків openpilot, без гарантій"
    text: "CommaView тепер встановлюється на більше форків openpilot без гарантій: налаштування перевіряє форк, якого CommaView не має в списку, нічого не змінюючи, і додає вид CommaView, щойно ви погодитеся. «Видалити середовище виконання» повертає файли форка."
  - title: "Встановлення, що відновлюються"
    text: "Збій живлення чи перезавантаження посеред встановлення повертає попередній випуск, завантаження, що зависло, продовжується з місця зупинки, а встановлення триває, коли застосунок перестає його слухати."
  - title: "Експериментальний режим на новішому openpilot"
    text: "На nightly від openpilot і sunnypilot dev Live View показує експериментальний режим так, як openpilot."
