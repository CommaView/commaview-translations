title: "새 홈, 내 차 이미지, 그리고 한곳에 모은 계정"
out:
  - title: "my.commaview.com의 계정"
    text: "이메일로 받은 코드로 로그인하고, 앱을 내려받고, 새로운 기능을 확인하세요. 이제 베타와 업데이트도 여기서 나옵니다. Firebase App Distribution은 종료되었습니다."
  - title: "계정에서 오는 업데이트"
    text: "앱이 계정에서 새 릴리스를 확인하고 앱 안에서 안내합니다. 앱 릴리스마다 함께 테스트한 런타임이 같이 나옵니다."
  - title: "의견 보내기와 기능 요청 보드"
    text: "앱의 설정에서 아이디어, 문제, 칭찬을 보낼 수 있고, 자세히 봐 주길 원하면 지원 번들을 붙일 수 있습니다. 다음에 무엇을 만들지는 my.commaview.com의 기능 요청 보드에서 투표하세요."
  - title: "내 차의 새 이미지"
    text: "지원하는 모든 차량에 같은 스타일, 같은 크기, 같은 조명의 새 이미지가 생겨 어떤 화면에도 깔끔하게 놓입니다."
next:
  - title: "새 장치 홈"
    text: "무대 위의 내 차와 Live View 열기를 카드 하나에 담고, 그 아래에 이번 주 주행, 차량 위치, 최근 녹화를 보여 줍니다."
  - title: "태블릿과 헤드 유닛에 맞춤"
    text: "넓은 화면에서는 홈이 대시보드가 되고, 설정과 장치 설정이 목록 옆에 열립니다."
runtime:
  - title: "주행 통계"
    text: "comma 자체 로그에서 그 주의 주행 거리, 주행 시간, 주행 횟수를 보여 줍니다."
  - title: "차량 위치"
    text: "운전하는 동안 차가 있는 곳과 주차한 곳. 직접 켜기 전까지는 꺼져 있습니다."
