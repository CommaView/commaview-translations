title: "새롭게 디자인한 CommaView, 자체 오버레이, 리더보드"
out:
  - title: "새롭게 디자인한 앱"
    text: "홈, Live View, 녹화, 설정, 페어링, 설정 과정까지 모든 화면을 새 디자인으로 다시 만들었습니다. 새 아이콘과 시작 화면, 그리고 밝은 날을 위한 주간 모드도 함께합니다."
  - title: "새 홈"
    text: "무대 위의 내 차와 Live View 열기, 그 아래에 이번 주 주행, 차량 위치, 최근 녹화, 리더보드. 홈 맞춤 설정으로 배치를 바꿀 수 있습니다. comma는 저절로 연결됨으로 표시되며, 다시 연결을 누를 필요가 없습니다."
  - title: "태블릿과 헤드 유닛에 맞춤"
    text: "넓은 화면에서는 홈이 대시보드가 되고, 설정과 녹화가 목록 옆에 열리며, 페어링은 어떤 헤드 유닛에도 맞습니다."
  - title: "CommaView 오버레이"
    text: "자체 주행 화면입니다. 속도, MAX, 제한 속도를 클러스터 하나에 모으고, 차선은 모델의 확신 정도를 보여 주며, 운전자 모니터링과 경고는 방해되지 않게 표시하고, 해당하는 곳에서는 캐나다의 MAXIMUM 표지판도 보여 줍니다. comma 3X와 comma four 화면도 있으며, Live View에서 바로 화면을 바꿀 수 있습니다."
  - title: "더 간단해진 디스플레이 설정"
    text: "실시간 미리 보기가 있는 주행 오버레이 섹션 하나로 정리했고, CommaView가 미리 선택되어 있습니다."
  - title: "더 나아진 녹화"
    text: "다시 보기가 Live View와 똑같이 보이고, 앱에서 재생되며, 차가 P단에 있을 때도 만들 수 있습니다. 만드는 동안 진행 상황이 표시됩니다. 주행마다 썸네일이 있고, comma가 주행을 지우기 전에 경고합니다."
  - title: "모든 기기에서 녹화"
    text: "녹화가 페어링한 휴대폰과 헤드 유닛 사이에서 따라다닙니다."
  - title: "주행 통계와 차량 위치"
    text: "comma 자체 로그에서 그 주의 주행 거리, 주행 시간, 주행 횟수를, 그리고 차가 있는 곳과 주차한 곳을 어두운 지도에 보여 줍니다. 위치는 직접 켜기 전까지 꺼져 있습니다."
  - title: "장치 페이지"
    text: "comma의 상태와 런타임을 한곳에서 봅니다. 여기서 Live View를 열고, Wi-Fi 절전을 관리하고, 복구하고, 도움이 필요할 때 로그를 공유할 수 있습니다."
  - title: "앱 안에서 업데이트"
    text: "앱 업데이트는 백그라운드에서 내려받고, 모든 화면에 업데이트 버튼이 나옵니다. 런타임 업데이트, 복구, 제거에 SSH가 필요 없습니다. 업데이트마다 진행 단계를 보여 주고, 홈에서도 상황을 알려 줍니다. 운전 중에 할 수 없는 일은 차가 P단에 있을 때까지 기다립니다."
  - title: "리더보드"
    text: "홈에서 표시 이름을 정해 참여하면 이번 주 시상대, 지난주 결과, 누적 순위를 볼 수 있습니다. 배지는 comma가 직접 기록한 거리로 얻고, comma.ai 누적 보드에는 comma.ai가 내 comma에 대해 가진 합계가 나옵니다."
  - title: "충돌 보고서"
    text: "개인 정보를 지운 채로 문제를 더 빨리 고치는 데 도움이 됩니다. 설정에서 끌 수 있습니다."
  - title: "수정 사항"
    text: "comma four의 MAX 속도가 작동 중에 깜빡이지 않습니다. comma 3에서는 이제 지원하지 않는다고 분명히 알립니다. CommaView는 comma 3X와 comma four에서 작동합니다."
runtime:
  - title: "집에서도 P단에서 업데이트"
    text: "openpilot을 해제하고 차를 P단에 켜 두거나, 책상 위에서 comma를 설정하세요. 주행이 중단되는 일은 없습니다."
  - title: "더 안전한 업데이트"
    text: "한 번에 하나씩 진행하며, 문제가 생기면 comma가 원래 버전으로 돌아갑니다."
  - title: "새 기능을 움직이는 것"
    text: "주행 통계, 차량 위치, 기기 간 녹화, 리더보드 동기화는 모두 새 런타임에서 옵니다. 앱이 대신 설치합니다."
