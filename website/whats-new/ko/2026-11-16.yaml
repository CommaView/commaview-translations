title: "휴대폰마다 키, 11개 언어 추가, Browser View"
out:
  - title: "내 언어로 쓰는 CommaView"
    text: "설정 › 언어: 영어와 함께 Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文, 繁體中文. 기계 번역이며 아직 원어민의 검토를 받지 않았으니, 어색한 곳이 있으면 알려 주세요. comma 자체의 화면은 comma의 언어를 따릅니다."
  - title: "Browser View"
    text: "Tesla를 포함해 차량 웹 브라우저에서 Live View를 봅니다. Live View의 세부 정보에서 시작하고 차량 브라우저에 짧은 링크를 입력하세요. 영상은 휴대폰에서 핫스팟을 거쳐 차로 가며, 인터넷을 거치지 않습니다."
  - title: "이 순간 저장"
    text: "Live View의 저장은 주행의 직전 3분과 다음 1분을, 주차한 뒤 복사해 휴대폰에 MP4로 남깁니다."
  - title: "전체 주행 내보내기…와 주행 자동 가져오기"
    text: "주행 전체를 MP4 하나로 복사하거나, 새 주행을 고른 Wi‑Fi에서 약 30분마다 정해 둔 공간까지 휴대폰으로 복사합니다."
  - title: "오버레이 팩 스토어"
    text: "팩은 포크가 자기 화면에 그리는 것을 Live View에 더합니다. 회원은 공식과 커뮤니티 팩, 그리고 내 comma용을 둘러볼 수 있고, 누구나 파일이나 링크로 팩을 추가할 수 있습니다."
  - title: "내 Stadia Maps 키로 내비게이션"
    text: "회원용: 어디로 갈까요?, 경로, 턴바이턴 안내를 내 Stadia Maps 계정으로 쓰며, 키는 휴대폰 안에 봉인됩니다."
  - title: "CommaView 자동으로 열기"
    text: "헤드 유닛이 켜질 때, Bluetooth가 연결될 때 열리고, comma가 연결되면 바로 Live View로 들어갑니다. 모두 설정 › 디스플레이에서 켜기 전까지 꺼져 있습니다."
  - title: "내 포크 개발자와 공유…"
    text: "그 구간의 클립, 요약, CommaView 로그를 Android 공유 시트로 포크가 보고를 받는 곳에 공유합니다. CommaView로는 아무것도 가지 않습니다."
  - title: "Live View가 상황을 알려 줍니다"
    text: "comma에 필요한 재시작을 기다리고, 차량 데이터가 끊기거나 영상이 지연되면 알려 주고, 다시 연결하는 이유를 말하며, 다른 영상 디코더를 시도해 더 많은 헤드 유닛에서 재생합니다."
  - title: "CommaView 업데이트"
    text: "회원용, 0.0.166부터: 업데이트가 버전을 보여 주고, 취소할 수 있으며, 백그라운드에서 계속 내려받습니다."
  - title: "수정 사항"
    text: "짧은 창에서 큰 글자를 써도 잘리는 것이 없고, 소리를 끄면 라이브 방송이 조용히 유지되며, 도중에 comma 전원이 끊긴 주행의 다시 보기는 끊기기 직전까지 모두 씁니다."
earlyAccessNote: "X, Twitch, Kick, Facebook으로 라이브 방송, 영상 전용, 포크 설정, 오버레이 팩 만들기, Surround는 의견을 모으는 동안 기능 플래그 뒤에서 제한된 테스터 그룹에게만 공개합니다. 테스트를 돕고 싶다면 Discord로 연락해 주세요."
earlyAccess:
  - title: "더 많은 플랫폼으로 라이브 방송"
    text: "X, Twitch, Kick, Facebook. 실제 계정으로 방송해 보기 전까지 각각 별도의 플래그 뒤에 있습니다."
  - title: "영상 전용"
    text: "CommaView가 화면을 추가할 수 없는 FrogPilot과 KisaPilot용으로, 카메라와 주행 데이터를 CommaView 고유 화면으로 보여 줍니다. 포크에서는 아무것도 바꾸지 않습니다."
  - title: "포크 설정"
    text: "주행 소프트웨어 자체의 설정을 comma의 장치 설정에서 주차 중에 바꾸며, 백업은 휴대폰에 남습니다."
runtime:
  - title: "휴대폰마다 키"
    text: "각 휴대폰이 comma용 키를 알아서 따로 받으며, 아무도 다시 페어링할 필요가 없습니다. 이전 앱의 휴대폰은 첫 휴대폰이 키를 받은 뒤 90일 동안 계속 작동하고, 그 뒤에는 0.0.166과 초대 코드가 필요합니다."
  - title: "BluePilot, dragonpilot, OPGM"
    text: "이제 목록의 포크로, 이름을 표시하고 바탕이 된 포크의 모습으로 그립니다."
  - title: "검증된 설치, 이전 버전으로 되돌리지 않음"
    text: "앱이 설치하기 전에 각 런타임의 서명을 확인하고, comma는 더 오래된 런타임을 거부합니다."
  - title: "carrotpilot과 StarPilot 7.0"
    text: "carrotpilot 화면을 더 많이, 한국어, 일본어, 중국어, 태국어에서는 carrotpilot 자체 글꼴로 그립니다. StarPilot 7.0 개발 브랜치도 제한 지원합니다."
