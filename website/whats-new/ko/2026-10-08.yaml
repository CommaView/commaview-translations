title: "오프라인 지도와 제한 속도, 지역별 표지판, 다시 보기 대기열"
out:
  - title: "오프라인 지도와 제한 속도"
    text: "설정 › 오프라인 지도에서 국가나 미국의 주를 내려받으면, comma의 위치가 켜져 있을 때 CommaView가 comma의 실시간 GPS로 제한 속도를 보여 줍니다. 다운로드는 일시 중지, 다시 시작, 업데이트할 수 있으며, 제한 속도는 표시 전용입니다."
  - title: "운전하는 곳에 맞는 제한 속도 표지판"
    text: "CommaView의 표지판은 comma의 위치에 따라 일곱 가지 스타일 중 하나를 씁니다. 영국과 대만을 포함해 대부분의 나라에서 쓰는 빨간 원 표지판, 또는 미국, 캐나다, 일본, 스웨덴, 핀란드와 아이슬란드, 아일랜드와 브라질, 오스트레일리아의 표지판입니다."
  - title: "조향 초승달"
    text: "CommaView 오버레이의 속도 클러스터 아래에 있는 초승달이 openpilot이 얼마나 세게 조향하는지 보여 주며, 클러스터에는 유리 같은 모습이 돌아왔습니다. MAX와 제한 속도는 알 수 없을 때도 제자리에 있습니다."
  - title: "화면 채우기 또는 카메라 전체"
    text: "가로 화면에서 CommaView 오버레이는 카메라 영상을 잘라 화면을 채우거나, 카메라 전체로 영상 전체를 보여 줍니다. 새 녹화는 고른 자르기 방식을 따릅니다."
  - title: "다시 보기 대기열"
    text: "여러 주행을 대기열에 넣으면 다시 보기가 백그라운드에서 만들어지고, 연결이 끊겨도 멈춘 곳부터 이어 갑니다. 녹화의 대기열에서 일시 중지, 다시 시작, 다시 시도, 순서 변경을 할 수 있습니다."
  - title: "어떤 화면에도 맞는 녹화와 지도"
    text: "녹화와 오프라인 지도 보관함을 휴대폰, 태블릿, 헤드 유닛에 맞게 다시 디자인했고, 차량 위치도 이제 짧은 화면과 큰 글자에 맞습니다."
  - title: "더 분명해진 녹화 문제"
    text: "주행을 다시 보기로 만들 수 없으면 녹화가 그 이유를 알려 주며, 거기서 보낸 보고서에는 살펴보는 데 필요한 세부 정보가 들어갑니다."
  - title: "홈과 리더보드"
    text: "오프라인일 때도 이번 주 주행과 차량 위치가 홈에 남고, 홈에 이번 주 시상대가 나옵니다. 리더보드에 참여하면 comma의 핫스팟에서도 합계가 저절로 동기화됩니다."
  - title: "앱 업데이트 없이 런타임 업데이트"
    text: "호환되는 런타임이 나오면 새 앱을 기다리지 않고 comma의 런타임을 업데이트할 수 있으며, 진행 상황도 더 분명해졌습니다."
  - title: "베타 로그인"
    text: "베타 기간에 CommaView는 초대받은 계정으로 로그인하도록 요청합니다. 페어링과 설정은 그대로 유지되며, 이용권이 유효한 동안에는 오프라인에서도 앱이 작동합니다."
  - title: "더 분명해진 Wi-Fi 절전"
    text: "comma의 Wi-Fi 절전은 시스템 기본값을 보여 주는 단순한 켜기/끄기 선택이 되었고, 변경이 언제 적용되는지 알려 줍니다."
runtime:
  - title: "앱에서 재시작"
    text: "업데이트 때문에 comma를 다시 시작해야 하면, 앱의 지금 comma 재시작으로 대신 재시작할 수 있습니다. 차가 꺼져 있거나 주차 중일 때만 작동합니다."
  - title: "최신 GPS로 제한 속도"
    text: "sunnypilot에서는 comma가 저장해 둔 위치 대신 가장 최근의 GPS 측위를 보내므로, 오프라인 지도의 제한 속도가 현재 위치를 따라갑니다."
  - title: "더 분명해진 주행 상태"
    text: "comma가 아직 완료되지 않은 주행과 사라진 주행을 구분해 알려 주므로 녹화가 어느 쪽인지 설명할 수 있고, 끝난 주행을 온전하게 유지합니다."
