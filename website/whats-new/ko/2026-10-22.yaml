title: "포크 두 개 추가, 실시간 사본, 내비게이션과 Surround 얼리 액세스"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView가 Tesla HW1 차량용 sunnypilot 포크인 이 포크에 설치되며, 이름을 표시하고 sunnypilot이 더한 모든 요소와 함께 sunnypilot 화면을 그립니다."
  - title: "carrotpilot"
    text: "CommaView가 Hyundai, Kia, Genesis 차량용 openpilot 포크인 이 포크에 설치되며 openpilot 화면을 그립니다. 내비게이션이나 과속 단속 카메라처럼 carrotpilot이 자체 화면에 더하는 것은 아직 그리지 않습니다. carrotpilot이 스스로 업데이트하면 앱이 재시작을 요청하고, 재시작하면 Live View가 돌아옵니다."
  - title: "실시간 사본"
    text: "설정 › 녹화 › Live View에서 녹화에서 녹화가 무엇을 만들지 고릅니다. 주행 후의 다시 보기(예전처럼 가장 좋은 화질, 최대 10분), 멈추는 순간 바로 볼 수 있고 10분 제한이 없는 Live View 화면의 실시간 사본, 또는 둘 다입니다. 실시간 사본은 720p나 1080p이며, 휴대폰을 잠가도 계속되고, 저장 공간이 바닥나기 전에 깔끔하게 멈추며, 휴대폰에 남습니다."
  - title: "화면 전체를 쓰는 설정"
    text: "녹화, 디스플레이, 라이브 방송은 공간이 되면 두 열로 화면 전체를 쓰고, 설정 목록은 각 페이지에 무엇이 있는지 알려 주며, 태블릿, 헤드 유닛, 가로로 든 휴대폰에서도 모든 페이지가 가지런히 정렬됩니다."
  - title: "이용 권한 새로고침"
    text: "설정 › 계정 › 이용 권한 및 기능에서 이용 권한이 언제 갱신되는지 알려 주며, 이용 권한 새로고침으로 최대 하루가 걸리던 기능 켜기/끄기를 바로 반영합니다."
  - title: "설치가 실패한 이유"
    text: "설정, 런타임 업데이트, 제거가 실패하면 앱이 무엇이 잘못되었고 어떻게 해야 하는지(CommaView가 지원하지 않는 포크, 주행 중인 차, comma의 인터넷 연결 없음), comma가 원래대로 되돌려졌는지 알려 주며, 세부 정보 복사로 지원팀에 필요한 보고서를 복사합니다."
  - title: "업데이트 카드는 하나로"
    text: "런타임 업데이트는 홈의 업데이트 카드에만 나옵니다. 실패한 업데이트는 다시 시도와 닫기와 함께 거기에 나옵니다."
  - title: "더 빨라진 다시 보기"
    text: "다시 보기는 보여 줄 부분의 영상만 내려받고, 하나를 만드는 동안 다음 주행을 내려받으며, Android 9 이상에서는 GPU가 HUD를 그립니다. 앱 종료, 10분 제한, 차량 시동 꺼짐으로 중간에 끊긴 녹화에도 이제 다시 보기 만들기가 나옵니다."
  - title: "다시 보기 화질이 다시 작동"
    text: "Balanced, High, Max가 다시 서로 다른 다시 보기를 만듭니다. 그동안 모든 다시 보기가 40 Mbit/s로 만들어졌습니다. 기본값인 High는 comma 3X에서 파일 크기가 약 절반입니다."
  - title: "디버그 클립 버튼 제거"
    text: "버그 보고서 공유는 로그만 보냅니다. 보관해 둔 디버그 클립은 녹화에 남습니다."
  - title: "수정 사항"
    text: "헤드 유닛이 야간 모드로 바뀌어도 설정이 같은 페이지에 머뭅니다. Android 15에서 가로로 든 휴대폰은 카메라 노치를 피해 표시합니다. 파일 선택기가 없는 헤드 유닛에서 내 SSH 키를 가져와도 앱이 닫히지 않습니다."
earlyAccessNote: "내비게이션, Surround, 라이브 방송, CommaView로 보내기는 초기 개발 단계입니다. 의견을 모으는 동안 제한된 테스터 그룹에게 공개하며, 내비게이션의 경로처럼 일부는 유료 서비스로 작동하므로 일반적인 사용에 비용이 얼마나 드는지 알 때까지 그룹을 작게 유지합니다. 테스트를 돕고 싶다면 Discord로 연락해 주세요. 테스터께는 실제 주행에서 써 보고 어땠는지 알려 주시길 부탁드립니다."
earlyAccess:
  - title: "내비게이션"
    text: "홈에서 Live View까지 이어지는 턴바이턴 안내입니다. 장소를 검색하고, 경로를 최대 세 개까지 비교한 다음, 회전 카드, 음성 안내, 그리고 CommaView 화면에서는 차선에 그려진 화살표를 따라가세요. 길을 잘못 들면 몇 초 안에 새 경로를 찾습니다. 표시 전용이며, comma나 차량에는 아무것도 보내지 않고, 장소는 휴대폰에 남습니다."
  - title: "Surround"
    text: "차 주변 도로를 3D로 보여 주는 네 번째 주행 화면입니다. 카메라가 보는 도로를 차선, 교차로, 횡단보도까지 그리고, 부드럽게 움직이며 브레이크등을 켜는 승용차, 트럭, 버스, 그리고 나를 향한 신호등을 보이는 색으로 켜서 보여 줍니다. 휴대폰에서 자체 차량 감지기를 실행하며, 차량 헤드 유닛에서 예전보다 약 13배 빠릅니다."
  - title: "라이브 방송"
    text: "Live View가 보여 주는 것을 YouTube 채널이나 다른 RTMP 서버로 720p 또는 1080p로 방송합니다. YouTube에 한 번 로그인하면 라이브 방송이 방송을 만들고, 시작하고, 끝내며, 고르면 comma의 마이크나 휴대폰 마이크의 소리도 들어갑니다."
  - title: "CommaView로 보내기"
    text: "녹화에서 무슨 일이 있었는지 메모를 붙여 녹화한 주행을 저희에게 보냅니다. 운전자 카메라, 소리, 차량의 VIN은 절대 포함되지 않습니다."
runtime:
  - title: "포크 두 개 추가"
    text: "런타임이 SunnyPilot-TeslaHW1과 carrotpilot을 인식합니다."
  - title: "설치 실패 이유를 알림"
    text: "설치 프로그램이 지원하지 않는 포크 같은 원인을 밝혀, 앱이 알려 줄 수 있습니다."
  - title: "더 빠른 다시 보기 다운로드"
    text: "앱이 주행 영상을 예전의 256 KiB 대신 한 번에 최대 4 MiB씩 요청하며, Wi-Fi가 아주 약한 휴대폰이 comma의 다른 응답을 붙잡지 않습니다."
  - title: "끝을 보지 못한 주행의 다시 보기"
    text: "comma가 녹화의 주행이 끝났다고 알려 주므로, 휴대폰이 끝나는 것을 보지 못했어도 앱이 다시 보기를 만들 수 있습니다."
  - title: "방송에 comma 마이크"
    text: "라이브 방송이 켜진 계정용: comma의 마이크는 방송용으로 골랐을 때만 휴대폰으로 갑니다. openpilot 자체 오디오 녹음은 켜지지 않으며, comma는 소리를 저장하지 않습니다."
