title: "모두를 위한 라이브 방송, 주행 보내기, 더 많은 openpilot 포크 제한 지원"
out:
  - title: "모두를 위한 라이브 방송"
    text: "Live View가 보여 주는 것을 YouTube 채널이나 다른 RTMP 서버로 720p 또는 1080p로 방송하며, 고르면 comma의 마이크나 휴대폰 마이크의 소리도 들어갑니다. 설정 › 라이브 방송에서 설정하세요. 방송은 일부 공개로 시작하며, 시청자는 내가 어디를 달리는지 볼 수 있습니다."
  - title: "회원을 위한 CommaView로 보내기"
    text: "녹화에서 무슨 일이 있었는지 메모를 붙여 주행 하나 또는 여러 개를 저희에게 보냅니다. 각 주행의 도로 카메라와 광각 카메라 영상, 로그가 가며, 운전자 카메라, 소리, 차량의 VIN은 절대 가지 않습니다. 이제 CommaView로 보내기 시트 하나가 문제든 아이디어든 저희에게 보내는 모든 것을 담습니다."
  - title: "여러 주행을 한 번에"
    text: "녹화에서 주행을 선택해 함께 공유하거나, 다시 보기를 만들거나, 보내거나, 삭제할 수 있습니다."
  - title: "내 요청"
    text: "로그인한 상태에서 문제를 신고하거나 아이디어를 보내면 저희가 답장할 수 있습니다. 설정 › 지원 및 진단 › 내 요청에 답장이 표시되고, 이메일도 받으며, 대화는 my.commaview.com에서 이어집니다."
  - title: "어떤 화면에도 맞는 Live View"
    text: "조작 버튼이 더 이상 스크롤되거나 나가기를 가리지 않습니다. 들어가지 않는 것은 더 보기로 가고, 글자를 키워도 무언가를 줄이는 대신 조작 버튼을 더 보기로 옮깁니다. Live View는 휴대폰 부담이 줄었고, 멈추지 않고 스스로 다시 작동합니다."
  - title: "새로 정리한 설정"
    text: "개인정보 및 공유에서 휴대폰 밖으로 무엇이 나가는지 알 수 있고, 지원 및 진단에서 문제를 신고하고 내 요청을 볼 수 있으며, 계정 맨 아래에는 계정 삭제가 있습니다. CommaView 개선에 참여에서 충돌 보고서와 comma가 실행하는 주행 소프트웨어를 보낼지 한 번만 묻습니다."
  - title: "모든 회원을 위한 리더보드"
    text: "더 이상 기능 플래그에 의존하지 않습니다. 홈의 카드는 최대 30분마다 새로고침되며, 마지막으로 새로고침한 때를 알려 줍니다."
  - title: "CommaView 후원"
    text: "설정 › 지원 및 진단 › CommaView 후원에서 저희 Buy Me a Coffee 페이지가 열립니다. 호스팅, 테스트, iOS 앱 비용에 도움이 됩니다. 후원해도 잠금 해제되는 기능은 없습니다."
  - title: "수정 사항"
    text: "Android 16 헤드 유닛에서 영상 디코더가 실패해도 Live View에서 CommaView가 닫히지 않고, StarPilot의 comma 3X 화면이 카메라를 검게 보여 주던 헤드 유닛에서도 영상을 그리며, VPN을 거쳐도 YouTube 로그인과 라이브 방송이 작동합니다."
earlyAccessNote: "내비게이션, Surround, Surround V2, 실험적 도구는 아직 초기 개발 단계이며, 의견을 모으는 동안 기능 플래그 뒤에서 제한된 테스터 그룹에게만 공개합니다. 내비게이션의 경로처럼 일부는 유료 서비스로 작동하므로 그룹을 작게 유지합니다. 테스트를 돕고 싶다면 Discord로 연락해 주세요."
earlyAccess:
  - title: "내비게이션"
    text: "이동 중에는 Live View에 지도를 영상 옆이나 모서리에 보여 주고, 이동 중이 아닐 때는 어디로 갈까요?를 보여 줍니다. 모서리 지도에는 종료와 음소거가 항상 있고, 종료는 8초 동안 되돌릴 수 있으며, 목적지를 말로 정할 수도 있습니다."
  - title: "지도 테마"
    text: "내비게이션 지도에 밝게와 어둡게 테마가 생겼습니다. comma가 있는 곳의 일출과 일몰에 맞춰 바뀌므로 햇빛 아래에서도 잘 보입니다. 설정 › 지도 및 내비게이션 › 지도 테마에서 자동, 휴대폰과 동일, 밝게, 어둡게 중에서 고르세요."
  - title: "Surround와 Surround V2"
    text: "Surround는 다시 보기에서 주차된 차를 제자리에 두고, 사실은 레이더가 잡은 차인 카메라 전용 차를 숨깁니다. Surround V2는 실험적인 두 번째 렌더러로, 설정 › 실험적 도구에 있습니다."
runtime:
  - title: "페어링한 휴대폰에만"
    text: "comma의 카메라와 데이터는 페어링한 휴대폰과 헤드 유닛에만 전달됩니다. 먼저 모든 휴대폰과 헤드 유닛에서 CommaView를 업데이트하세요. 0.0.164에 머문 기기는 이 런타임의 comma에서 영상을 받지 못합니다."
  - title: "차량 감지에 기여"
    text: "회원용: Surround가 쓰는 차량 감지기를 학습시키도록 주행 전체를 줄 수 있습니다. 탭 한 번으로, 또는 자동으로, comma에 저장된 Wi-Fi와 휴대폰 모바일 데이터 중 고른 네트워크에서 하며, 원하면 각각 월 한도를 정할 수 있습니다. 기여는 되돌릴 수 없어 나중에 삭제할 수 없습니다. 나나 내 comma의 이름은 들어가지 않지만, 주행 경로와 영상으로 내가 어디를 다니는지 알 수 있습니다."
  - title: "더 많은 openpilot 포크, 제한 지원"
    text: "이제 CommaView는 더 많은 openpilot 포크에 제한 지원으로 설치됩니다. 설정은 CommaView 목록에 없는 포크를 아무것도 바꾸지 않고 점검하고, 동의하면 CommaView 화면을 추가합니다. 런타임 제거로 포크의 파일이 원래대로 돌아갑니다."
  - title: "복구되는 설치"
    text: "설치 중 전원이 끊기거나 재시작되면 이전 릴리스로 돌아가고, 멈춘 다운로드는 멈춘 곳부터 이어 받으며, 앱이 더 이상 응답을 기다리지 않아도 설치는 계속됩니다."
  - title: "새 openpilot의 실험 모드"
    text: "openpilot nightly와 sunnypilot dev에서 Live View가 openpilot처럼 실험 모드를 표시합니다."
