title: "StarPilot, 포크에 맞춘 화면, 새 리더보드"
out:
  - title: "StarPilot"
    text: "이제 CommaView는 StarPilot 자체 설치 프로그램으로 설치한 comma 3X와 comma four의 StarPilot에서 작동합니다. Live View는 운전자 카메라를 포함해 StarPilot의 Camera View를 따르고, Disable Logging 설정 때문에 영상이 멈추면 알려 줍니다."
  - title: "포크에 맞춘 화면"
    text: "comma four와 comma 3X 화면은 포크가 comma에 그리는 것을 그대로 그립니다. 글꼴, 경고, 카메라 색 보정입니다. StarPilot에서는 제한 속도 표지판, 앞차 정보, 내비게이션 카드, 개발자 사이드바 같은 StarPilot 고유의 HUD, 경로, 위젯도 그립니다."
  - title: "디스플레이에서 화면 선택"
    text: "설정 › 디스플레이의 드롭다운에서 주행 화면을 고르고, 미리 보기에서 내 comma의 포크와 카메라를 볼 수 있습니다."
  - title: "Live View의 모든 프레임"
    text: "Live View는 일부를 건너뛰던 것과 달리 이제 comma가 보내는 모든 프레임을 초당 최대 20프레임까지 그립니다. comma 3X 화면은 휴대폰의 GPU로 그리므로(Android 9 이상) 영상에 뒤처지지 않습니다."
  - title: "스스로 회복하는 Live View"
    text: "더 이상 “Reconnecting… Attempt 1”에서 멈추지 않고, 차가 꺼져 있으면 기다렸다가 차가 켜지면 알아서 영상을 엽니다. 영상이 시작될 때 “openpilot Unavailable”이 잠깐 뜨는 대신, 상태 패널 하나가 버튼과 함께 상황을 알려 줍니다."
  - title: "런타임 업데이트 후 재시작"
    text: "comma의 런타임을 설치하거나 업데이트하면 앱이 재시작 버튼으로 재시작을 요청하고, 재시작할 때까지 Live View와 녹화는 기다립니다. comma가 저절로 재시작하는 일은 없습니다. 홈의 업데이트 카드는 작아졌으며, 누르면 모든 단계를 볼 수 있습니다."
  - title: "바로바로 반영되는 홈"
    text: "홈은 당겨서 새로고침하지 않아도 각 comma가 있는지 몇 초 안에 보여 주고, 확인하는 동안 확인 중이라고 표시합니다. 새 앱 업데이트는 나온 뒤 곧, 앱으로 돌아올 때마다 나타납니다."
  - title: "새롭게 디자인한 리더보드"
    text: "이번 주, 지난주, 누적의 순위와 업적. 바로 위 comma와의 차이, 다음 업적까지 남은 것, 얻을 수 있는 업적 17개를 모두 보여 줍니다. 프로필에는 내 기록과 설정이 모이고, 태블릿과 헤드 유닛에서는 보드 옆에 나 패널이 계속 보입니다."
  - title: "참여하기 전에 보는 시상대"
    text: "홈에 이번 주 시상대가 메달과 함께 세 단으로 나오며, 참여하기 전에 리더보드를 볼 수 있습니다."
  - title: "차분해진 다시 보기 대기열"
    text: "주행마다 진행 상황, 일시 중지, 다시 시작, 다시 시도, 그리고 옮기기, 신고, 제거 메뉴가 있는 한 줄이 되었고, 끌어서 순서를 바꿀 수 있습니다. 진행 상황이 99%에서 멈추지 않으며, 완성된 다시 보기 저장은 별도 단계로 표시됩니다."
  - title: "Live View와 같은 다시 보기"
    text: "다시 보기는 Live View처럼 포크 화면과 오프라인 지도의 제한 속도 표지판을 그리고, comma가 HUD 데이터를 저장하지 않은 순간을 표시합니다."
  - title: "더 나아진 오프라인 지도"
    text: "지도 추가의 검색이 화면 키보드로 작동하고, Android 15에서도 다운로드 버튼이 화면에 남으며, 다운로드는 백그라운드에서 계속됩니다. 지도에 답이 없는 곳에서는 표지판에 sunnypilot의 제한 속도를 보여 줍니다."
  - title: "수정 사항"
    text: "시계가 틀린 휴대폰이나 헤드 유닛 때문에 베타에서 막히는 일이 없어졌습니다. sunnypilot의 녹색 신호와 앞차 출발 경고에 항상 원이 표시되고, CommaView 제한 속도 표지판의 숫자가 거의 붙어 보이던 문제도 고쳤습니다."
runtime:
  - title: "모든 주행을 기록"
    text: "comma가 운전하는 동안 주행을 기록하므로, 차와 함께 꺼져도 시간을 알기 전에 시작된 주행까지 남습니다. 리더보드의 이번 주는 주행 중에 채워집니다."
  - title: "StarPilot과 포크 화면"
    text: "런타임이 StarPilot에 설치되고, High Bitrate Recording이나 Konik 설정으로 저장된 주행을 찾으며, 포크 화면이 그리는 것을 보내 comma four와 comma 3X 화면이 맞출 수 있게 합니다."
  - title: "Live View가 카메라를 되찾음"
    text: "휴대폰이나 헤드 유닛이 다시 연결되면 바로 카메라를 되찾고, 네트워크에서 빠진 기기는 약 10초 안에 카메라를 놓아줍니다."
  - title: "comma 부담 줄이기"
    text: "런타임이 openpilot의 텔레메트리를 직접 만들어 작은 형태로 보내고, HUD 데이터는 녹화 전후에만 보관하며, comma가 있는지 몇 초 안에 앱에 알려 줍니다. comma가 바빠도 녹화가 실패하지 않습니다."
  - title: "계속 쓸 수 있는 다시 보기"
    text: "주차 중 comma가 재시작해도 끝난 주행이 손상된 것으로 표시되지 않으며, 긴 주행 하나가 다른 주행의 다시 보기를 막지 않습니다."
