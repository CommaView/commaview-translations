title: "StarPilot, des écrans fidèles à votre fork, et un nouveau classement"
out:
  - title: "StarPilot"
    text: "CommaView fonctionne désormais avec StarPilot sur le comma 3X et le comma four, installé depuis l'installateur propre à StarPilot. Live View suit sa Camera View, caméra conducteur comprise, et vous prévient quand son réglage Disable Logging a arrêté la vidéo."
  - title: "Des écrans fidèles à votre fork"
    text: "Les écrans du comma four et du comma 3X dessinent ce que votre fork dessine sur le comma : sa police, ses alertes et le rendu qu'il donne à la caméra. Sur StarPilot, ils apportent son propre HUD, sa trajectoire et ses widgets, comme son panneau de limitation de vitesse, les infos du véhicule de tête, sa carte de navigation et sa barre latérale développeur."
  - title: "Choisir un écran dans Affichage"
    text: "Paramètres › Affichage choisit l'écran de conduite dans un menu déroulant, et son aperçu montre le fork et les caméras de votre propre comma."
  - title: "Chaque image dans Live View"
    text: "Live View dessine maintenant chaque image envoyée par le comma, jusqu'à 20 par seconde, là où il en sautait certaines. L'écran du comma 3X est dessiné par le GPU du téléphone (Android 9 et plus récent), pour suivre la vidéo."
  - title: "Un Live View qui se rétablit"
    text: "Il ne reste plus bloqué sur « Reconnecting… Attempt 1 », et voiture éteinte, il attend et ouvre la vidéo de lui-même au démarrage de la voiture. Un seul panneau d'état dit ce qui se passe, avec ses boutons, au lieu d'un éclair « openpilot Unavailable » au lancement de la vidéo."
  - title: "Un redémarrage après les mises à jour du runtime"
    text: "Après l'installation ou la mise à jour du runtime de votre comma, l'application vous demande de le redémarrer avec un bouton Redémarrer, et Live View et Enregistrer attendent que vous le fassiez ; le comma ne redémarre jamais tout seul. La carte de mise à jour de l'Accueil est plus petite : touchez-la pour voir chaque étape."
  - title: "L'Accueil suit le rythme"
    text: "L'Accueil montre en quelques secondes si chaque comma est là, sans tirer pour actualiser, et affiche Vérification pendant qu'il regarde. Une nouvelle mise à jour de l'application apparaît peu après sa sortie, chaque fois que vous revenez dans l'application."
  - title: "Un classement repensé"
    text: "Classement et Succès, pour Cette semaine, Semaine dernière ou Total : l'écart avec le comma juste devant vous, ce qui reste pour votre prochain succès, et les 17 à gagner. Votre profil rassemble vos chiffres et vos réglages, et les tablettes et systèmes multimédias gardent un panneau Vous à côté du classement."
  - title: "Le podium avant de participer"
    text: "L'Accueil montre le podium de la semaine sur trois marches avec leurs médailles, et vous pouvez regarder le classement avant d'y participer."
  - title: "Une file de relectures plus calme"
    text: "Chaque trajet est une ligne avec sa progression, Pause, Reprendre ou Réessayer, et un menu pour le déplacer, le signaler ou le retirer, et vous pouvez faire glisser les trajets dans un nouvel ordre. La progression ne s'arrête plus à 99 % : l'enregistrement de la relecture terminée apparaît comme une étape à part."
  - title: "Des relectures fidèles à Live View"
    text: "Les relectures dessinent l'écran de votre fork et le panneau de limitation de vitesse des cartes hors ligne comme le faisait Live View, et signalent les moments pour lesquels le comma n'a pas gardé de données HUD."
  - title: "De meilleures cartes hors ligne"
    text: "La recherche dans Ajouter une carte fonctionne avec le clavier à l'écran, Télécharger reste à l'écran sur Android 15, et les téléchargements continuent en arrière-plan. Là où vos cartes n'ont pas de réponse, le panneau affiche la limite de sunnypilot."
  - title: "Corrections"
    text: "Un téléphone ou un système multimédia à l'heure fausse ne vous bloque plus hors de la bêta. Les alertes GREEN LIGHT et LEAD DEPARTING de sunnypilot affichent toujours leur cercle, et les chiffres des panneaux de limitation de vitesse de CommaView ne se touchent plus presque."
runtime:
  - title: "Chaque trajet compte"
    text: "Votre comma enregistre chaque trajet pendant que vous roulez : un comma qui s'éteint avec la voiture garde donc ses trajets, même ceux qui commencent avant qu'il connaisse l'heure. Cette semaine, dans le classement, se remplit pendant le trajet."
  - title: "StarPilot et l'écran de votre fork"
    text: "Le runtime s'installe sur StarPilot, trouve les trajets enregistrés avec ses réglages High Bitrate Recording ou Konik, et envoie ce que dessine l'écran de votre fork, pour que les écrans du comma four et du comma 3X puissent lui correspondre."
  - title: "Live View récupère sa caméra"
    text: "Votre téléphone ou système multimédia reprend la caméra aussitôt qu'il se reconnecte, et un appareil qui quitte le réseau la libère en une dizaine de secondes."
  - title: "Plus léger pour votre comma"
    text: "Le runtime construit lui-même la télémétrie d'openpilot et l'envoie sous une forme compacte, ne garde les données HUD qu'autour d'un enregistrement, et indique à l'application en quelques secondes si votre comma est là. Enregistrer n'échoue plus sur un comma occupé."
  - title: "Des relectures qui restent disponibles"
    text: "Les trajets terminés ne sont plus marqués endommagés après un redémarrage du comma à l'arrêt, et un long trajet ne peut plus bloquer les relectures des autres."
