title: "Un CommaView repensé, nos propres surimpressions, et le classement"
out:
  - title: "Une application repensée"
    text: "Chaque écran est reconstruit dans un nouveau style : l'accueil, Live View, Enregistrements, Paramètres, l'association et l'installation. Avec une nouvelle icône, un nouvel écran de lancement et un mode plein jour pour les journées lumineuses."
  - title: "Un nouvel Accueil"
    text: "Votre voiture sur sa scène avec Ouvrir Live View, puis Conduite cette semaine, Position du véhicule, vos enregistrements récents et le classement. Organisez-le avec Personnaliser l'accueil. Votre comma apparaît connecté de lui-même, sans Reconnecter à toucher."
  - title: "Pensé pour les tablettes et les systèmes multimédias"
    text: "Sur un écran plus large, l'accueil devient un tableau de bord, Paramètres et Enregistrements s'ouvrent à côté de leurs listes, et l'association s'adapte à tout système multimédia."
  - title: "Les surimpressions de CommaView"
    text: "Notre propre écran de conduite : votre vitesse, MAX et la limitation de vitesse dans un même bloc, des marquages qui montrent la confiance du modèle, une surveillance du conducteur et des alertes qui ne vous gênent pas, et le panneau MAXIMUM du Canada là où il s'applique. Les écrans du comma 3X et du comma four sont là aussi, et vous pouvez changer d'écran directement depuis Live View."
  - title: "Des réglages d'affichage plus simples"
    text: "Une seule section pour les surimpressions, avec un aperçu en direct, et CommaView choisi pour vous."
  - title: "De meilleurs enregistrements"
    text: "Les relectures ressemblent exactement à Live View, se lisent dans l'application, et peuvent être produites voiture en position P. Elles montrent leur progression pendant leur production. Chaque trajet a une miniature, et vous êtes prévenu avant que votre comma en supprime un."
  - title: "Des enregistrements sur tous vos appareils"
    text: "Vos enregistrements vous suivent d'un téléphone ou système multimédia associé à l'autre."
  - title: "Statistiques de conduite et Position du véhicule"
    text: "La distance, le temps de conduite et les trajets de votre semaine, d'après les journaux de votre comma, et où se trouve votre voiture et où vous vous êtes garé, sur une carte sombre. La position reste désactivée tant que vous ne l'activez pas."
  - title: "Une page d'appareil"
    text: "L'état et le runtime de votre comma au même endroit. De là, vous pouvez ouvrir Live View, gérer l'économie d'énergie Wi‑Fi, réparer, et partager les journaux quand vous avez besoin d'aide."
  - title: "Les mises à jour dans l'application"
    text: "Les mises à jour de l'application se téléchargent en arrière-plan, avec un bouton de mise à jour sur chaque écran. Les mises à jour du runtime, les réparations et la désinstallation se passent de SSH. Chaque mise à jour montre ses étapes au fur et à mesure, et l'accueil vous tient au courant. Tout ce qui ne peut pas se faire pendant la conduite attend que la voiture soit en position P."
  - title: "Classement"
    text: "Participez depuis l'accueil avec un nom affiché pour voir le podium de la semaine, les résultats de la semaine dernière et le classement total. Les badges se gagnent avec la distance enregistrée par votre comma lui-même, et un classement total comma.ai montre le total que comma.ai a pour votre comma."
  - title: "Rapports de plantage"
    text: "Ils nous aident à corriger les problèmes plus vite, sans données personnelles. Vous pouvez les désactiver dans Paramètres."
  - title: "Corrections"
    text: "La vitesse MAX du comma four ne clignote plus quand openpilot est engagé. Le comma 3 dit désormais clairement qu'il n'est pas pris en charge ; CommaView fonctionne sur le comma 3X et le comma four."
runtime:
  - title: "Des mises à jour en position P, même à la maison"
    text: "Laissez la voiture allumée en position P avec openpilot désengagé, ou installez le comma sur votre bureau. Un trajet n'est jamais interrompu."
  - title: "Des mises à jour plus sûres"
    text: "Une à la fois, et si quelque chose se passe mal, votre comma revient à la version qu'il avait."
  - title: "Ce qui fait tourner les nouvelles fonctions"
    text: "Statistiques de conduite, Position du véhicule, les enregistrements sur tous vos appareils et la synchronisation du classement viennent tous du nouveau runtime. L'application l'installe pour vous."
