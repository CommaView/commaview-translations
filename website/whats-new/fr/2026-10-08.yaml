title: "Cartes hors ligne et limitations de vitesse, panneaux régionaux, et une file de relectures"
out:
  - title: "Cartes hors ligne et limitations de vitesse"
    text: "Téléchargez un pays ou un État américain dans Paramètres › Cartes hors ligne, et CommaView affiche la limitation de vitesse d'après le GPS en direct de votre comma, une fois sa position activée. Les téléchargements se mettent en pause, reprennent et se mettent à jour, et les limitations sont affichées à titre indicatif seulement."
  - title: "Des panneaux de limitation adaptés à votre région"
    text: "Le panneau de CommaView prend l'un de sept styles selon la position de votre comma : le cercle à bord rouge utilisé dans la plupart des pays, Royaume-Uni et Taïwan compris, ou les panneaux des États-Unis, du Canada, du Japon, de la Suède, de la Finlande et de l'Islande, de l'Irlande et du Brésil, ou de l'Australie."
  - title: "Un croissant de direction"
    text: "Un croissant sous le bloc de vitesse des surimpressions de CommaView montre à quel point openpilot braque, et le bloc retrouve son aspect de verre. MAX et la limitation de vitesse restent en place même quand ils sont inconnus."
  - title: "Remplir l'écran ou Caméra entière"
    text: "En paysage, les surimpressions de CommaView remplissent l'écran en recadrant la caméra, ou montrent toute l'image avec Caméra entière. Les nouveaux enregistrements gardent le cadrage choisi."
  - title: "Une file de relectures"
    text: "Mettez plusieurs trajets en file, et leurs relectures sont produites en arrière-plan, reprenant là où elles s'étaient arrêtées si la connexion tombe. Mettez-les en pause, reprenez-les, réessayez-les ou réordonnez-les depuis la File dans Enregistrements."
  - title: "Enregistrements et cartes pour tous les écrans"
    text: "Enregistrements et la bibliothèque de cartes hors ligne sont repensés pour les téléphones, tablettes et systèmes multimédias, et Position du véhicule tient désormais sur les écrans courts et en grand texte."
  - title: "Des problèmes d'enregistrement plus clairs"
    text: "Quand un trajet ne peut pas devenir une relecture, Enregistrements dit pourquoi, et un rapport envoyé de là contient les détails dont nous avons besoin pour l'examiner."
  - title: "L'Accueil et le classement"
    text: "Conduite cette semaine et Position du véhicule restent sur l'Accueil quand vous êtes hors ligne, et l'Accueil montre le podium de la semaine. Une fois inscrit au classement, vos totaux se synchronisent d'eux-mêmes, même depuis le point d'accès du comma."
  - title: "Des mises à jour du runtime sans mise à jour de l'application"
    text: "Le runtime de votre comma peut être mis à jour dès qu'une version compatible sort, sans attendre une nouvelle application, et sa progression est plus claire."
  - title: "Connexion à la bêta"
    text: "Pendant la bêta, CommaView vous demande de vous connecter avec le compte auquel votre invitation a été envoyée. Vos associations et vos réglages sont conservés, et l'application fonctionne hors ligne tant que votre pass d'accès est valide."
  - title: "Une économie d'énergie Wi‑Fi plus claire"
    text: "L'économie d'énergie Wi‑Fi de votre comma est un simple choix activé ou désactivé, qui montre la valeur par défaut du système et dit quand un changement prend effet."
runtime:
  - title: "Redémarrer depuis l'application"
    text: "Quand une mise à jour demande de redémarrer votre comma, Redémarrer le comma, dans l'application, le fait pour vous. Cela ne fonctionne que voiture éteinte ou garée."
  - title: "Des limitations de vitesse d'après un GPS récent"
    text: "Sous sunnypilot, votre comma envoie sa position GPS la plus récente plutôt qu'une position en cache, pour que les limitations des cartes hors ligne suivent l'endroit où vous êtes."
  - title: "Un état des trajets plus clair"
    text: "Votre comma distingue un trajet encore incomplet d'un trajet disparu, pour qu'Enregistrements puisse expliquer lequel, et garde les trajets terminés en bon état."
