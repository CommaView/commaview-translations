title: "Une clé par téléphone, CommaView dans 11 langues de plus, et Browser View"
out:
  - title: "CommaView dans votre langue"
    text: "Paramètres › Langue : Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文 et 繁體中文 à côté de l'English. Elles sont traduites automatiquement et pas encore relues par des locuteurs natifs : dites-nous ce qui sonne faux. Les écrans de votre comma restent dans sa langue."
  - title: "Browser View"
    text: "Live View dans le navigateur web de votre voiture, Tesla comprise : lancez-le depuis les Détails de Live View et tapez le lien court dans le navigateur de la voiture. L'image va de votre téléphone à la voiture via son point d'accès, jamais par Internet."
  - title: "Garder ce moment"
    text: "Garder, dans Live View, conserve les 3 dernières minutes et la minute suivante d'un trajet en MP4 sur votre téléphone, copié une fois garé."
  - title: "Exporter le trajet complet… et Récupérer les trajets automatiquement"
    text: "Copiez un trajet entier en un seul MP4, ou faites rapatrier les nouveaux trajets environ toutes les demi-heures sur les Wi‑Fi que vous choisissez, dans la limite de la place que vous leur donnez."
  - title: "La boutique de packs de superposition"
    text: "Les packs ajoutent à Live View ce que votre fork dessine sur son propre écran. Les membres parcourent les packs Officiels et de la Communauté, et Pour votre comma ; chacun peut en ajouter un depuis un fichier ou un lien."
  - title: "La navigation avec votre propre clé Stadia Maps"
    text: "Pour les membres : Où allez-vous ?, itinéraires et guidage virage par virage avec votre propre compte Stadia Maps, la clé scellée sur votre téléphone."
  - title: "Ouvrir CommaView tout seul"
    text: "Au démarrage d'un système multimédia, à la connexion Bluetooth, et directement dans Live View quand votre comma se connecte. Chacun est désactivé tant que vous ne l'activez pas dans Paramètres › Affichage."
  - title: "Partager avec le développeur de mon fork…"
    text: "Un extrait, un résumé et le journal de CommaView pour ce passage, partagés par le menu de partage d'Android là où votre fork reçoit les rapports. Rien ne va à CommaView."
  - title: "Live View dit ce qui se passe"
    text: "Il attend un redémarrage dont le comma a besoin, signale quand les données de la voiture s'arrêtent ou que l'image est en différé, dit pourquoi il se reconnecte, et s'affiche sur plus de systèmes multimédias en essayant un autre décodeur vidéo."
  - title: "Mettre à jour CommaView"
    text: "Pour les membres, à partir de la 0.0.166 : la mise à jour affiche sa version, peut être annulée et continue de se télécharger en arrière-plan."
  - title: "Corrections"
    text: "Plus rien n'est coupé en grand texte dans les fenêtres courtes, le direct reste muet quand le Son est désactivé, et la relecture d'un trajet pendant lequel le comma a perdu l'alimentation utilise tout jusqu'à la coupure."
earlyAccessNote: "Le direct vers X, Twitch, Kick et Facebook, Vidéo seule, les réglages du fork, la création de packs de superposition et Surround sont réservés à un groupe restreint de testeurs, derrière des options de fonctionnalité, le temps de recueillir des retours. Pour aider à les tester, contactez-nous sur Discord."
earlyAccess:
  - title: "Le direct vers plus de plateformes"
    text: "X, Twitch, Kick et Facebook, chacune derrière sa propre option jusqu'à ce qu'on y ait diffusé avec un vrai compte."
  - title: "Vidéo seule"
    text: "Pour FrogPilot et KisaPilot, dont l'écran ne peut pas recevoir la vue de CommaView : les caméras et les données de conduite dans la vue propre à CommaView, sans rien changer au fork."
  - title: "Réglages du fork"
    text: "Les réglages propres à votre logiciel de conduite dans les paramètres de l'appareil de votre comma, modifiés à l'arrêt, avec des sauvegardes sur votre téléphone."
runtime:
  - title: "Une clé par téléphone"
    text: "Chaque téléphone reçoit de lui-même sa propre clé pour votre comma, et personne n'a à refaire l'association. Les téléphones sous d'anciennes versions de l'application continuent de fonctionner 90 jours après que le premier téléphone a reçu sa clé ; ensuite, il leur faut la 0.0.166 et une invitation."
  - title: "BluePilot, dragonpilot et OPGM"
    text: "Désormais des forks listés, nommés et dessinés avec le style de leur base."
  - title: "Installations vérifiées, jamais en arrière"
    text: "L'application vérifie la signature de chaque runtime avant de l'installer, et un comma refuse un runtime plus ancien."
  - title: "carrotpilot et StarPilot 7.0"
    text: "Davantage de l'écran de carrotpilot, dans sa propre police pour le coréen, le japonais, le chinois et le thaï, et la branche de développement de StarPilot 7.0, au mieux."
