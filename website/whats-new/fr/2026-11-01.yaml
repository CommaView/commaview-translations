title: "Le direct pour tous, l'envoi de trajets, et plus de forks d'openpilot, au mieux"
out:
  - title: "Le direct, pour tous"
    text: "Diffusez ce que montre Live View sur votre chaîne YouTube ou un autre serveur RTMP, en 720p ou 1080p, avec le son du micro de votre comma ou de votre téléphone si vous en choisissez un. Configurez-le dans Paramètres › Diffusion en direct. Les diffusions commencent en Non répertoriée, et qui regarde voit où vous roulez."
  - title: "Envoyer à CommaView, pour les membres"
    text: "Envoyez-nous un ou plusieurs trajets depuis Enregistrements avec une note sur ce qui s'est passé : la vidéo route et grand angle de chacun et son journal, jamais la caméra conducteur, le son ni le numéro VIN de votre voiture. Une seule fenêtre Envoyer à CommaView porte maintenant tout ce que vous nous envoyez, problèmes comme idées."
  - title: "Plusieurs trajets à la fois"
    text: "Sélectionnez des trajets dans Enregistrements pour les partager, produire leurs relectures, les envoyer ou les supprimer ensemble."
  - title: "Vos demandes"
    text: "Quand vous signalez un problème ou envoyez une idée en étant connecté, nous pouvons répondre : Paramètres › Assistance et diagnostics › Vos demandes montre nos réponses, vous recevez un e-mail, et la conversation continue sur my.commaview.com."
  - title: "Live View tient sur tous les écrans"
    text: "Ses commandes ne défilent plus et ne coupent plus Quitter : ce qui ne tient pas va dans Plus, et un texte plus grand déplace des commandes dans Plus au lieu de rien rétrécir. Live View est plus léger pour le téléphone, et repart de lui-même au lieu de se figer."
  - title: "Des paramètres réorganisés"
    text: "Confidentialité et partage dit ce qui quitte votre téléphone, Assistance et diagnostics est l'endroit où signaler un problème et retrouver vos demandes, et Compte se termine par Supprimer votre compte. Aider à améliorer CommaView demande une fois s'il faut envoyer les rapports de plantage et quel logiciel de conduite tourne sur votre comma."
  - title: "Le classement, pour chaque membre"
    text: "Il ne dépend plus d'une option de fonctionnalité. La carte de l'Accueil se met à jour au plus toutes les 30 minutes, et indique quand elle l'a fait pour la dernière fois."
  - title: "Soutenir CommaView"
    text: "Paramètres › Assistance et diagnostics › Soutenir CommaView ouvre notre page Buy Me a Coffee, pour aider à couvrir l'hébergement, les tests et l'application iOS. Elle ne débloque rien."
  - title: "Corrections"
    text: "Un système multimédia sous Android 16 ne ferme plus CommaView dans Live View quand son décodeur vidéo échoue, l'écran comma 3X de StarPilot dessine sa caméra sur les systèmes multimédias qui l'affichaient en noir, et la connexion à YouTube et le direct fonctionnent à travers un VPN."
earlyAccessNote: "Navigation, Surround, Surround V2 et les Outils expérimentaux sont toujours en début de développement, pour un groupe restreint de testeurs, derrière des options de fonctionnalité, le temps de recueillir des retours. Certains reposent sur des services payants, comme les itinéraires de Navigation : nous gardons donc le groupe restreint. Pour aider à les tester, contactez-nous sur Discord."
earlyAccess:
  - title: "Navigation"
    text: "Une carte dans Live View pendant un trajet, à côté de la vidéo ou dans son coin, et Où allez-vous ? sans trajet. Sur la carte en coin, Terminer et Couper la voix sont toujours là, Terminer peut être annulé pendant 8 secondes, et vous pouvez dire où aller."
  - title: "Thèmes de carte"
    text: "La carte de Navigation a maintenant un thème clair et un thème sombre, qui basculent au lever et au coucher du soleil là où se trouve votre comma, pour rester lisible au soleil. Choisissez Auto, Comme le téléphone, Clair ou Sombre dans Paramètres › Cartes et navigation › Thème de carte."
  - title: "Surround et Surround V2"
    text: "Surround place une voiture garée là où elle se trouve dans les relectures et masque une voiture vue seulement par la caméra qui est en fait celle du radar. Surround V2 est un second moteur de rendu expérimental, dans Paramètres › Outils expérimentaux."
runtime:
  - title: "Téléphones associés seulement"
    text: "Les caméras et données de votre comma ne vont qu'aux téléphones et systèmes multimédias qui lui sont associés. Mettez d'abord à jour CommaView sur chaque téléphone et système multimédia : un appareil resté en 0.0.164 ne reçoit pas de vidéo d'un comma avec ce runtime."
  - title: "Contribuer à la détection des véhicules"
    text: "Pour les membres : donnez des trajets entiers pour entraîner le détecteur de véhicules de Surround, d'un geste ou automatiquement, sur les réseaux que vous choisissez parmi les Wi‑Fi enregistrés de votre comma et les données mobiles de votre téléphone, chacun avec une limite mensuelle si vous le souhaitez. Une contribution est définitive : elle ne peut pas être retirée ensuite. Rien ne vous nomme, ni vous ni votre comma, mais le parcours et la vidéo d'un trajet peuvent montrer où vous roulez."
  - title: "Plus de forks d'openpilot, au mieux"
    text: "CommaView s'installe maintenant sur plus de forks d'openpilot, au mieux : la configuration vérifie un fork que CommaView ne liste pas, sans rien changer, et ajoute la vue de CommaView une fois que vous êtes d'accord. Désinstaller le runtime remet les fichiers du fork en place."
  - title: "Des installations qui se rétablissent"
    text: "Une coupure de courant ou un redémarrage en pleine installation remet la version précédente, un téléchargement bloqué reprend là où il s'était arrêté, et une installation continue quand l'application cesse d'écouter."
  - title: "Le mode expérimental sur les openpilot récents"
    text: "Sur la nightly d'openpilot et sunnypilot dev, Live View affiche le mode expérimental comme le fait openpilot."
