title: "Deux forks de plus, les copies en direct, et un accès anticipé à Navigation et Surround"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView s'installe sur ce fork de sunnypilot pour les Tesla HW1, le nomme, et dessine l'écran de sunnypilot avec tout ce que sunnypilot y ajoute."
  - title: "carrotpilot"
    text: "CommaView s'installe sur ce fork d'openpilot pour les Hyundai, Kia et Genesis et dessine pour lui l'écran d'openpilot. Ce que carrotpilot ajoute à son propre écran, comme sa navigation et ses radars, n'est pas encore dessiné. Après une mise à jour automatique de carrotpilot, l'application demande un redémarrage qui ramène Live View."
  - title: "Copies en direct"
    text: "Paramètres › Enregistrements › Enregistrer dans Live View choisit ce que produit Enregistrer : une relecture après le trajet (la meilleure image, jusqu'à 10 minutes, comme avant), une copie en direct de ce que montre Live View, prête dès que vous vous arrêtez, sans limite de 10 minutes, ou les deux. Une copie en direct est en 720p ou 1080p, continue téléphone verrouillé, s'arrête proprement avant que le stockage soit plein, et reste sur votre téléphone."
  - title: "Des paramètres qui occupent tout l'écran"
    text: "Enregistrements, Affichage et Diffusion en direct occupent tout l'écran, sur deux colonnes quand elles tiennent, la liste des Paramètres dit ce que contient chaque page, et chaque page s'aligne sur les tablettes, les systèmes multimédias et les téléphones tenus à l'horizontale."
  - title: "Actualiser l'accès"
    text: "Paramètres › Compte › Accès et fonctions indique quand votre accès se renouvelle, et Actualiser l'accès applique tout de suite une fonction activée ou désactivée pour vous, là où cela prenait jusqu'à un jour."
  - title: "Pourquoi une installation a échoué"
    text: "Si l'installation, une mise à jour du runtime ou une désinstallation échoue, l'application dit ce qui s'est passé et quoi faire (un fork que CommaView ne prend pas en charge, la voiture en train de rouler, pas d'Internet sur le comma), si votre comma a été remis dans son état d'origine, et Copier les détails copie le rapport dont l'assistance a besoin."
  - title: "Une seule carte pour les mises à jour"
    text: "Une mise à jour du runtime n'apparaît que sur la carte de mise à jour de l'Accueil. Une mise à jour qui a échoué y apparaît avec Réessayer et Ignorer."
  - title: "Des relectures plus rapides"
    text: "Une relecture ne télécharge que la vidéo qu'elle montre, le trajet suivant se télécharge pendant qu'une relecture est produite, et le GPU dessine le HUD sur Android 9 et plus récent. Un enregistrement interrompu par la fermeture de l'application, la limite de 10 minutes ou l'arrêt de la voiture propose maintenant Créer la relecture."
  - title: "La qualité de relecture fonctionne de nouveau"
    text: "Balanced, High et Max produisent de nouveau des relectures différentes ; toutes étaient produites à 40 Mbit/s. High, le réglage par défaut, produit des fichiers environ deux fois plus petits depuis un comma 3X."
  - title: "Le bouton Debug Clip a disparu"
    text: "Share bug report n'envoie plus que des journaux. Les extraits de débogage que vous avez gardés restent dans Enregistrements."
  - title: "Corrections"
    text: "Les Paramètres restent sur leur page quand un système multimédia passe en mode nuit. Les téléphones tenus à l'horizontale sous Android 15 évitent l'encoche de la caméra. Importer votre propre clé SSH ne ferme plus l'application sur un système multimédia sans sélecteur de fichiers."
earlyAccessNote: "Navigation, Surround, le direct et Envoyer à CommaView sont en début de développement. Nous les ouvrons à un groupe restreint de testeurs le temps de recueillir des retours, et certains reposent sur des services payants, comme les itinéraires de Navigation : nous gardons donc le groupe restreint tant que nous ne savons pas ce que coûte un usage normal. Pour aider à les tester, contactez-nous sur Discord : nous demandons aux testeurs de les utiliser sur leurs trajets et de nous dire comment ils se comportent."
earlyAccess:
  - title: "Navigation"
    text: "Le guidage virage par virage, de l'Accueil à Live View : cherchez un lieu, comparez jusqu'à trois itinéraires, puis suivez la carte de virage, les annonces vocales et, sur l'écran de CommaView, des chevrons peints dans votre voie. Après une erreur de direction, un nouvel itinéraire est trouvé en quelques secondes. C'est de l'affichage seulement : rien n'est envoyé à votre comma ni à votre voiture, et vos lieux restent sur votre téléphone."
  - title: "Surround"
    text: "Une vue 3D de la route autour de votre voiture, comme quatrième écran de conduite : la route telle que la caméra la voit, avec ses marquages, ses intersections et ses passages piétons ; des voitures, camions et bus qui glissent et allument leurs feux stop ; et les feux qui vous font face, éclairés de la couleur qu'ils affichent. Il fait tourner son propre détecteur de véhicules sur votre téléphone, environ 13 fois plus vite qu'avant sur le système multimédia d'une voiture."
  - title: "Passer en direct"
    text: "Diffusez ce que montre Live View sur votre chaîne YouTube ou un autre serveur RTMP, en 720p ou 1080p. Connectez-vous une fois à YouTube, et le direct crée, lance et termine la diffusion, avec le son du micro de votre comma ou de votre téléphone si vous en choisissez un."
  - title: "Envoyer à CommaView"
    text: "Envoyez-nous un trajet enregistré avec une note sur ce qui s'est passé, depuis Enregistrements. Il ne comprend jamais la caméra conducteur, le son ni le numéro VIN de votre voiture."
runtime:
  - title: "Deux forks de plus"
    text: "Le runtime reconnaît SunnyPilot-TeslaHW1 et carrotpilot."
  - title: "Une installation qui échoue dit pourquoi"
    text: "L'installateur nomme la cause, comme un fork qu'il ne prend pas en charge, pour que l'application puisse vous le dire."
  - title: "Des téléchargements de relecture plus rapides"
    text: "L'application demande jusqu'à 4 Mio de la vidéo d'un trajet à la fois, là où elle demandait 256 Kio, et un téléphone sur un Wi‑Fi très faible ne retarde plus les autres réponses du comma."
  - title: "Des relectures pour les trajets dont la fin n'a pas été vue"
    text: "Le comma indique quand le trajet d'un enregistrement est terminé, pour que l'application puisse produire sa relecture même quand le téléphone n'en a pas vu la fin."
  - title: "Le micro de votre comma dans une diffusion"
    text: "Pour les comptes avec le direct : le micro du comma ne va à votre téléphone que tant que vous l'avez choisi pour une diffusion. L'enregistrement audio d'openpilot n'est pas activé, et le comma ne stocke jamais le son."
