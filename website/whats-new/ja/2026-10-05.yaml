title: "生まれ変わった CommaView、独自のオーバーレイ、ランキング"
out:
  - title: "デザインを一新したアプリ"
    text: "ホーム、Live View、録画、設定、ペアリング、セットアップと、すべての画面を新しいデザインで作り直しました。新しいアイコンと起動画面、明るい日のための日中モードも加わりました。"
  - title: "新しいホーム"
    text: "ステージに乗ったあなたの車と「Live View を開く」、その下に「今週の運転」、「車両の位置」、最近の録画、ランキング。「ホームをカスタマイズ」で並べ替えられます。comma は自動で接続済みと表示され、「再接続」をタップする必要はありません。"
  - title: "タブレットとカーナビ向け"
    text: "広い画面ではホームがダッシュボードになり、設定と録画は一覧の横に開き、ペアリングはどのカーナビにも収まります。"
  - title: "CommaView のオーバーレイ"
    text: "独自の走行画面です。速度、MAX、制限速度を 1 つのクラスターにまとめ、車線はモデルの確信度に応じて表示し、ドライバーモニタリングとアラートは邪魔にならないように表示し、該当する地域ではカナダの MAXIMUM 標識も表示します。comma 3X と comma four の画面も選べ、Live View から直接画面を切り替えられます。"
  - title: "シンプルになった表示設定"
    text: "ライブプレビュー付きの走行中オーバーレイのセクションが 1 つになり、CommaView があらかじめ選ばれています。"
  - title: "より良い録画"
    text: "リプレイは Live View とまったく同じ見た目になり、アプリ内で再生でき、車が P レンジのときでも作成できます。作成中は進捗が表示されます。各ドライブにサムネイルが付き、comma がドライブを削除する前に警告が出ます。"
  - title: "すべてのデバイスで録画"
    text: "録画は、ペアリングしたスマートフォンやカーナビの間で引き継がれます。"
  - title: "運転の記録と車両の位置"
    text: "comma 自身のログから、その週の走行距離、運転時間、ドライブ数を表示し、車の位置と駐車した場所をダークな地図に表示します。位置情報はオンにするまでオフです。"
  - title: "デバイスのページ"
    text: "comma の状態とランタイムを 1 か所で確認できます。そこから Live View を開いたり、Wi-Fi の省電力を管理したり、修復したり、助けが必要なときにログを共有したりできます。"
  - title: "アプリ内のアップデート"
    text: "アプリのアップデートはバックグラウンドでダウンロードされ、どの画面にもアップデートボタンが表示されます。ランタイムのアップデート、修復、アンインストールに SSH は不要です。各アップデートは進行中の手順を表示し、ホームでも状況を知らせます。運転中にできないことは、車が P レンジになるまで待ちます。"
  - title: "ランキング"
    text: "ホームから表示名を決めて参加すると、今週の表彰台、先週の結果、累計の順位が見られます。バッジは comma 自身が記録した距離で獲得でき、comma.ai の累計ボードには comma.ai があなたの comma について持つ合計が表示されます。"
  - title: "クラッシュレポート"
    text: "個人情報を取り除いたうえで、問題をより早く直すのに役立ちます。設定でオフにできます。"
  - title: "修正"
    text: "comma four の MAX 速度が作動中にちらつかなくなりました。comma 3 では、非対応であることをはっきり表示するようになりました。CommaView は comma 3X と comma four で動きます。"
runtime:
  - title: "P レンジでのアップデート、自宅でも"
    text: "openpilot を解除して車を P レンジでオンのままにするか、机の上で comma をセットアップしてください。走行が中断されることはありません。"
  - title: "より安全なアップデート"
    text: "1 つずつ行い、何か問題があれば comma は元のバージョンに戻ります。"
  - title: "新機能を支えるもの"
    text: "運転の記録、車両の位置、デバイス間の録画、ランキングの同期は、すべて新しいランタイムから来ています。アプリがインストールしてくれます。"
