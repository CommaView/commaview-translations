title: "新しいホーム、あなたの車の画像、そしてアカウントを 1 か所に"
out:
  - title: "my.commaview.com のアカウント"
    text: "メールに届くコードでログインし、アプリをダウンロードし、新機能を確認できます。Beta とアップデートも今後はここから届きます。Firebase App Distribution は終了しました。"
  - title: "アカウントからのアップデート"
    text: "アプリがアカウントで新しいリリースを確認し、アプリ内で案内します。アプリの各リリースには、一緒にテストしたランタイムが付いてきます。"
  - title: "フィードバックと機能リクエストボード"
    text: "アプリの設定から、アイデア、問題、感想を送れます。詳しく見てほしいときはサポートバンドルも添えられます。次に何を作るかは、my.commaview.com の機能リクエストボードで投票できます。"
  - title: "あなたの車の新しい画像"
    text: "対応するすべての車に、同じスタイル、同じ大きさ、同じライティングの新しい画像が付き、どの画面にもすっきり収まります。"
next:
  - title: "新しいデバイスのホーム"
    text: "ステージに乗ったあなたの車と「Live View を開く」を 1 枚のカードにまとめ、その下に「今週の運転」、「車両の位置」、最近の録画を並べます。"
  - title: "タブレットとカーナビ向け"
    text: "広い画面ではホームがダッシュボードになり、設定とデバイス設定は一覧の横に開きます。"
runtime:
  - title: "運転の記録"
    text: "comma 自身のログから、その週の走行距離、運転時間、ドライブ数を表示します。"
  - title: "車両の位置"
    text: "運転中の車の位置と、駐車した場所。オンにするまではオフです。"
