title: "StarPilot、フォークに合わせた画面、新しいランキング"
out:
  - title: "StarPilot"
    text: "CommaView は、StarPilot 自身のインストーラーでインストールした comma 3X と comma four の StarPilot で動くようになりました。Live View は StarPilot の Camera View に従い、ドライバーカメラにも対応し、Disable Logging 設定で映像が止まっているときはそれを伝えます。"
  - title: "フォークに合わせた画面"
    text: "comma four と comma 3X の画面は、フォークが comma に描くものをそのまま描きます。フォント、アラート、カメラ映像の色調整です。StarPilot では、制限速度標識、先行車の情報、ナビのカード、開発者サイドバーなど、StarPilot 独自の HUD、走行経路、ウィジェットも描きます。"
  - title: "表示で画面を選ぶ"
    text: "設定 › 表示 のドロップダウンで走行画面を選べ、プレビューにはあなたの comma のフォークとカメラが表示されます。"
  - title: "Live View ですべてのフレームを"
    text: "Live View は、これまで一部を飛ばしていたところを、comma が送るすべてのフレームを最大 20 フレーム／秒で描くようになりました。comma 3X の画面はスマートフォンの GPU で描かれ（Android 9 以降）、映像に遅れません。"
  - title: "回復する Live View"
    text: "「Reconnecting… Attempt 1」で止まらなくなり、車がオフのときは待機して、車が起動すると自動で映像を開きます。映像の開始時に「openpilot Unavailable」が一瞬表示されるのではなく、1 つの状態パネルがボタン付きで状況を伝えます。"
  - title: "ランタイムのアップデート後の再起動"
    text: "comma のランタイムをインストールまたはアップデートすると、アプリが「再起動」ボタンで comma の再起動を求め、再起動するまで Live View と録画は待機します。comma が勝手に再起動することはありません。ホームのアップデートカードは小さくなり、タップするとすべての手順が見られます。"
  - title: "ホームが追いつく"
    text: "ホームは、引っ張って更新しなくても、各 comma があるかどうかを数秒で表示し、確認している間は「確認中」と表示します。新しいアプリのアップデートは、公開後すぐ、アプリに戻るたびに表示されます。"
  - title: "デザインを一新したランキング"
    text: "今週、先週、累計の「順位」と「実績」。すぐ上の comma との差、次の実績まであとどれだけか、獲得できる全 17 個の実績がわかります。プロフィールには数字と設定がまとまり、タブレットやカーナビではボードの横に「あなた」のパネルが表示されます。"
  - title: "参加する前に表彰台を"
    text: "ホームには今週の表彰台が 3 段のメダル付きで表示され、参加する前にランキングを見ることができます。"
  - title: "落ち着いたリプレイのキュー"
    text: "各ドライブは、進捗、一時停止、再開、再試行と、移動、報告、削除のメニューを持つ 1 行になり、ドラッグで並べ替えられます。進捗が 99% で止まらなくなり、完成したリプレイの保存は独立した手順として表示されます。"
  - title: "Live View と同じリプレイ"
    text: "リプレイは、Live View と同じようにフォークの画面とオフライン地図の制限速度標識を描き、comma が HUD のデータを保存しなかった場面には印を付けます。"
  - title: "より良いオフライン地図"
    text: "「地図を追加」の検索が画面キーボードで使えるようになり、Android 15 でも「ダウンロード」が画面に残り、ダウンロードはバックグラウンドで続きます。地図に答えがない場所では、標識に sunnypilot の制限速度を表示します。"
  - title: "修正"
    text: "時計がずれたスマートフォンやカーナビで Beta から締め出されることがなくなりました。sunnypilot の「青信号」と「先行車発進」のアラートには常に円が表示され、CommaView の制限速度標識の数字がくっつきそうになることもなくなりました。"
runtime:
  - title: "すべてのドライブを記録"
    text: "comma は運転中にドライブを記録していくので、車と一緒に電源が切れても、時刻がわかる前に始まったものも含めてドライブが残ります。ランキングの「今週」は運転中に増えていきます。"
  - title: "StarPilot とフォークの画面"
    text: "ランタイムは StarPilot にインストールでき、High Bitrate Recording や Konik の設定で保存されたドライブを見つけ、フォークの画面が描くものを送るので、comma four と comma 3X の画面がそれに合わせられます。"
  - title: "Live View がカメラを取り戻す"
    text: "スマートフォンやカーナビが再接続するとすぐにカメラを取り戻し、ネットワークから外れたデバイスは約 10 秒でカメラを手放します。"
  - title: "comma への負荷を軽く"
    text: "ランタイムが openpilot のテレメトリーを自分で組み立ててコンパクトな形で送り、HUD のデータは録画の前後だけ保持し、comma があるかどうかを数秒でアプリに伝えます。comma が忙しくても録画が失敗しなくなりました。"
  - title: "使える状態のまま残るリプレイ"
    text: "駐車中に comma が再起動しても、完了したドライブが破損扱いされなくなりました。また、1 つの長いドライブがほかのドライブのリプレイを止めることもなくなりました。"
