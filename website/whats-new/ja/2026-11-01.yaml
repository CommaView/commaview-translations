title: "ライブ配信を全員に、ドライブの送信、より多くの openpilot フォークにベストエフォートで"
out:
  - title: "ライブ配信を全員に"
    text: "Live View が表示しているものを、YouTube チャンネルやほかの RTMP サーバーに 720p または 1080p で配信します。選んだ場合は comma のマイクかスマートフォンのマイクの音声も入ります。設定 › ライブ配信 で設定します。配信は限定公開で始まり、視聴者にはあなたがどこを走っているかがわかります。"
  - title: "CommaView に送信をメンバーに"
    text: "録画から、何が起きたかのメモを付けて、1 つまたは複数のドライブを私たちに送れます。送られるのは各ドライブの道路カメラと広角カメラの映像とログで、ドライバーカメラ、音声、車の VIN は決して含まれません。1 つの「CommaView に送信」シートで、問題もアイデアも、私たちに送るものすべてを扱うようになりました。"
  - title: "複数のドライブをまとめて"
    text: "録画でドライブを選択し、まとめて共有、リプレイの作成、送信、削除ができます。"
  - title: "あなたのリクエスト"
    text: "ログイン中に問題を報告したりアイデアを送ったりすると、私たちから返信できます。設定 › サポートと診断 › あなたのリクエスト に返信が表示され、メールも届き、会話は my.commaview.com で続けられます。"
  - title: "Live View がどの画面にも収まる"
    text: "操作ボタンがスクロールしたり「終了」が切れたりしなくなりました。収まらないものは「その他」に入り、文字を大きくしても何かを縮めるのではなく、操作ボタンが「その他」に移ります。Live View はスマートフォンへの負荷が軽くなり、固まらずに自分で動作を立て直します。"
  - title: "設定の整理"
    text: "「プライバシーと共有」でスマートフォンから何が送られるかがわかり、「サポートと診断」で問題を報告したりリクエストを確認したりでき、アカウントの最後には「アカウントを削除」があります。「CommaView の改善に協力」で、クラッシュレポートと、comma が動かしている運転支援ソフトウェアを送るかどうかを一度だけ確認します。"
  - title: "ランキングをすべてのメンバーに"
    text: "機能フラグに依存しなくなりました。ホームのカードの更新は最大 30 分に 1 回で、最後に更新した時刻を表示します。"
  - title: "CommaView を支援"
    text: "設定 › サポートと診断 › CommaView を支援 で、私たちの Buy Me a Coffee のページが開きます。ホスティング、テスト、iOS アプリの費用の助けになります。支援しても機能が解放されることはありません。"
  - title: "修正"
    text: "Android 16 のカーナビで、映像デコーダーが失敗したときに Live View で CommaView が閉じなくなりました。StarPilot の comma 3X 画面で、カメラが黒く表示されていたカーナビでも映像が描かれ、VPN 経由でも YouTube へのログインとライブ配信が動きます。"
earlyAccessNote: "ナビ、Surround、Surround V2、試験運用ツールはまだ開発の初期段階で、フィードバックを集める間、機能フラグを使って限られたテスターだけに公開しています。ナビのルートなど一部は有料サービスで動いているため、グループを小さくしています。テストに協力したい方は Discord でご連絡ください。"
earlyAccess:
  - title: "ナビ"
    text: "移動中は Live View で地図を映像の横か隅に表示し、移動中でないときは「どこへ行きますか？」を表示します。隅の地図には「終了」と「ミュート」が常にあり、「終了」は 8 秒間取り消せ、行き先を声で伝えることもできます。"
  - title: "地図のテーマ"
    text: "ナビの地図にライトとダークのテーマが加わり、comma のいる場所の日の出と日の入りで切り替わるので、日差しの中でも読めます。設定 › 地図とナビ › 地図のテーマ で、自動、スマートフォンと同じ、ライト、ダークから選べます。"
  - title: "Surround と Surround V2"
    text: "Surround は、リプレイで駐車中の車をその場所に置き、実はレーダーがとらえている車をカメラだけの車として表示しないようにしました。Surround V2 は試験的な 2 つ目のレンダラーで、設定 › 試験運用ツール にあります。"
runtime:
  - title: "ペアリングしたスマートフォンだけに"
    text: "comma のカメラとデータは、ペアリングしたスマートフォンとカーナビにだけ届きます。先にすべてのスマートフォンとカーナビで CommaView をアップデートしてください。0.0.164 のままのものは、このランタイムの comma から映像を受け取れません。"
  - title: "車両検出に協力"
    text: "メンバー向け：Surround が使う車両検出器の学習のために、ドライブ全体を提供できます。タップで、または自動で、comma が保存している Wi-Fi とスマートフォンのモバイルデータから選んだネットワークで行い、必要ならそれぞれに月間上限を設定できます。提供は取り消せず、あとから削除することはできません。あなたや comma の名前は含まれませんが、ドライブのルートと映像から、あなたがどこを走っているかがわかることがあります。"
  - title: "より多くの openpilot フォークに、ベストエフォートで"
    text: "CommaView は、より多くの openpilot フォークにベストエフォートでインストールできるようになりました。セットアップは一覧にないフォークを何も変更せずに確認し、あなたが同意すると CommaView の表示を追加します。「ランタイムをアンインストール」でフォークのファイルは元に戻ります。"
  - title: "回復するインストール"
    text: "インストール中に電源が切れたり再起動したりすると前のリリースに戻り、止まったダウンロードは止まったところから再開し、アプリが応答を待たなくなってもインストールは続きます。"
  - title: "新しい openpilot での実験モード"
    text: "openpilot の nightly と sunnypilot dev で、Live View は openpilot と同じように実験モードを表示します。"
