title: "オフライン地図と制限速度、地域ごとの標識、リプレイのキュー"
out:
  - title: "オフライン地図と制限速度"
    text: "設定 › オフライン地図 で国や米国の州をダウンロードすると、comma の位置情報がオンのとき、CommaView は comma のリアルタイムの GPS から制限速度を表示します。ダウンロードは一時停止、再開、更新ができ、制限速度は表示専用です。"
  - title: "走る場所に合わせた制限速度標識"
    text: "CommaView の標識は、comma の位置に応じて 7 つのスタイルから選ばれます。英国や台湾を含むほとんどの国で使われる赤い円の標識、または米国、カナダ、日本、スウェーデン、フィンランドとアイスランド、アイルランドとブラジル、オーストラリアの標識です。"
  - title: "ステアリングの三日月"
    text: "CommaView のオーバーレイの速度クラスターの下にある三日月が、openpilot がどれだけ強く操舵しているかを示します。クラスターにはガラスのような見た目が戻りました。MAX と制限速度は、不明なときでも同じ位置に表示されます。"
  - title: "全画面またはカメラ全体"
    text: "横向きでは、CommaView のオーバーレイがカメラ映像を切り取って画面いっぱいに表示するか、「カメラ全体」で映像全体を表示します。新しい録画は選んだ切り取り方を保ちます。"
  - title: "リプレイのキュー"
    text: "複数のドライブをキューに入れると、リプレイがバックグラウンドで作成され、接続が切れても続きから再開します。録画の「キュー」から、一時停止、再開、再試行、並べ替えができます。"
  - title: "どの画面にも合う録画と地図"
    text: "録画とオフライン地図ライブラリを、スマートフォン、タブレット、カーナビに合うようにデザインし直しました。車両の位置も、縦の短い画面や大きな文字に収まるようになりました。"
  - title: "わかりやすくなった録画の問題"
    text: "ドライブをリプレイにできないときは、録画がその理由を表示します。そこから送ったレポートには、調査に必要な詳細が含まれます。"
  - title: "ホームとランキング"
    text: "オフラインでも「今週の運転」と「車両の位置」がホームに残り、ホームには今週の表彰台が表示されます。ランキングに参加すると、comma のテザリングからでも合計が自動で同期されます。"
  - title: "アプリのアップデートなしでランタイムをアップデート"
    text: "互換性のあるランタイムが出たら、新しいアプリを待たずに comma のランタイムをアップデートでき、進捗もわかりやすくなりました。"
  - title: "Beta のログイン"
    text: "Beta の間、CommaView は招待が届いたアカウントでのログインを求めます。ペアリングと設定は保持され、アクセスパスが有効な間はオフラインでもアプリが動きます。"
  - title: "わかりやすくなった Wi-Fi の省電力"
    text: "comma の Wi-Fi の省電力は、シンプルなオン／オフの選択になり、システムのデフォルトを表示し、変更がいつ反映されるかを伝えます。"
runtime:
  - title: "アプリから再起動"
    text: "アップデートで comma の再起動が必要なとき、アプリの「今すぐ comma を再起動」で再起動できます。車がオフか駐車中のときだけ使えます。"
  - title: "最新の GPS からの制限速度"
    text: "sunnypilot では、comma がキャッシュした位置ではなく最新の GPS の測位を送るので、オフライン地図の制限速度が現在地に追従します。"
  - title: "わかりやすくなったドライブの状態"
    text: "comma は、まだ不完全なドライブと消えてしまったドライブを区別して伝えるので、録画でどちらかを説明できます。また、完了したドライブを正常な状態に保ちます。"
