title: "スマートフォンごとの鍵、11 の新しい言語の CommaView、Browser View"
out:
  - title: "あなたの言語で CommaView を"
    text: "設定 › 言語：英語に加えて Deutsch、Español、Français、日本語、한국어、Português (Brasil)、ไทย、Türkçe、Українська、简体中文、繁體中文。機械翻訳で、まだネイティブスピーカーのレビューを受けていないので、おかしなところがあれば教えてください。comma 自身の画面は comma の言語のままです。"
  - title: "Browser View"
    text: "Tesla を含め、車の Web ブラウザーで Live View を表示します。Live View の「詳細」から開始し、車のブラウザーに短いリンクを入力します。映像はスマートフォンからテザリング経由で車へ届き、インターネットを通りません。"
  - title: "この場面を保存"
    text: "Live View の「保存」は、ドライブの直前 3 分とその後の 1 分を、駐車後にコピーしてスマートフォンに MP4 として残します。"
  - title: "ドライブ全体を書き出し…とドライブを自動で取得"
    text: "ドライブ全体を 1 つの MP4 としてコピーできます。また、新しいドライブを、選んだ Wi‑Fi で約 30 分ごとに、割り当てた容量まで手元にコピーできます。"
  - title: "オーバーレイパックストア"
    text: "パックは、フォークが自分の画面に描くものを Live View に加えます。メンバーは公式とコミュニティのパック、そして「あなたの comma 向け」を閲覧でき、誰でもファイルやリンクからパックを追加できます。"
  - title: "自分の Stadia Maps キーでナビ"
    text: "メンバー向け：「どこへ行きますか？」、ルート、ターンバイターン案内を、自分の Stadia Maps アカウントで使えます。キーはスマートフォン内に封印されます。"
  - title: "CommaView を自動で開く"
    text: "カーナビの起動時、Bluetooth の接続時に開き、comma が接続したらそのまま Live View に入ります。どれも 設定 › 表示 でオンにするまではオフです。"
  - title: "フォークの開発者と共有…"
    text: "その区間のクリップ、概要、CommaView のログを、Android の共有シートからフォークがレポートを受け付ける場所へ共有します。CommaView には何も送られません。"
  - title: "Live View が状況を伝える"
    text: "comma に必要な再起動を待ち、車のデータが止まったときや映像が遅れているときに知らせ、再接続している理由を伝え、別の映像デコーダーを試すことでより多くのカーナビで再生します。"
  - title: "CommaView のアップデート"
    text: "メンバー向け、0.0.166 以降：アップデートはバージョンを表示し、キャンセルでき、バックグラウンドでダウンロードを続けます。"
  - title: "修正"
    text: "縦の短いウィンドウで大きな文字にしても何も切れなくなりました。サウンドがオフのときライブ配信は無音のままになり、comma の電源が途中で落ちたドライブのリプレイは、電源が切れる直前までのすべてを使います。"
earlyAccessNote: "X、Twitch、Kick、Facebook へのライブ配信、映像のみ、フォーク設定、オーバーレイパックの作成、Surround は、フィードバックを集める間、機能フラグを使って限られたテスターだけに公開しています。テストに協力したい方は Discord でご連絡ください。"
earlyAccess:
  - title: "より多くのプラットフォームへのライブ配信"
    text: "X、Twitch、Kick、Facebook。実際のアカウントで配信を確かめるまで、それぞれ専用のフラグの後ろにあります。"
  - title: "映像のみ"
    text: "CommaView が画面に表示を追加できない FrogPilot と KisaPilot 向けに、カメラと運転データを CommaView 独自の表示で見せます。フォークには何も変更を加えません。"
  - title: "フォーク設定"
    text: "運転支援ソフトウェア自身の設定を comma のデバイス設定で、駐車中に変更でき、バックアップはスマートフォンに残ります。"
runtime:
  - title: "スマートフォンごとの鍵"
    text: "各スマートフォンが comma 用の専用の鍵を自動で受け取り、ペアリングし直す必要はありません。古いアプリのスマートフォンは、最初のスマートフォンが鍵を受け取ってから 90 日間動き続けます。それ以降は 0.0.166 と招待が必要です。"
  - title: "BluePilot、dragonpilot、OPGM"
    text: "一覧のフォークになり、名前を表示し、もとになったフォークの見た目で描きます。"
  - title: "検証済みのインストール、古いものには戻さない"
    text: "アプリはインストールする前に各ランタイムの署名を確認し、comma は古いランタイムを拒否します。"
  - title: "carrotpilot と StarPilot 7.0"
    text: "carrotpilot の画面をより多く、韓国語、日本語、中国語、タイ語では carrotpilot 自身のフォントで描きます。StarPilot 7.0 の開発ブランチにもベストエフォートで対応します。"
