title: "さらに 2 つのフォーク、ライブコピー、ナビと Surround の早期アクセス"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView は、Tesla の HW1 車向けのこの sunnypilot フォークにインストールでき、名前を表示し、sunnypilot が加えた要素をすべて含めて sunnypilot の画面を描きます。"
  - title: "carrotpilot"
    text: "CommaView は、Hyundai、Kia、Genesis の車向けのこの openpilot フォークにインストールでき、openpilot の画面を描きます。carrotpilot が自身の画面に加えるもの（ナビや速度取締りカメラなど）はまだ描きません。carrotpilot が自分でアップデートしたあとは、アプリが再起動を求め、再起動すると Live View が戻ります。"
  - title: "ライブコピー"
    text: "設定 › 録画 › Live View での録画 で、「録画」が何を作るかを選べます。走行後のリプレイ（これまでどおり最高の画質、最大 10 分）、Live View が表示しているもののライブコピー（停車した瞬間に使え、10 分の制限なし）、またはその両方です。ライブコピーは 720p か 1080p で、スマートフォンをロックしても続き、ストレージがなくなる前にきちんと停止し、スマートフォンに残ります。"
  - title: "画面全体を使う設定"
    text: "録画、表示、ライブ配信は、収まる場合は 2 列で画面全体を使います。設定の一覧には各ページの内容が表示され、タブレット、カーナビ、横向きのスマートフォンでもすべてのページが揃って表示されます。"
  - title: "アクセスを再読み込み"
    text: "設定 › アカウント › アクセスと機能 でアクセスがいつ更新されるかがわかり、「アクセスを再読み込み」で、これまで最大 1 日かかっていた機能のオン／オフをすぐに反映できます。"
  - title: "インストールに失敗した理由"
    text: "セットアップ、ランタイムのアップデート、アンインストールが失敗すると、何が起きたか、どうすればよいか（CommaView が対応していないフォーク、車が走行中、comma がインターネットにつながっていない）、comma が元の状態に戻されたかどうかをアプリが伝え、「詳細をコピー」でサポートに必要なレポートをコピーできます。"
  - title: "アップデートのカードを 1 つに"
    text: "ランタイムのアップデートは、ホームのアップデートカードにだけ表示されます。失敗したアップデートは「再試行」と「閉じる」付きでそこに表示されます。"
  - title: "リプレイの高速化"
    text: "リプレイは表示する部分の映像だけをダウンロードし、1 つ作成している間に次のドライブをダウンロードし、Android 9 以降では GPU が HUD を描きます。アプリの終了、10 分の制限、車の電源オフで途中で切れた録画にも「リプレイを作成」が表示されるようになりました。"
  - title: "リプレイの画質設定が再び機能"
    text: "Balanced、High、Max で、再び異なるリプレイが作られます。これまではすべてのリプレイが 40 Mbit/s で作られていました。デフォルトの High では、comma 3X のファイルサイズが約半分になります。"
  - title: "デバッグクリップのボタンを廃止"
    text: "バグレポートの共有はログだけを送ります。保存済みのデバッグクリップは録画に残ります。"
  - title: "修正"
    text: "カーナビが夜間モードに切り替わっても、設定が同じページに留まるようになりました。Android 15 で横向きにしたスマートフォンは、カメラの切り欠きを避けて表示します。ファイル選択画面のないカーナビで、自分の SSH 鍵を読み込んでもアプリが閉じなくなりました。"
earlyAccessNote: "ナビ、Surround、ライブ配信、CommaView に送信は開発の初期段階です。フィードバックを集める間、限られたテスターに公開しています。ナビのルートなど一部は有料サービスで動いているため、通常の使い方でどれだけ費用がかかるかわかるまで、グループを小さくしています。テストに協力したい方は Discord でご連絡ください。テスターには実際のドライブで使い、どう動いたかを教えていただいています。"
earlyAccess:
  - title: "ナビ"
    text: "ホームから Live View までのターンバイターン案内です。場所を検索し、最大 3 つのルートを比べ、曲がり角のカード、音声案内、そして CommaView の画面では車線に描かれる矢印に従います。曲がる場所を間違えても、数秒で新しいルートを見つけます。表示のみの機能で、comma や車には何も送らず、場所はスマートフォンに残ります。"
  - title: "Surround"
    text: "車の周りの道路を 3D で見せる、4 つ目の走行画面です。カメラが見ている道路を車線、交差点、横断歩道ごと描き、なめらかに動きブレーキランプも光る乗用車、トラック、バス、そしてこちらを向いた信号を、その色で点灯させて表示します。スマートフォン上で独自の車両検出器を動かし、車のカーナビでは以前の約 13 倍の速さです。"
  - title: "ライブ配信"
    text: "Live View が表示しているものを、YouTube チャンネルやほかの RTMP サーバーに 720p または 1080p で配信します。一度 YouTube にログインすれば、ライブ配信が配信の作成、開始、終了まで行い、選んだ場合は comma のマイクかスマートフォンのマイクの音声も入ります。"
  - title: "CommaView に送信"
    text: "録画から、何が起きたかのメモを付けて、録画したドライブを私たちに送れます。ドライバーカメラ、音声、車の VIN は決して含まれません。"
runtime:
  - title: "さらに 2 つのフォーク"
    text: "ランタイムが SunnyPilot-TeslaHW1 と carrotpilot を認識します。"
  - title: "インストールの失敗理由を伝える"
    text: "インストーラーが、対応していないフォークなどの原因を特定するので、アプリがそれを伝えられます。"
  - title: "リプレイのダウンロードを高速化"
    text: "アプリはドライブの映像を、これまでの 256 KiB ではなく一度に最大 4 MiB 要求し、Wi-Fi がとても弱いスマートフォンが comma のほかの応答を止めることもなくなりました。"
  - title: "終わりを見届けられなかったドライブのリプレイ"
    text: "comma が録画のドライブの終了を伝えるので、スマートフォンが終わりを見ていなくてもアプリがリプレイを作れます。"
  - title: "配信に comma のマイクを"
    text: "ライブ配信が有効なアカウント向け：comma のマイクの音声は、配信用に選んでいる間だけスマートフォンに送られます。openpilot 自身の音声録音はオンにならず、comma が音声を保存することはありません。"
