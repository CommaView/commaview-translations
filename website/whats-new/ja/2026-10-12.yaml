title: "xnor と AdventurePilot が openpilot、sunnypilot、StarPilot に加わりました"
out:
  - title: "xnor-tech の openpilot"
    text: "CommaView は xnor と rx のビルドにインストールでき、xnor という名前で表示します。xnor は openpilot の画面、rx は sunnypilot の画面を使い、Live View は comma が動かしているほうを描きます。rx を動かしている Rivian では、角度で操舵しているときはハンドルが緑に、トルクで操舵しているときは青になります。"
  - title: "AdventurePilot"
    text: "CommaView は AdventurePilot にインストールでき、sunnypilot の画面に AdventurePilot が加えた要素を描きます。車線センタリングインジケーター、comma 3X の画面の CURVE チップ、ステアリングモードに応じたハンドルの色です。"
  - title: "comma 3X の画面にフォークの名前"
    text: "起動時のアラートは、これまで常に sunnypilot と表示していましたが、comma と同じようにフォークの名前を表示するようになりました。"
runtime:
  - title: "さらに 2 つのフォーク"
    text: "これまでセットアップが「unsupported upstream remote」で止まっていた xnor-tech の openpilot と AdventurePilot を、ランタイムが認識するようになりました。"
  - title: "すべての GPS の測位"
    text: "アプリは、最新の測位を 1 秒に 1 回受け取るのではなく、openpilot が出すたびに各測位を最大 10 回／秒、どれだけ古いかと一緒に受け取ります。"
