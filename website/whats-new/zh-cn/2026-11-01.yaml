title: "直播向所有人开放、发送行程，以及以尽力支持方式支持更多 openpilot 分支版本"
out:
  - title: "直播向所有人开放"
    text: "以 720p 或 1080p 把 Live View 显示的内容推流到您的 YouTube 频道或其他 RTMP 服务器；如果您选择了麦克风，还会带上 comma 或手机麦克风的声音。在 设置 › 直播 中设置。直播初始为 **不公开列出**，观看的人都能看到您开车经过的地方。"
  - title: "发送给 CommaView，面向会员"
    text: "从“录像”中把一段或多段行程连同一段说明发送给我们，讲讲发生了什么：每段行程的道路和广角视频及其日志，绝不包含车内摄像头画面、声音或您车辆的 VIN。现在，一个 **发送给 CommaView** 面板承载您发给我们的所有内容，问题和想法都一样。"
  - title: "一次处理多段行程"
    text: "在“录像”中选中多段行程，可以一起分享、制作回放、发送或删除。"
  - title: "您的请求"
    text: "当您在登录状态下反馈问题或提出想法时，我们可以回复您：设置 › 支持与诊断 › **您的请求** 会显示我们的回复，您会收到一封邮件，对话可以在 my.commaview.com 上继续。"
  - title: "Live View 适配所有屏幕"
    text: "它的控件不再需要滚动，也不会把 **退出** 挤出屏幕：放不下的会进入 **更多**；文字较大时，控件会移入 **更多**，而不是缩小任何内容。Live View 对手机的负担更轻，卡住时会自行恢复，而不是一直冻结。"
  - title: "设置重新整理"
    text: "**隐私与分享** 会说明哪些内容会离开您的手机；**支持与诊断** 用于反馈问题和查看您的请求；**账号** 的最后是 **删除您的账号**。**帮助改进 CommaView** 会询问一次，是否发送崩溃报告以及您的 comma 运行的是哪种驾驶软件。"
  - title: "排行榜向所有会员开放"
    text: "它不再依赖功能开关。首页卡片最多每 30 分钟刷新一次，并显示上次刷新的时间。"
  - title: "支持 CommaView"
    text: "设置 › 支持与诊断 › **支持 CommaView** 会打开我们的 Buy Me a Coffee 页面，用于帮助支付托管、测试和 iOS 应用的费用。它不会解锁任何功能。"
  - title: "修复"
    text: "Android 16 车机在视频解码器出错时，不会再在 Live View 中关闭 CommaView；在之前显示黑屏的车机上，StarPilot 的 comma 3X 画面现在能正确显示摄像头画面；通过 VPN 时，YouTube 登录和直播也能正常使用。"
earlyAccessNote: "导航、Surround、Surround V2 和实验性工具仍处于早期开发阶段，在收集反馈期间通过功能开关向一小部分测试者开放。其中一些依赖付费服务，例如导航的路线规划，所以我们会保持小范围测试。如果想帮忙测试，请在 Discord 上联系我们。"
earlyAccess:
  - title: "导航"
    text: "行程中在 Live View 里显示地图，放在视频旁边或角落里；没有行程时显示 **要去哪里？**。在角落的地图上，“结束”和“静音”始终可用，“结束”可在 8 秒内撤销，您还可以用语音说出目的地。"
  - title: "地图主题"
    text: "导航的地图现在有浅色和深色主题，会根据您 comma 所在地的日出和日落自动切换，在阳光下也看得清。在 设置 › 地图与导航 › **地图主题** 中选择 **自动**、**与手机相同**、**浅色** 或 **深色**。"
  - title: "Surround 和 Surround V2"
    text: "Surround 会在回放中把停着的车放在它实际所在的位置，并隐藏那些实际上是雷达目标的纯摄像头识别车辆。Surround V2 是实验性的第二渲染器，位于 设置 › 实验性工具 中。"
runtime:
  - title: "仅限已配对的手机"
    text: "您 comma 的摄像头和数据只会发送到与它配对的手机和车机。请先更新每部手机和每台车机上的 CommaView：仍停留在 0.0.164 的设备，将无法从使用此运行环境的 comma 获取视频。"
  - title: "贡献给车辆检测"
    text: "面向会员：把完整的行程贡献出来，用于训练 Surround 所用的车辆检测器，可以点按一下，也可以自动进行，在您从 comma 已保存的 Wi‑Fi 和手机移动数据中选择的网络上上传，如有需要，每个网络都可设置每月上限。贡献是永久的：之后无法删除。其中没有任何内容标明您或您的 comma，但行程的路线和视频可能会显示您在哪里开车。"
  - title: "更多 openpilot 分支版本，尽力支持"
    text: "CommaView 现在能以尽力支持的方式安装在更多 openpilot 分支版本上：设置会检查 CommaView 未列出的分支版本，不做任何更改，并在您同意后加入 CommaView 的视图。**卸载运行环境** 会把分支版本的文件恢复原样。"
  - title: "能自行恢复的安装"
    text: "安装中途断电或重启，会恢复之前的版本；下载卡住时会从中断的地方继续；应用不再监听时，安装会继续进行。"
  - title: "较新 openpilot 上的实验模式"
    text: "在 openpilot 的 nightly 版本和 sunnypilot dev 上，Live View 会像 openpilot 一样显示实验模式。"
