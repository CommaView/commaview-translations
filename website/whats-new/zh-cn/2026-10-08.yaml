title: "离线地图和限速、各地区的标志，以及回放队列"
out:
  - title: "离线地图和限速"
    text: "在 设置 › 离线地图 中下载一个国家或美国的一个州，开启 comma 的位置后，CommaView 会根据 comma 的实时 GPS 显示限速。下载可以暂停、继续和更新，限速仅供显示。"
  - title: "与您行驶地区相符的限速标志"
    text: "CommaView 的标志会根据 comma 的位置，采用七种样式之一：大多数国家（包括英国和台湾）使用的红圈圆形标志，或美国、加拿大、日本、瑞典、芬兰和冰岛、爱尔兰和巴西，或澳大利亚的标志。"
  - title: "转向弧线"
    text: "CommaView 叠加图层的车速仪表区下方有一道弧线，显示 openpilot 转向的力度，仪表区也恢复了玻璃质感。即使 MAX 和限速未知，它们也会留在原位。"
  - title: "填满屏幕或完整画面"
    text: "横屏时，CommaView 叠加图层会裁切摄像头画面以 **填满屏幕**，或用 **完整画面** 显示整个画面。新录像会保留您选择的裁切方式。"
  - title: "回放队列"
    text: "把多段行程加入队列，它们的回放会在后台制作，连接中断后会从中断的地方继续。在“录像”的 **队列** 中暂停、继续、重试或调整顺序。"
  - title: "适配各种屏幕的录像和地图"
    text: "录像和离线地图库经过重新设计，适配手机、平板和车机，“车辆位置”现在也适配矮屏幕和大字号。"
  - title: "更清楚的录像问题说明"
    text: "当某段行程无法制作成回放时，“录像”会说明原因，从那里发送的报告也会包含我们排查所需的详细信息。"
  - title: "首页和排行榜"
    text: "离线时，“本周驾驶”和“车辆位置”仍会留在首页，首页还会显示本周领奖台。加入排行榜后，您的累计数据会自动同步，即使通过 comma 的热点也可以。"
  - title: "无需更新应用即可更新运行环境"
    text: "有兼容的新运行环境时，就可以更新 comma 的运行环境，不必等待新版应用，进度显示也更清楚了。"
  - title: "Beta 登录"
    text: "Beta 期间，CommaView 会请您用收到邀请的账号登录。您的配对和设置都会保留，在访问通行证有效期间，应用也可以离线使用。"
  - title: "更清楚的 Wi‑Fi 省电设置"
    text: "comma 的 Wi‑Fi 省电现在是简单的开/关选项，会显示系统默认值，并说明更改何时生效。"
runtime:
  - title: "从应用重启"
    text: "当更新需要 comma 重启时，应用中的 **立即重启 comma** 会为您重启。只在车辆熄火或停放时可用。"
  - title: "根据最新 GPS 获取限速"
    text: "在 sunnypilot 上，comma 会发送最新的 GPS 定位，而不是缓存的位置，因此离线地图的限速会跟随您所在的位置。"
  - title: "更清楚的行程状态"
    text: "comma 能区分尚未完成的行程和已经不存在的行程，让“录像”可以说明是哪种情况，并保持已完成行程的完好。"
