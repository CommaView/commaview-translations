title: "全新设计的 CommaView、我们自己的叠加图层，以及排行榜"
out:
  - title: "全新设计的应用"
    text: "每个界面都以新设计重新打造：首页、Live View、录像、设置、配对和设置流程。同时带来新的图标和启动画面，以及适合晴天使用的日光模式。"
  - title: "全新的首页"
    text: "您的车辆在卡片中亮相，带有 **打开 Live View**，下面依次是 **本周驾驶**、**车辆位置**、最近的录像和排行榜。用 **自定义首页** 进行排列。您的 comma 会自动显示为已连接，不需要再点按 **重新连接**。"
  - title: "为平板和车机设计"
    text: "在较宽的屏幕上，首页会变成仪表盘，“设置”和“录像”会在列表旁边打开，配对流程也适配所有车机。"
  - title: "CommaView 叠加图层"
    text: "我们自己的行车画面：车速、MAX 和限速集中在一个仪表区；车道线会显示模型的把握程度；驾驶员监控和警告不会挡住视线；在适用的地区显示加拿大的 MAXIMUM 标志。comma 3X 和 comma four 的画面也都在，您可以直接在 Live View 中切换画面。"
  - title: "更简单的显示设置"
    text: "一个带实时预览的行车画面叠加图层设置区，并为您默认选好 CommaView。"
  - title: "更好的录像"
    text: "回放与 Live View 看起来完全一样，可以在应用中播放，车辆挂入 P 挡时也能制作。制作过程中会显示进度。每段行程都有缩略图，comma 删除行程之前会提醒您。"
  - title: "所有设备上的录像"
    text: "您的录像会在已配对的手机和车机之间同步。"
  - title: "驾驶统计和车辆位置"
    text: "根据 comma 自己的日志统计您一周的行驶距离、驾驶时长和行程数，并在深色地图上显示车辆的位置和停车位置。在您开启之前，位置功能保持关闭。"
  - title: "设备页面"
    text: "在一个地方查看 comma 的状态和运行环境。在这里可以打开 Live View、管理 Wi‑Fi 省电、修复，并在需要帮助时分享日志。"
  - title: "应用内更新"
    text: "应用更新在后台下载，每个界面都有更新按钮。运行环境更新、修复和卸载都不需要 SSH。每次更新都会显示进行到哪一步，首页也会随时告诉您进展。行驶中无法进行的操作，会等到车辆挂入 P 挡再进行。"
  - title: "排行榜"
    text: "在首页用显示名称加入，即可查看本周领奖台、上周结果和累计排名。徽章根据 comma 自己记录的里程获得，comma.ai 累计榜则显示 comma.ai 为您的 comma 记录的总数。"
  - title: "崩溃报告"
    text: "它们帮助我们更快地修复问题，个人信息会被去除。您可以在“设置”中关闭。"
  - title: "修复"
    text: "comma four 的 MAX 速度在启用时不再闪烁。comma 3 现在会明确说明不受支持；CommaView 支持 comma 3X 和 comma four。"
runtime:
  - title: "在 P 挡时更新，在家也可以"
    text: "让车辆保持通电、挂入 P 挡且 openpilot 未启用，或者把 comma 放在桌上进行设置。绝不会打断行驶。"
  - title: "更安全的更新"
    text: "一次只进行一项，如果出了问题，comma 会恢复到原来的版本。"
  - title: "新功能的幕后支持"
    text: "驾驶统计、车辆位置、跨设备录像和排行榜同步都来自新的运行环境。应用会为您安装它。"
