title: "全新的首页、您车辆的图片，以及集中管理账号的地方"
out:
  - title: "您在 my.commaview.com 上的账号"
    text: "用发送到邮箱的验证码登录、下载应用、查看新功能。现在 Beta 版和更新也从这里获取；Firebase App Distribution 已停用。"
  - title: "从账号获取更新"
    text: "应用会在您的账号中检查新版本，并在应用内提供。每个应用版本都附带经过测试的配套运行环境。"
  - title: "反馈和功能看板"
    text: "在应用的“设置”中发送建议、问题或表扬，如果希望我们仔细查看，还可以附上支持数据包；并在 my.commaview.com 的功能看板上为我们接下来要做的功能投票。"
  - title: "您车辆的新图片"
    text: "每款支持的车型都有一张风格统一的新图片，尺寸和光线一致，在任何屏幕上都显示得干净利落。"
next:
  - title: "全新的设备首页"
    text: "您的车辆在一张卡片中亮相，带有 **打开 Live View**，下面依次是 **本周驾驶**、**车辆位置** 和您最近的录像。"
  - title: "为平板和车机设计"
    text: "在较宽的屏幕上，首页会变成仪表盘，“设置”和“设备设置”会在列表旁边打开。"
runtime:
  - title: "驾驶统计"
    text: "根据 comma 自己的日志，统计您一周的行驶距离、驾驶时长和行程数。"
  - title: "车辆位置"
    text: "您开车时车辆在哪里，以及您把车停在了哪里。在您开启之前保持关闭。"
