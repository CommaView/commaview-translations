title: "又多了两个分支版本、实时副本，以及导航和 Surround 抢先体验"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView 可以安装在这个面向 Tesla HW1 车型的 sunnypilot 分支版本上，显示它的名称，并绘制 sunnypilot 的画面以及 sunnypilot 新增的全部内容。"
  - title: "carrotpilot"
    text: "CommaView 可以安装在这个面向现代、起亚和捷尼赛思车型的 openpilot 分支版本上，并为它绘制 openpilot 的画面。carrotpilot 在自己画面上新增的内容，例如导航和测速摄像头，目前还不会绘制。carrotpilot 自行更新后，应用会请求重启，重启后 Live View 就会恢复。"
  - title: "实时副本"
    text: "设置 › 录像 › **在 Live View 中录制** 用于选择 **录制** 生成什么：行程结束后的回放（画质最好，最长 10 分钟，与以前一样）、Live View 所显示画面的实时副本（停车那一刻就能看，没有 10 分钟限制），或者两者都要。实时副本为 720p 或 1080p，锁屏时会继续录制，存储空间用完之前会妥善停止，并保存在您的手机上。"
  - title: "设置页面用满整个屏幕"
    text: "“录像”“显示”和“直播”在空间足够时以两栏占满整个屏幕，“设置”列表会说明每个页面包含什么，每个页面在平板、车机和横握的手机上都排列整齐。"
  - title: "刷新访问权限"
    text: "设置 › 账号 › **访问权限与功能** 会显示您的访问权限何时续期，**刷新访问权限** 会立即生效为您开启或关闭的功能，以前最多需要一天。"
  - title: "安装失败的原因"
    text: "如果设置、运行环境更新或卸载失败，应用会说明出了什么问题以及该怎么做（CommaView 不支持的分支版本、车辆正在行驶、comma 没有网络），告诉您 comma 是否已恢复原状，**复制详细信息** 会复制支持人员需要的报告。"
  - title: "集中显示更新的卡片"
    text: "运行环境更新只显示在首页的更新卡片上。失败的更新也显示在那里，附带 **重试** 和 **关闭**。"
  - title: "回放更快"
    text: "回放只下载它要显示的视频，制作一段回放时会同时下载下一段行程，在 Android 9 及更高版本上由 GPU 绘制 HUD。因应用关闭、10 分钟限制或车辆熄火而中断的录像，现在也会显示 **制作回放**。"
  - title: "回放画质设置恢复正常"
    text: "Balanced、High 和 Max 又会生成不同的回放了；此前所有回放都以 40 Mbit/s 生成。默认的 High 在 comma 3X 上生成的文件大小约为原来的一半。"
  - title: "调试短片按钮已移除"
    text: "分享错误报告只会发送日志。您保留的调试短片仍在“录像”中。"
  - title: "修复"
    text: "车机切换到夜间模式时，“设置”会停留在当前页面。在 Android 15 上横握的手机会避开摄像头开孔。在没有文件选择器的车机上导入您自己的 SSH 密钥时，应用不会再关闭。"
earlyAccessNote: "导航、Surround、直播和发送给 CommaView 还处于早期开发阶段。我们在收集反馈期间向一小部分测试者开放，其中一些依赖付费服务，例如导航的路线规划，所以在弄清正常使用的成本之前，我们会保持小范围测试。如果想帮忙测试，请在 Discord 上联系我们：我们希望测试者在自己的行程中使用它们，并告诉我们效果如何。"
earlyAccess:
  - title: "导航"
    text: "从首页到 Live View 的逐向引导：搜索地点、比较最多三条路线，然后跟随转向卡片、语音提示，以及在 CommaView 画面上绘制在您车道里的箭头。走错路口后，几秒内就会找到新路线。它只用于显示：不会向您的 comma 或车辆发送任何内容，您的地点也会留在手机上。"
  - title: "Surround"
    text: "作为第四种行车画面，以 3D 视图显示车辆周围的道路：摄像头看到的道路及其车道线、路口和人行横道；平滑移动并显示刹车灯的汽车、卡车和公交车；以及面向您的红绿灯，按它们显示的颜色点亮。它在您的手机上运行自己的车辆检测器，在车机上的速度约为以前的 13 倍。"
  - title: "直播"
    text: "以 720p 或 1080p 把 Live View 显示的内容推流到您的 YouTube 频道或其他 RTMP 服务器。登录 YouTube 一次后，直播会为您创建、开始和结束每场直播；如果您选择了麦克风，还会带上 comma 或手机麦克风的声音。"
  - title: "发送给 CommaView"
    text: "从“录像”中把一段录下的行程连同一段说明发送给我们，讲讲发生了什么。其中绝不包含车内摄像头画面、声音或您车辆的 VIN。"
runtime:
  - title: "又多了两个分支版本"
    text: "运行环境能识别 SunnyPilot-TeslaHW1 和 carrotpilot。"
  - title: "安装失败时说明原因"
    text: "安装程序会指出原因，例如不支持的分支版本，以便应用告诉您。"
  - title: "回放下载更快"
    text: "应用每次请求最多 4 MiB 的行程视频，以前是 256 KiB；Wi‑Fi 信号很弱的手机也不会再拖慢 comma 对其他请求的响应。"
  - title: "没看到结束的行程也能制作回放"
    text: "comma 会告知录像的行程何时结束，因此即使手机没有看到行程结束，应用也能制作回放。"
  - title: "直播中使用 comma 的麦克风"
    text: "适用于开通了直播的账号：只有当您为直播选择了 comma 的麦克风时，它的声音才会发送到您的手机。openpilot 自己的录音不会开启，comma 也绝不会保存声音。"
