title: "StarPilot、与您的分支版本一致的画面，以及全新的排行榜"
out:
  - title: "StarPilot"
    text: "CommaView 现在支持 comma 3X 和 comma four 上的 StarPilot，通过 StarPilot 自己的安装程序安装。Live View 会跟随它的 Camera View 设置（包括车内摄像头），并在它的 Disable Logging 设置停止了视频时告诉您。"
  - title: "与您的分支版本一致的画面"
    text: "comma four 和 comma 3X 的画面会绘制您的分支版本在 comma 上绘制的内容：它的字体、警告和摄像头画面的调色。在 StarPilot 上，它们会带来 StarPilot 自己的 HUD、路径和小组件，例如限速标志、前车信息、导航卡片和开发者侧边栏。"
  - title: "在“显示”中选择画面"
    text: "设置 › 显示 可以从下拉菜单中选择行车画面，预览会显示您自己 comma 的分支版本和摄像头。"
  - title: "Live View 中的每一帧"
    text: "Live View 现在会绘制 comma 发送的每一帧，最高每秒 20 帧，而以前会跳过一些。comma 3X 画面由手机的 GPU 绘制（Android 9 及更高版本），因此能跟上视频。"
  - title: "能自行恢复的 Live View"
    text: "它不会再卡在“正在重新连接… 第 1 次尝试”；车辆熄火时，它会等待，并在车辆启动时自动打开视频。一个状态面板会说明正在发生什么，并附带相应按钮，而不是在视频开始时闪过“openpilot Unavailable”。"
  - title: "运行环境更新后重启"
    text: "comma 的运行环境安装或更新后，应用会用一个 **重启** 按钮请您重启，Live View 和 **录制** 会等到您重启之后；comma 绝不会自行重启。首页的更新卡片更小了：点按它可以查看每一步。"
  - title: "首页及时更新"
    text: "首页会在几秒内显示每台 comma 是否在线，无需下拉刷新，查找时会显示“正在检查”。新的应用更新发布后不久，每次您回到应用时都会显示。"
  - title: "全新设计的排行榜"
    text: "**排名** 和 **成就**，可选 **本周**、**上周** 或 **累计**：您与上一名 comma 差多远、下一个成就还差多少，以及全部 17 个可获得的成就。您的个人资料汇集了您的数据和设置，平板和车机会在榜单旁保留一个“您”面板。"
  - title: "加入前就能看领奖台"
    text: "首页会以三级阶梯显示本周领奖台及奖牌，您可以在加入之前先看看排行榜。"
  - title: "更从容的回放队列"
    text: "每段行程占一行，显示进度、**暂停**、**继续** 或 **重试**，以及一个用于移动、反馈或移除的菜单，您还可以拖动行程调整顺序。进度不会再停在 99%：保存完成的回放会作为单独的一步显示。"
  - title: "与 Live View 一致的回放"
    text: "回放会像 Live View 一样绘制您的分支版本的画面和离线地图的限速标志，并标出 comma 没有保存 HUD 数据的时段。"
  - title: "更好的离线地图"
    text: "**添加地图** 中的搜索可以配合屏幕键盘使用，在 Android 15 上 **下载** 会留在屏幕上，下载也会在后台继续。在您的地图中查不到限速的地方，标志会显示 sunnypilot 的限速。"
  - title: "修复"
    text: "手机或车机的时钟不对时，不会再把您挡在 Beta 之外。sunnypilot 上的 GREEN LIGHT 和 LEAD DEPARTING 警告总会显示圆圈，CommaView 限速标志上的数字也不会再几乎挤在一起。"
runtime:
  - title: "每段行程都算数"
    text: "comma 会在您行驶时记录每段行程，所以随车辆一起断电的 comma 也能保留行程，即使是在它知道时间之前开始的行程。排行榜的“本周”会在行驶过程中更新。"
  - title: "StarPilot 和您的分支版本的画面"
    text: "运行环境可以安装在 StarPilot 上，能找到用 High Bitrate Recording 或 Konik 设置保存的行程，并发送您的分支版本画面所绘制的内容，让 comma four 和 comma 3X 的画面与之一致。"
  - title: "Live View 收回摄像头"
    text: "您的手机或车机重新连接时会立即收回摄像头，掉线的设备会在大约十秒内释放摄像头。"
  - title: "减轻 comma 的负担"
    text: "运行环境会自己生成 openpilot 的遥测数据并以紧凑的形式发送，只在录制前后保留 HUD 数据，并在几秒内告诉应用您的 comma 是否在线。在繁忙的 comma 上，**录制** 不会再失败。"
  - title: "始终可用的回放"
    text: "comma 在停车时重启后，已完成的行程不会再被标记为损坏，一段很长的行程也不会再阻止其他行程的回放。"
