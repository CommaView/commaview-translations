title: "每部手机一把密钥、CommaView 新增 11 种语言，以及 Browser View"
out:
  - title: "用您的语言使用 CommaView"
    text: "设置 › **语言**：除英语外，还有 Deutsch、Español、Français、日本語、한국어、Português (Brasil)、ไทย、Türkçe、Українська、简体中文 和 繁體中文。它们是机器翻译的，还没有经过母语者审阅，所以哪里读起来不对，请告诉我们。comma 自己的画面会保持它的语言。"
  - title: "Browser View"
    text: "在车辆的网页浏览器中显示 Live View，Tesla 也可以：在 Live View 的 **详细信息** 中启动，然后在车辆的浏览器中输入短链接。画面通过手机的热点从手机传到车上，绝不经过互联网。"
  - title: "保存此片段"
    text: "Live View 的 **保存** 会把行程中此前的 3 分钟和接下来的 1 分钟保存为手机上的一个 MP4，停车后复制过来。"
  - title: "导出完整行程… 和自动拉取行程"
    text: "把整段行程复制为一个 MP4，或者在您选择的 Wi‑Fi 上大约每半小时把新行程复制回家，最多占用您给它的空间。"
  - title: "叠加包商店"
    text: "叠加包会把分支版本在自己屏幕上绘制的内容加到 Live View 中。会员可以浏览 **官方** 和 **社区** 叠加包，以及 **适用您的 comma** 的叠加包；任何人都可以从文件或链接添加叠加包。"
  - title: "使用您自己的 Stadia Maps 密钥进行导航"
    text: "面向会员：用您自己的 Stadia Maps 账号使用 **要去哪里？**、路线和逐向引导，密钥加密保存在您的手机上。"
  - title: "自动打开 CommaView"
    text: "在车机启动时、蓝牙连接时自动打开，并在 comma 连接时直接进入 Live View。每一项在您于 设置 › 显示 中开启之前都保持关闭。"
  - title: "分享给我的分支版本开发者…"
    text: "那一段的短片、摘要和 CommaView 日志，通过 Android 的分享面板发送到您的分支版本接收报告的地方。不会发送任何内容给 CommaView。"
  - title: "Live View 会说明发生了什么"
    text: "它会等待 comma 需要的重启，在车辆数据中断或画面延迟时告诉您，说明重新连接的原因，并通过尝试另一个视频解码器在更多车机上播放。"
  - title: "更新 CommaView"
    text: "面向会员，从 0.0.166 起：更新会显示版本号，可以取消，并会在后台继续下载。"
  - title: "修复"
    text: "在矮窗口中使用大字号时不再有内容被截断；**声音** 关闭时直播会保持静音；comma 在行程中断电时，该行程的回放会用上断电前的全部内容。"
earlyAccessNote: "直播到 X、Twitch、Kick 和 Facebook、“仅视频”、分支版本设置、制作叠加包以及 Surround，在收集反馈期间通过功能开关向一小部分测试者开放。如果想帮忙测试，请在 Discord 上联系我们。"
earlyAccess:
  - title: "直播到更多平台"
    text: "X、Twitch、Kick 和 Facebook，每个平台都有自己的功能开关，直到用真实账号推流测试过为止。"
  - title: "仅视频"
    text: "适用于 FrogPilot 和 KisaPilot，CommaView 无法在它们的画面中加入自己的视图：在 CommaView 自己的视图中显示摄像头画面和驾驶数据，不更改分支版本中的任何内容。"
  - title: "分支版本设置"
    text: "在 comma 的设备设置中调整驾驶软件自己的设置，在停车时更改，并在手机上保留备份。"
runtime:
  - title: "每部手机一把密钥"
    text: "每部手机都会自动获得一把自己的密钥来连接您的 comma，谁都不需要重新配对。在第一部手机获得密钥后的 90 天内，旧版应用的手机仍可继续使用；之后它们需要 0.0.166 和一个邀请码。"
  - title: "BluePilot、dragonpilot 和 OPGM"
    text: "现在是列出的分支版本，会显示名称，并以其基础版本的样式绘制。"
  - title: "经过验证的安装，绝不降级"
    text: "应用会在安装前检查每个运行环境的签名，comma 也会拒绝较旧的运行环境。"
  - title: "carrotpilot 和 StarPilot 7.0"
    text: "绘制更多 carrotpilot 的画面，并在韩语、日语、中文和泰语中使用它自己的字体；以尽力支持的方式支持 StarPilot 7.0 的开发分支。"
