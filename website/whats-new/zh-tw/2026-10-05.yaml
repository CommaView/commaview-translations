title: "全新設計的 CommaView、我們自己的疊加圖層，以及排行榜"
out:
  - title: "全新設計的 App"
    text: "每個畫面都以新設計重新打造：首頁、Live View、錄影、設定、配對和設定流程。同時帶來新的圖示和啟動畫面，以及適合晴天使用的日光模式。"
  - title: "全新的首頁"
    text: "您的車子在卡片中登場，附有 **開啟 Live View**，下面依序是 **本週駕駛**、**車輛位置**、最近的錄影和排行榜。用 **自訂首頁** 來排列。您的 comma 會自動顯示為已連線，不必再輕觸 **重新連線**。"
  - title: "為平板和車機設計"
    text: "在較寬的螢幕上，首頁會變成儀表板，「設定」和「錄影」會在清單旁邊開啟，配對流程也適合每一種車機。"
  - title: "CommaView 疊加圖層"
    text: "我們自己的行車畫面：車速、MAX 和速限集中在一個儀表區；車道線會顯示模型有多確定；駕駛監控和警示不會擋住視線；在適用的地區顯示加拿大的 MAXIMUM 標誌。comma 3X 和 comma four 的畫面也都在，您可以直接在 Live View 中切換畫面。"
  - title: "更簡單的顯示設定"
    text: "一個附即時預覽的行車畫面疊加圖層設定區，並為您預設選好 CommaView。"
  - title: "更好的錄影"
    text: "回放看起來和 Live View 完全一樣，可以在 App 中播放，車子打入 P 檔時也能製作。製作時會顯示進度。每段行程都有縮圖，comma 刪除行程之前會提醒您。"
  - title: "所有裝置上的錄影"
    text: "您的錄影會在已配對的手機和車機之間同步。"
  - title: "駕駛統計和車輛位置"
    text: "根據 comma 自己的記錄統計您一週的行駛距離、駕駛時間和行程數，並在深色地圖上顯示車子的位置和停車位置。在您開啟之前，位置功能保持關閉。"
  - title: "裝置頁面"
    text: "在一個地方查看 comma 的狀態和執行環境。在這裡可以開啟 Live View、管理 Wi‑Fi 省電、修復，並在需要協助時分享記錄。"
  - title: "App 內更新"
    text: "App 更新會在背景下載，每個畫面都有更新按鈕。執行環境更新、修復和解除安裝都不需要 SSH。每次更新都會顯示進行到哪一步，首頁也會隨時告訴您進度。開車時無法進行的操作，會等到車子打入 P 檔再進行。"
  - title: "排行榜"
    text: "在首頁以顯示名稱加入，就能看到本週頒獎台、上週結果和累計排名。徽章依 comma 自己記錄的里程取得，comma.ai 累計榜則顯示 comma.ai 為您的 comma 記錄的總數。"
  - title: "當機報告"
    text: "它們幫助我們更快修正問題，個人資訊會被移除。您可以在「設定」中關閉。"
  - title: "修正"
    text: "comma four 的 MAX 速度在啟用時不再閃爍。comma 3 現在會清楚說明不支援；CommaView 支援 comma 3X 和 comma four。"
runtime:
  - title: "在 P 檔時更新，在家也可以"
    text: "讓車子保持通電、打入 P 檔且 openpilot 未啟用，或把 comma 放在桌上設定。絕不會打斷行駛。"
  - title: "更安全的更新"
    text: "一次只進行一項，如果出了問題，comma 會回到原本的版本。"
  - title: "新功能的幕後功臣"
    text: "駕駛統計、車輛位置、跨裝置錄影和排行榜同步都來自新的執行環境。App 會為您安裝它。"
