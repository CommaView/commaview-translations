title: "全新的首頁、您車子的圖片，以及集中管理帳號的地方"
out:
  - title: "您在 my.commaview.com 的帳號"
    text: "用寄到電子郵件的驗證碼登入、下載 App、查看最新消息。現在 Beta 版和更新也從這裡取得；Firebase App Distribution 已停用。"
  - title: "從帳號取得更新"
    text: "App 會在您的帳號中檢查新版本，並在 App 內提供。每個 App 版本都附帶經過測試的搭配執行環境。"
  - title: "意見回饋和功能看板"
    text: "在 App 的「設定」中傳送建議、問題或讚美，如果希望我們仔細看看，也可以附上支援資料包；並在 my.commaview.com 的功能看板上，為我們接下來要做的功能投票。"
  - title: "您車子的新圖片"
    text: "每款支援的車款都有一張風格統一的新圖片，尺寸和光線一致，在任何螢幕上都顯示得乾淨俐落。"
next:
  - title: "全新的裝置首頁"
    text: "您的車子在一張卡片中登場，附有 **開啟 Live View**，下面依序是 **本週駕駛**、**車輛位置** 和您最近的錄影。"
  - title: "為平板和車機設計"
    text: "在較寬的螢幕上，首頁會變成儀表板，「設定」和「裝置設定」會在清單旁邊開啟。"
runtime:
  - title: "駕駛統計"
    text: "根據 comma 自己的記錄，統計您一週的行駛距離、駕駛時間和行程數。"
  - title: "車輛位置"
    text: "您開車時車子在哪裡，以及您把車停在哪裡。在您開啟之前保持關閉。"
