title: "直播開放給所有人、傳送行程，以及以盡力支援方式支援更多 openpilot 分支版本"
out:
  - title: "直播開放給所有人"
    text: "以 720p 或 1080p 把 Live View 顯示的內容串流到您的 YouTube 頻道或其他 RTMP 伺服器；如果您選擇了麥克風，還會帶上 comma 或手機麥克風的聲音。在 設定 › 直播 中設定。直播一開始是 **不公開**，觀看的人都看得到您開車經過的地方。"
  - title: "傳送給 CommaView，提供給會員"
    text: "從「錄影」把一段或多段行程連同一段說明傳給我們，講講發生了什麼事：每段行程的道路和廣角影片及其記錄，絕不包含車內鏡頭畫面、聲音或您車子的 VIN。現在，一個 **傳送給 CommaView** 面板承載您傳給我們的所有內容，問題和想法都一樣。"
  - title: "一次處理多段行程"
    text: "在「錄影」中選取多段行程，可以一起分享、製作回放、傳送或刪除。"
  - title: "您的請求"
    text: "在登入狀態下回報問題或提供想法時，我們可以回覆您：設定 › 支援與診斷 › **您的請求** 會顯示我們的回覆，您會收到一封電子郵件，對話可以在 my.commaview.com 上繼續。"
  - title: "Live View 適合每種螢幕"
    text: "它的控制項不再需要捲動，也不會把 **離開** 擠出畫面：放不下的會移到 **更多**；文字較大時，控制項會移到 **更多**，而不是把任何東西縮小。Live View 對手機的負擔更輕，卡住時會自己恢復，而不是一直凍結。"
  - title: "設定重新整理"
    text: "**隱私權與分享** 會說明哪些內容會離開您的手機；**支援與診斷** 用來回報問題和查看您的請求；**帳號** 的最後是 **刪除您的帳號**。**協助改善 CommaView** 會詢問一次，是否傳送當機報告，以及您的 comma 執行的是哪種駕駛軟體。"
  - title: "排行榜開放給所有會員"
    text: "它不再取決於功能開關。首頁卡片最多每 30 分鐘重新整理一次，並顯示上次更新的時間。"
  - title: "支持 CommaView"
    text: "設定 › 支援與診斷 › **支持 CommaView** 會開啟我們的 Buy Me a Coffee 頁面，幫忙支付主機代管、測試和 iOS App 的費用。它不會解鎖任何功能。"
  - title: "修正"
    text: "Android 16 車機在影像解碼器出錯時，不會再在 Live View 中關閉 CommaView；在之前顯示黑畫面的車機上，StarPilot 的 comma 3X 畫面現在能正確顯示鏡頭畫面；透過 VPN 時，YouTube 登入和直播也能正常運作。"
earlyAccessNote: "導航、Surround、Surround V2 和實驗性工具仍在早期開發階段，在收集意見期間透過功能開關開放給一小群測試者。其中一些使用付費服務，例如導航的路線規劃，所以我們會維持小規模測試。如果想幫忙測試，請到 Discord 聯絡我們。"
earlyAccess:
  - title: "導航"
    text: "行程中在 Live View 裡顯示地圖，放在影像旁邊或角落；沒有行程時顯示 **要去哪裡？**。在角落的地圖上，「結束」和「靜音」隨時都在，「結束」可在 8 秒內復原，您也可以用說的告訴它要去哪裡。"
  - title: "地圖主題"
    text: "導航的地圖現在有淺色和深色主題，會依您 comma 所在地的日出和日落自動切換，在陽光下也看得清楚。在 設定 › 地圖與導航 › **地圖主題** 中選擇 **自動**、**與手機相同**、**淺色** 或 **深色**。"
  - title: "Surround 和 Surround V2"
    text: "Surround 會在回放中把停著的車放在它實際所在的位置，並隱藏實際上是雷達目標的純鏡頭辨識車輛。Surround V2 是實驗性的第二繪製器，位於 設定 › 實驗性工具。"
runtime:
  - title: "僅限已配對的手機"
    text: "您 comma 的鏡頭和資料只會傳到與它配對的手機和車機。請先更新每支手機和每台車機上的 CommaView：還停在 0.0.164 的裝置，將無法從使用這個執行環境的 comma 取得影像。"
  - title: "貢獻給車輛偵測"
    text: "提供給會員：把完整的行程貢獻出來，訓練 Surround 使用的車輛偵測器，可以輕觸一下，也可以自動進行，在您從 comma 已儲存的 Wi‑Fi 和手機行動數據中選擇的網路上傳，需要的話，每個網路都能設定每月上限。貢獻是永久的：之後無法移除。其中沒有任何內容標示您或您的 comma，但行程的路線和影片可能會透露您在哪裡開車。"
  - title: "更多 openpilot 分支版本，盡力支援"
    text: "CommaView 現在能以盡力支援的方式安裝在更多 openpilot 分支版本上：設定會檢查 CommaView 未列出的分支版本，不做任何變更，並在您同意後加入 CommaView 的視圖。**解除安裝執行環境** 會把分支版本的檔案還原。"
  - title: "會自行復原的安裝"
    text: "安裝到一半斷電或重新啟動，會還原先前的版本；下載卡住時會從中斷的地方繼續；App 不再監聽時，安裝會繼續進行。"
  - title: "較新 openpilot 上的實驗模式"
    text: "在 openpilot 的 nightly 版本和 sunnypilot dev 上，Live View 會像 openpilot 一樣顯示實驗模式。"
