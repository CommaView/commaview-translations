title: "StarPilot、和您分支版本一致的畫面，以及全新的排行榜"
out:
  - title: "StarPilot"
    text: "CommaView 現在支援 comma 3X 和 comma four 上的 StarPilot，透過 StarPilot 自己的安裝程式安裝。Live View 會依照它的 Camera View 設定（包括車內鏡頭），並在它的 Disable Logging 設定停止影像時告訴您。"
  - title: "和您分支版本一致的畫面"
    text: "comma four 和 comma 3X 的畫面會繪製您分支版本在 comma 上畫的內容：它的字型、警示和鏡頭畫面的調色。在 StarPilot 上，它們會帶來 StarPilot 自己的 HUD、路徑和小工具，例如速限標誌、前車資訊、導航卡片和開發者側邊欄。"
  - title: "在「顯示」中選擇畫面"
    text: "設定 › 顯示 可以從下拉選單選擇行車畫面，預覽會顯示您自己 comma 的分支版本和鏡頭。"
  - title: "Live View 中的每一格"
    text: "Live View 現在會繪製 comma 傳來的每一格，最高每秒 20 格，以前會略過一些。comma 3X 畫面由手機的 GPU 繪製（Android 9 以上版本），所以跟得上影像。"
  - title: "會自行恢復的 Live View"
    text: "它不會再卡在「正在重新連線… 第 1 次嘗試」；車子熄火時，它會等待，並在車子發動時自動開啟影像。一個狀態面板會說明正在發生什麼事，並附上對應的按鈕，而不是在影像開始時閃過「openpilot Unavailable」。"
  - title: "執行環境更新後重新啟動"
    text: "comma 的執行環境安裝或更新後，App 會用一個 **重新啟動** 按鈕請您重新啟動，Live View 和 **錄影** 會等到您重新啟動之後；comma 絕不會自行重新啟動。首頁的更新卡片變小了：輕觸它可以看到每一步。"
  - title: "首頁即時更新"
    text: "首頁會在幾秒內顯示每台 comma 是否在線，不必下拉重新整理，尋找時會顯示「正在檢查」。新的 App 更新推出後不久，每次您回到 App 時都會顯示。"
  - title: "全新設計的排行榜"
    text: "**排名** 和 **成就**，可選 **本週**、**上週** 或 **累計**：您和上一名的 comma 差多少、下一個成就還差多少，以及全部 17 個可以取得的成就。您的個人檔案彙整了您的數據和設定，平板和車機會在榜單旁保留一個「您」面板。"
  - title: "加入前就能看頒獎台"
    text: "首頁會以三階台座顯示本週頒獎台和獎牌，您可以在加入之前先看看排行榜。"
  - title: "更從容的回放佇列"
    text: "每段行程佔一列，顯示進度、**暫停**、**繼續** 或 **重試**，以及一個用來移動、回報或移除的選單，您也可以拖曳行程調整順序。進度不會再停在 99%：儲存完成的回放會顯示為獨立的一步。"
  - title: "和 Live View 一致的回放"
    text: "回放會像 Live View 一樣繪製您分支版本的畫面和離線地圖的速限標誌，並標出 comma 沒有保存 HUD 資料的時段。"
  - title: "更好的離線地圖"
    text: "**新增地圖** 中的搜尋可以搭配螢幕鍵盤使用，在 Android 15 上 **下載** 會留在畫面上，下載也會在背景繼續。在您的地圖中查不到速限的地方，標誌會顯示 sunnypilot 的速限。"
  - title: "修正"
    text: "手機或車機的時鐘不正確時，不會再把您擋在 Beta 之外。sunnypilot 上的 GREEN LIGHT 和 LEAD DEPARTING 警示一定會顯示圓圈，CommaView 速限標誌上的數字也不會再幾乎黏在一起。"
runtime:
  - title: "每段行程都算數"
    text: "comma 會在您行駛時記錄每段行程，所以隨車子一起斷電的 comma 也能保留行程，即使是在它知道時間之前開始的行程。排行榜的「本週」會在行駛過程中更新。"
  - title: "StarPilot 和您分支版本的畫面"
    text: "執行環境可以安裝在 StarPilot 上，能找到以 High Bitrate Recording 或 Konik 設定保存的行程，並傳送您分支版本畫面所繪製的內容，讓 comma four 和 comma 3X 的畫面和它一致。"
  - title: "Live View 收回鏡頭"
    text: "您的手機或車機重新連線時會立即收回鏡頭，離線的裝置會在大約十秒內釋放鏡頭。"
  - title: "減輕 comma 的負擔"
    text: "執行環境會自己產生 openpilot 的遙測資料並以精簡的形式傳送，只在錄影前後保留 HUD 資料，並在幾秒內告訴 App 您的 comma 是否在線。在忙碌的 comma 上，**錄影** 不會再失敗。"
  - title: "一直可用的回放"
    text: "comma 在停車時重新啟動後，已完成的行程不會再被標示為損毀，一段很長的行程也不會再擋住其他行程的回放。"
