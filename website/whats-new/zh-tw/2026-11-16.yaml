title: "每支手機一把金鑰、CommaView 新增 11 種語言，以及 Browser View"
out:
  - title: "用您的語言使用 CommaView"
    text: "設定 › **語言**：除了英文，還有 Deutsch、Español、Français、日本語、한국어、Português (Brasil)、ไทย、Türkçe、Українська、简体中文 和 繁體中文。它們是機器翻譯的，還沒有經過母語人士審閱，所以哪裡讀起來不對，請告訴我們。comma 自己的畫面會維持它的語言。"
  - title: "Browser View"
    text: "在車上的網頁瀏覽器中顯示 Live View，Tesla 也可以：在 Live View 的 **詳細資訊** 中啟動，然後在車上的瀏覽器輸入短網址。畫面透過手機的熱點從手機傳到車上，絕不經過網際網路。"
  - title: "保存這個片段"
    text: "Live View 的 **保存** 會把行程中先前的 3 分鐘和接下來的 1 分鐘存成手機上的一個 MP4，停車後複製過來。"
  - title: "匯出完整行程… 和自動拉取行程"
    text: "把整段行程複製成一個 MP4，或在您選擇的 Wi‑Fi 上大約每半小時把新行程複製回家，最多使用您分配給它的空間。"
  - title: "疊加套件商店"
    text: "疊加套件會把分支版本在自己螢幕上畫的內容加到 Live View。會員可以瀏覽 **官方** 和 **社群** 套件，以及 **適用您的 comma** 的套件；任何人都可以從檔案或連結加入套件。"
  - title: "使用您自己的 Stadia Maps 金鑰導航"
    text: "提供給會員：用您自己的 Stadia Maps 帳號使用 **要去哪裡？**、路線和逐向導引，金鑰加密保存在您的手機上。"
  - title: "自動開啟 CommaView"
    text: "在車機啟動時、藍牙連線時自動開啟，並在 comma 連線時直接進入 Live View。每一項在您於 設定 › 顯示 開啟之前都保持關閉。"
  - title: "分享給我的分支版本開發者…"
    text: "那一段的片段影片、摘要和 CommaView 記錄，透過 Android 的分享面板傳到您分支版本接收回報的地方。不會傳送任何內容給 CommaView。"
  - title: "Live View 會說明發生了什麼事"
    text: "它會等待 comma 需要的重新啟動，在車輛資料中斷或畫面延遲時告訴您，說明重新連線的原因，並透過嘗試另一個影像解碼器在更多車機上播放。"
  - title: "更新 CommaView"
    text: "提供給會員，從 0.0.166 起：更新會顯示版本號，可以取消，並會在背景繼續下載。"
  - title: "修正"
    text: "在較矮的視窗中使用大字級時不再有內容被截斷；**聲音** 關閉時直播會保持靜音；comma 在行程中斷電時，該行程的回放會用上斷電前的所有內容。"
earlyAccessNote: "直播到 X、Twitch、Kick 和 Facebook、「僅影像」、分支版本設定、製作疊加套件以及 Surround，在收集意見期間透過功能開關開放給一小群測試者。如果想幫忙測試，請到 Discord 聯絡我們。"
earlyAccess:
  - title: "直播到更多平台"
    text: "X、Twitch、Kick 和 Facebook，每個平台都有自己的功能開關，直到用真實帳號串流測試過為止。"
  - title: "僅影像"
    text: "適用於 FrogPilot 和 KisaPilot，CommaView 無法在它們的畫面中加入自己的視圖：在 CommaView 自己的視圖中顯示鏡頭畫面和駕駛資料，不變更分支版本中的任何內容。"
  - title: "分支版本設定"
    text: "在 comma 的裝置設定中調整駕駛軟體自己的設定，在停車時變更，並在手機上保留備份。"
runtime:
  - title: "每支手機一把金鑰"
    text: "每支手機都會自動取得一把自己的金鑰來連接您的 comma，誰都不必重新配對。在第一支手機取得金鑰後的 90 天內，舊版 App 的手機仍可繼續使用；之後它們需要 0.0.166 和一組邀請碼。"
  - title: "BluePilot、dragonpilot 和 OPGM"
    text: "現在是列出的分支版本，會顯示名稱，並以它們所依據的版本的樣式繪製。"
  - title: "經過驗證的安裝，絕不降版"
    text: "App 會在安裝前檢查每個執行環境的簽章，comma 也會拒絕較舊的執行環境。"
  - title: "carrotpilot 和 StarPilot 7.0"
    text: "繪製更多 carrotpilot 的畫面，並在韓文、日文、中文和泰文中使用它自己的字型；以盡力支援的方式支援 StarPilot 7.0 的開發分支。"
