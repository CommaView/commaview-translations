title: "又多了兩個分支版本、即時副本，以及導航和 Surround 搶先體驗"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView 可以安裝在這個針對 Tesla HW1 車款的 sunnypilot 分支版本上，顯示它的名稱，並繪製 sunnypilot 的畫面和 sunnypilot 新增的所有內容。"
  - title: "carrotpilot"
    text: "CommaView 可以安裝在這個針對現代、起亞和 Genesis 車款的 openpilot 分支版本上，並為它繪製 openpilot 的畫面。carrotpilot 在自己畫面上新增的內容，例如導航和測速照相，目前還不會繪製。carrotpilot 自行更新後，App 會要求重新啟動，重新啟動後 Live View 就會回來。"
  - title: "即時副本"
    text: "設定 › 錄影 › **在 Live View 中錄影** 用來選擇 **錄影** 要產生什麼：行程結束後的回放（畫質最好，最長 10 分鐘，和以前一樣）、Live View 所顯示畫面的即時副本（停車那一刻就能看，沒有 10 分鐘限制），或兩者都要。即時副本是 720p 或 1080p，鎖定手機時會繼續錄，儲存空間用完前會正常停止，並存在您的手機上。"
  - title: "設定頁面用滿整個螢幕"
    text: "「錄影」「顯示」和「直播」在空間夠時以兩欄佔滿整個螢幕，「設定」清單會說明每個頁面有什麼，每個頁面在平板、車機和橫拿的手機上都排列整齊。"
  - title: "重新整理存取權限"
    text: "設定 › 帳號 › **存取權限與功能** 會顯示您的存取權限何時續期，**重新整理存取權限** 會立即套用為您開啟或關閉的功能，以前最多要等一天。"
  - title: "安裝失敗的原因"
    text: "如果設定、執行環境更新或解除安裝失敗，App 會說明哪裡出了問題、該怎麼做（CommaView 不支援的分支版本、車子正在行駛、comma 沒有網路），告訴您 comma 是否已還原為原本的狀態，**複製詳細資料** 會複製支援人員需要的報告。"
  - title: "集中顯示更新的卡片"
    text: "執行環境更新只會顯示在首頁的更新卡片上。失敗的更新也顯示在那裡，附有 **再試一次** 和 **關閉**。"
  - title: "回放更快"
    text: "回放只下載它要顯示的影片，製作一段回放時會同時下載下一段行程，在 Android 9 以上版本由 GPU 繪製 HUD。因 App 關閉、10 分鐘限制或車子熄火而中斷的錄影，現在也會顯示 **製作回放**。"
  - title: "回放畫質設定恢復正常"
    text: "Balanced、High 和 Max 又會產生不同的回放了；先前每段回放都以 40 Mbit/s 產生。預設的 High 在 comma 3X 上產生的檔案大約只有原本的一半。"
  - title: "除錯片段按鈕已移除"
    text: "分享錯誤報告只會傳送記錄。您保留的除錯片段仍在「錄影」中。"
  - title: "修正"
    text: "車機切換到夜間模式時，「設定」會停留在目前的頁面。在 Android 15 上橫拿的手機會避開鏡頭開孔。在沒有檔案選擇器的車機上匯入您自己的 SSH 金鑰時，App 不會再關閉。"
earlyAccessNote: "導航、Surround、直播和傳送給 CommaView 還在早期開發階段。我們在收集意見期間開放給一小群測試者，其中一些使用付費服務，例如導航的路線規劃，所以在了解正常使用的成本之前，我們會維持小規模測試。如果想幫忙測試，請到 Discord 聯絡我們：我們希望測試者在自己的行程中使用它們，並告訴我們表現如何。"
earlyAccess:
  - title: "導航"
    text: "從首頁到 Live View 的逐向導引：搜尋地點、比較最多三條路線，然後跟著轉向卡片、語音提示，以及在 CommaView 畫面上畫在您車道裡的箭頭走。轉錯彎後，幾秒內就會找到新路線。它只負責顯示：不會傳送任何內容到您的 comma 或車子，您的地點也會留在手機上。"
  - title: "Surround"
    text: "作為第四種行車畫面，以 3D 視圖顯示車子周圍的道路：鏡頭看到的道路和它的車道線、路口與行人穿越道；平順移動並顯示煞車燈的汽車、卡車和公車；以及面向您的紅綠燈，依它們顯示的顏色亮起。它在您的手機上執行自己的車輛偵測器，在車機上的速度約為以前的 13 倍。"
  - title: "直播"
    text: "以 720p 或 1080p 把 Live View 顯示的內容串流到您的 YouTube 頻道或其他 RTMP 伺服器。登入 YouTube 一次後，直播會為您建立、開始和結束每一場直播；如果您選擇了麥克風，還會帶上 comma 或手機麥克風的聲音。"
  - title: "傳送給 CommaView"
    text: "從「錄影」把一段錄下的行程連同一段說明傳給我們，講講發生了什麼事。其中絕不包含車內鏡頭畫面、聲音或您車子的 VIN。"
runtime:
  - title: "又多了兩個分支版本"
    text: "執行環境能辨識 SunnyPilot-TeslaHW1 和 carrotpilot。"
  - title: "安裝失敗時說明原因"
    text: "安裝程式會指出原因，例如不支援的分支版本，讓 App 能告訴您。"
  - title: "回放下載更快"
    text: "App 每次請求最多 4 MiB 的行程影片，以前是 256 KiB；Wi‑Fi 訊號很弱的手機也不會再拖慢 comma 對其他請求的回應。"
  - title: "沒看到結束的行程也能製作回放"
    text: "comma 會告知錄影的行程何時結束，所以即使手機沒有看到行程結束，App 也能製作回放。"
  - title: "直播中使用 comma 的麥克風"
    text: "適用於有直播功能的帳號：只有當您為直播選擇了 comma 的麥克風時，它的聲音才會傳到您的手機。openpilot 自己的錄音不會開啟，comma 也絕不會保存聲音。"
