title: "離線地圖和速限、各地區的標誌，以及回放佇列"
out:
  - title: "離線地圖和速限"
    text: "在 設定 › 離線地圖 下載一個國家或美國的一個州，開啟 comma 的位置後，CommaView 會根據 comma 的即時 GPS 顯示速限。下載可以暫停、繼續和更新，速限僅供顯示。"
  - title: "符合您行駛地區的速限標誌"
    text: "CommaView 的標誌會依 comma 的位置採用七種樣式之一：大多數國家（包括英國和台灣）使用的紅圈圓形標誌，或美國、加拿大、日本、瑞典、芬蘭和冰島、愛爾蘭和巴西，或澳洲的標誌。"
  - title: "轉向弧線"
    text: "CommaView 疊加圖層的車速儀表區下方有一道弧線，顯示 openpilot 轉向的力道，儀表區也恢復了玻璃質感。即使 MAX 和速限未知，它們也會留在原位。"
  - title: "填滿螢幕或完整鏡頭"
    text: "橫向時，CommaView 疊加圖層會裁切鏡頭畫面以 **填滿螢幕**，或用 **完整鏡頭** 顯示整個畫面。新的錄影會保留您選擇的裁切方式。"
  - title: "回放佇列"
    text: "把多段行程加入佇列，它們的回放會在背景製作，連線中斷後會從中斷的地方繼續。在「錄影」的 **佇列** 中暫停、繼續、重試或調整順序。"
  - title: "適合各種螢幕的錄影和地圖"
    text: "錄影和離線地圖庫經過重新設計，適合手機、平板和車機，「車輛位置」現在也適合較矮的螢幕和大字級。"
  - title: "更清楚的錄影問題說明"
    text: "某段行程無法做成回放時，「錄影」會說明原因，從那裡傳送的回報也會包含我們調查所需的詳細資料。"
  - title: "首頁和排行榜"
    text: "離線時，「本週駕駛」和「車輛位置」仍會留在首頁，首頁也會顯示本週頒獎台。加入排行榜後，您的累計數據會自動同步，即使透過 comma 的熱點也可以。"
  - title: "不必更新 App 就能更新執行環境"
    text: "有相容的新執行環境時，就能更新 comma 的執行環境，不必等新版 App，進度也顯示得更清楚。"
  - title: "Beta 登入"
    text: "Beta 期間，CommaView 會請您用收到邀請的帳號登入。您的配對和設定都會保留，在存取通行證有效期間，App 也能離線使用。"
  - title: "更清楚的 Wi‑Fi 省電設定"
    text: "comma 的 Wi‑Fi 省電現在是簡單的開／關選項，會顯示系統預設值，並說明變更何時生效。"
runtime:
  - title: "從 App 重新啟動"
    text: "當更新需要 comma 重新啟動時，App 中的 **立即重新啟動 comma** 會為您重新啟動。只在車子熄火或停放時可用。"
  - title: "根據最新 GPS 取得速限"
    text: "在 sunnypilot 上，comma 會傳送最新的 GPS 定位，而不是快取的位置，所以離線地圖的速限會跟著您所在的位置。"
  - title: "更清楚的行程狀態"
    text: "comma 能分辨尚未完成的行程和已經不存在的行程，讓「錄影」能說明是哪一種，並讓已完成的行程保持完好。"
