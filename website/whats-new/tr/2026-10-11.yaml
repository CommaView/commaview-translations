title: "StarPilot, fork'unuza uyan ekranlar ve yeni bir sıralama"
out:
  - title: "StarPilot"
    text: "CommaView artık comma 3X ve comma four'da StarPilot ile çalışıyor; StarPilot'un kendi yükleyicisinden yüklenir. Live View, sürücü kamerası dahil Camera View ayarını izler ve Disable Logging ayarı videoyu durdurduğunda size söyler."
  - title: "Fork'unuza uyan ekranlar"
    text: "comma four ve comma 3X ekranları fork'unuzun comma'da çizdiğini çizer: yazı tipini, uyarılarını ve kamerayı nasıl renklendirdiğini. StarPilot'ta kendi HUD'unu, yol çizgisini ve hız sınırı tabelası, öndeki araç bilgisi, navigasyon kartı ve geliştirici kenar çubuğu gibi widget'larını getirir."
  - title: "Ekran'da bir ekran seçin"
    text: "Ayarlar › Ekran, sürüş ekranını bir açılır listeden seçer; önizleme de kendi comma'nızın fork'unu ve kameralarını gösterir."
  - title: "Live View'da her kare"
    text: "Live View artık comma'nın gönderdiği her kareyi, saniyede 20'ye kadar çiziyor; eskiden bazılarını atlıyordu. comma 3X ekranı telefonun GPU'su tarafından çizilir (Android 9 ve sonrası), böylece videoya yetişir."
  - title: "Kendini toparlayan Live View"
    text: "Artık “Reconnecting… Attempt 1” durumunda takılı kalmıyor; araç kapalıyken bekler ve araç çalışınca videoyu kendiliğinden açar. Video başlarken bir anlık “openpilot Unavailable” yerine tek bir durum paneli, düğmeleriyle birlikte neler olduğunu söyler."
  - title: "Çalışma ortamı güncellemelerinden sonra yeniden başlatma"
    text: "comma'nızın çalışma ortamı yüklendikten veya güncellendikten sonra uygulama bir Yeniden başlat düğmesiyle onu yeniden başlatmanızı ister; Live View ve Kayıt siz bunu yapana kadar bekler; comma asla kendiliğinden yeniden başlamaz. Ana sayfadaki güncelleme kartı daha küçük: her adım için ona dokunun."
  - title: "Ana sayfa güncel kalıyor"
    text: "Ana sayfa, yenilemek için çekmeden, her comma'nın orada olup olmadığını saniyeler içinde gösterir ve bakarken Denetleniyor der. Yeni bir uygulama güncellemesi, yayımlandıktan kısa süre sonra, uygulamaya her döndüğünüzde görünür."
  - title: "Yeniden tasarlanan sıralama"
    text: "Bu hafta, Geçen hafta veya Tüm zamanlar için Sıralama ve Başarımlar: üstünüzdeki comma'nın ne kadar önde olduğu, bir sonraki başarımınız için ne kaldığı ve kazanılacak 17 başarımın tümü. Profiliniz rakamlarınızı ve ayarlarınızı toplar; tabletler ve multimedya üniteleri panonun yanında bir Siz paneli tutar."
  - title: "Katılmadan önce podyum"
    text: "Ana sayfa bu haftanın podyumunu madalyalarıyla üç basamakta gösterir ve katılmadan önce sıralamaya göz atabilirsiniz."
  - title: "Daha sakin bir tekrar oynatma kuyruğu"
    text: "Her sürüş, ilerlemesi, Duraklat, Devam et veya Yeniden dene ve taşımak, bildirmek veya kaldırmak için bir menüyle tek satırdır; sürüşleri sürükleyerek yeniden sıralayabilirsiniz. İlerleme artık %99'da durmuyor: biten tekrar oynatmanın kaydedilmesi kendi adımı olarak görünüyor."
  - title: "Live View'a uyan tekrar oynatmalar"
    text: "Tekrar oynatmalar fork'unuzun ekranını ve çevrimdışı harita hız sınırı tabelasını Live View'un çizdiği gibi çizer ve comma'nın HUD verisi kaydetmediği anları işaretler."
  - title: "Daha iyi çevrimdışı haritalar"
    text: "Harita ekle'deki arama ekran klavyesiyle çalışıyor, İndir Android 15'te ekranda kalıyor ve indirmeler arka planda sürüyor. Haritalarınızın yanıtı olmayan yerlerde tabela sunnypilot'un sınırını gösteriyor."
  - title: "Düzeltmeler"
    text: "Saati yanlış olan bir telefon veya multimedya ünitesi sizi artık Beta'nın dışında bırakmıyor. sunnypilot'ta YEŞİL IŞIK ve ÖNDEKİ ARAÇ KALKIYOR uyarıları her zaman dairelerini gösteriyor ve CommaView'un hız sınırı tabelalarındaki rakamlar artık neredeyse birbirine değmiyor."
runtime:
  - title: "Her sürüş sayılır"
    text: "comma'nız her sürüşü siz sürerken kaydeder; böylece araçla birlikte kapanan bir comma, saati bilmeden önce başlayanlar dahil sürüşlerini korur. Sıralamanın Bu hafta'sı sürüş sırasında dolar."
  - title: "StarPilot ve fork'unuzun ekranı"
    text: "Çalışma ortamı StarPilot'a yüklenir, High Bitrate Recording veya Konik ayarlarıyla kaydedilen sürüşleri bulur ve fork'unuzun ekranının çizdiğini gönderir; böylece comma four ve comma 3X ekranları ona uyabilir."
  - title: "Live View kamerasını geri alıyor"
    text: "Telefonunuz veya multimedya üniteniz yeniden bağlandığında kamerayı hemen geri alır; ağdan düşen biri de onu yaklaşık on saniye içinde serbest bırakır."
  - title: "comma'nızı daha az yoruyor"
    text: "Çalışma ortamı openpilot'un telemetrisini kendisi oluşturup sıkıştırılmış biçimde gönderir, HUD verisini yalnızca bir kaydın çevresinde tutar ve comma'nızın orada olup olmadığını uygulamaya saniyeler içinde söyler. Kayıt, meşgul bir comma'da artık başarısız olmuyor."
  - title: "Erişilebilir kalan tekrar oynatmalar"
    text: "Biten sürüşler, comma park hâlindeyken yeniden başladıktan sonra artık hasarlı olarak işaretlenmiyor ve tek bir uzun sürüş artık diğer sürüşlerin tekrar oynatmalarını durduramıyor."
