title: "Yeniden tasarlanan CommaView, kendi katmanımız ve sıralama"
out:
  - title: "Yeniden tasarlanan uygulama"
    text: "Her ekran yeni bir tasarımla yeniden yapıldı: ana sayfa, Live View, Kayıtlar, Ayarlar, eşleştirme ve kurulum. Yeni bir simge ve açılış ekranıyla, aydınlık günler için de bir Gün ışığı moduyla geliyor."
  - title: "Yeni bir ana sayfa"
    text: "Sahnesinde aracınız ve Live View'u aç, ardından Bu haftaki sürüş, Araç konumu, son kayıtlarınız ve sıralama. Ana sayfayı özelleştir ile düzenleyin. comma'nız, dokunacak bir Yeniden bağlan olmadan kendiliğinden bağlı görünür."
  - title: "Tabletler ve multimedya üniteleri için yapıldı"
    text: "Daha geniş bir ekranda ana sayfa bir panele dönüşür, Ayarlar ve Kayıtlar listelerinin yanında açılır ve eşleştirme her multimedya ünitesine sığar."
  - title: "CommaView katmanı"
    text: "Kendi sürüş ekranımız: hızınız, MAKS ve hız sınırı tek bir kümede, modelin ne kadar emin olduğunu gösteren şerit çizgileri, yolunuza çıkmayan sürücü izleme ve uyarılar ve geçerli olduğu yerde Kanada'nın MAXIMUM tabelası. comma 3X ve comma four ekranları da orada ve ekranları doğrudan Live View'dan değiştirebilirsiniz."
  - title: "Daha basit ekran ayarları"
    text: "Canlı önizlemeli tek bir sürüş katmanı bölümü ve sizin için seçilmiş CommaView."
  - title: "Daha iyi kayıtlar"
    text: "Tekrar oynatmalar tam olarak Live View gibi görünür, uygulamada oynar ve araç P konumundayken oluşturulabilir. Oluşturulurken ilerlemelerini gösterirler. Her sürüşün bir küçük resmi var ve comma'nız birini silmeden önce uyarılırsınız."
  - title: "Tüm cihazlarınızda kayıtlar"
    text: "Kayıtlarınız eşleşmiş telefonlarınız ve multimedya üniteleriniz arasında sizi izler."
  - title: "Sürüş istatistikleri ve Araç konumu"
    text: "comma'nızın kendi günlüklerinden haftalık mesafeniz, sürüş süreniz ve sürüşleriniz; koyu bir haritada aracınızın nerede olduğu ve nereye park ettiğiniz. Konum siz açana kadar kapalı kalır."
  - title: "Bir cihaz sayfası"
    text: "comma'nızın durumu ve çalışma ortamı tek bir yerde. Oradan Live View'u açabilir, Wi‑Fi güç tasarrufunu yönetebilir, onarabilir ve yardım gerektiğinde günlükleri paylaşabilirsiniz."
  - title: "Uygulamada güncellemeler"
    text: "Uygulama güncellemeleri arka planda iner, her ekranda bir güncelleme düğmesi bulunur. Çalışma ortamı güncellemeleri, onarımlar ve kaldırma SSH gerektirmez. Her güncelleme ilerlerken adımlarını gösterir ve ana sayfa sizi bilgilendirir. Sürerken olamayacak her şey araç P konumuna alınana kadar bekler."
  - title: "Sıralama"
    text: "Bu haftanın podyumunu, geçen haftanın sonuçlarını ve tüm zamanlar sıralamasını görmek için ana sayfadan bir görünen adla katılın. Rozetler comma'nızın kendi kaydettiği mesafeyle kazanılır; bir comma.ai tüm zamanlar panosu da comma.ai'ın comma'nız için tuttuğu toplamı gösterir."
  - title: "Kilitlenme raporları"
    text: "Kişisel ayrıntılar çıkarılmış olarak sorunları daha hızlı düzeltmemize yardım eder. Ayarlar'dan kapatabilirsiniz."
  - title: "Düzeltmeler"
    text: "comma four'un MAKS hızı devredeyken artık titremiyor. comma 3 artık desteklenmediğini açıkça söylüyor; CommaView comma 3X ve comma four'da çalışır."
runtime:
  - title: "P konumunda güncellemeler, evde bile"
    text: "Aracı P konumunda, openpilot devre dışıyken çalışır tutun ya da comma'yı masanıza kurun. Bir sürüş asla yarıda kesilmez."
  - title: "Daha güvenli güncellemeler"
    text: "Teker teker; bir şey ters giderse comma'nız sahip olduğu sürüme geri döner."
  - title: "Yeni özelliklere güç veren"
    text: "Sürüş istatistikleri, Araç konumu, cihazlar arası kayıtlar ve sıralama eşitlemesi yeni çalışma ortamından geliyor. Uygulama onu sizin için yükler."
