title: "Herkes için canlı yayın, sürüş gönderme ve sınırlı destekle daha fazla openpilot fork'u"
out:
  - title: "Canlı yayın, herkes için"
    text: "Live View'un gösterdiğini YouTube kanalınıza veya başka bir RTMP sunucusuna 720p ya da 1080p olarak yayınlayın; seçerseniz comma'nızın veya telefonunuzun mikrofonundan ses ile. Ayarlar › Canlı yayın'da kurun. Yayınlar Liste dışı olarak başlar ve izleyen herkes nerede sürdüğünüzü görür."
  - title: "CommaView'a gönder, üyeler için"
    text: "Kayıtlar'dan bir veya birkaç sürüşü, ne olduğunu anlatan bir notla bize gönderin: her birinin yol ve geniş açı videosu ve günlüğü; asla sürücü kamerası, ses veya aracınızın VIN'i değil. Tek bir CommaView'a gönder sayfası artık bize gönderdiğiniz her şeyi, sorunları da fikirleri de taşıyor."
  - title: "Aynı anda birkaç sürüş"
    text: "Kayıtlar'da sürüşleri seçip birlikte paylaşın, tekrar oynatmalarını oluşturun, gönderin veya silin."
  - title: "Talepleriniz"
    text: "Giriş yapmışken bir sorun bildirdiğinizde veya fikir gönderdiğinizde yanıt verebiliyoruz: Ayarlar › Destek ve tanılama › Talepleriniz yanıtlarımızı gösterir, size e-posta gelir ve konuşma my.commaview.com'da sürer."
  - title: "Live View her ekrana sığıyor"
    text: "Denetimleri artık kaymıyor ve Çık'ı kesmiyor: sığmayan Daha fazla'ya gider, büyük metin de bir şeyi küçültmek yerine denetimleri Daha fazla'ya taşır. Live View telefonu daha az yoruyor ve donmak yerine kendini yeniden çalıştırıyor."
  - title: "Yeniden düzenlenen Ayarlar"
    text: "Gizlilik ve paylaşım telefonunuzdan neyin çıktığını söyler, Destek ve tanılama sorun bildirip taleplerinizi bulacağınız yerdir ve Hesap, Hesabınızı silin ile biter. CommaView'u geliştirmeye yardım edin, kilitlenme raporlarının ve comma'nızın çalıştırdığı sürüş yazılımının gönderilip gönderilmeyeceğini bir kez sorar."
  - title: "Sıralama, her üye için"
    text: "Artık bir özellik bayrağına bağlı değil. Ana sayfadaki kart en fazla 30 dakikada bir yenilenir ve en son ne zaman yenilendiğini söyler."
  - title: "CommaView'u destekleyin"
    text: "Ayarlar › Destek ve tanılama › CommaView'u destekleyin, barındırma, test ve iOS uygulamasının masraflarına yardım için Buy Me a Coffee sayfamızı açar. Hiçbir şeyin kilidini açmaz."
  - title: "Düzeltmeler"
    text: "Android 16 bir multimedya ünitesi, video kod çözücüsü başarısız olduğunda Live View'da CommaView'u artık kapatmıyor, StarPilot'un comma 3X ekranı görüntüyü siyah gösteren multimedya ünitelerinde kamerasını çiziyor, YouTube'a giriş ve Yayına başla da bir VPN üzerinden çalışıyor."
earlyAccessNote: "Navigasyon, Surround, Surround V2 ve Deneysel araçlar hâlâ erken geliştirme aşamasında; geri bildirim toplarken özellik bayraklarının arkasında sınırlı bir test grubuna açık. Navigasyon'un rotaları gibi bazıları ücretli hizmetlerle çalışıyor; bu yüzden grubu küçük tutuyoruz. Test etmeye yardım etmek için bize Discord'dan ulaşın."
earlyAccess:
  - title: "Navigasyon"
    text: "Bir yolculuk sırasında Live View'da, videonun yanında veya köşesinde bir harita; yolculuk yokken de Nereye?. Köşe haritasında Bitir ve Sesi kapat her zaman orada, Bitir 8 saniye boyunca geri alınabilir ve nereye gideceğinizi sesle söyleyebilirsiniz."
  - title: "Harita temaları"
    text: "Navigasyon'un haritası artık Açık ve Koyu temalara sahip; comma'nızın bulunduğu yerde gün doğumu ve batımında değişir, böylece güneşte de okunur. Ayarlar › Haritalar ve navigasyon › Harita teması'nda Otomatik, Telefonla aynı, Açık veya Koyu'yu seçin."
  - title: "Surround ve Surround V2"
    text: "Surround, tekrar oynatmalarda park hâlindeki bir aracı durduğu yere yerleştirir ve aslında radarın gördüğü bir araç olan yalnızca kameradan görülen aracı gizler. Surround V2 deneysel ikinci bir oluşturucu; Ayarlar › Deneysel araçlar'da."
runtime:
  - title: "Yalnızca eşleşmiş telefonlar"
    text: "comma'nızın kameraları ve verileri yalnızca onunla eşleşmiş telefonlara ve multimedya ünitelerine gider. Önce her telefon ve multimedya ünitesinde CommaView'u güncelleyin: 0.0.164'te kalan biri, bu çalışma ortamındaki bir comma'dan görüntü alamaz."
  - title: "Araç algılamaya katkıda bulunun"
    text: "Üyeler için: Surround'un kullandığı araç algılayıcısını eğitmek için sürüşlerin tamamını bir dokunuşla veya otomatik olarak verin; comma'nızın kayıtlı Wi‑Fi ağları ve telefonunuzun mobil verisi arasından seçtiğiniz ağlarda, isterseniz her birine aylık sınırla. Bir katkı kalıcıdır: sonradan kaldırılamaz. Hiçbir şey sizin veya comma'nızın adını vermez, ama bir sürüşün rotası ve videosu nerede sürdüğünüzü gösterebilir."
  - title: "Sınırlı destekle daha fazla openpilot fork'u"
    text: "CommaView artık daha fazla openpilot fork'una sınırlı destekle yükleniyor: kurulum, CommaView'un listelemediği bir fork'u hiçbir şeyi değiştirmeden kontrol eder ve siz onaylayınca CommaView'un görünümünü ekler. Çalışma ortamını kaldır, fork'un dosyalarını geri koyar."
  - title: "Kendini toparlayan kurulumlar"
    text: "Kurulum sırasında elektrik kesilmesi veya yeniden başlatma önceki sürümü geri getirir, takılan bir indirme kaldığı yerden sürer ve uygulama dinlemeyi bıraktığında kurulum devam eder."
  - title: "Yeni openpilot'ta Deneysel mod"
    text: "openpilot'un nightly'sinde ve sunnypilot dev'de Live View, Deneysel modu openpilot gibi gösterir."
