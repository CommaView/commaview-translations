title: "Çevrimdışı haritalar ve hız sınırları, bölgesel tabelalar ve bir tekrar oynatma kuyruğu"
out:
  - title: "Çevrimdışı haritalar ve hız sınırları"
    text: "Ayarlar › Çevrimdışı haritalar'da bir ülkeyi veya bir ABD eyaletini indirin; konum açıldığında CommaView hız sınırını comma'nızın canlı GPS'inden gösterir. İndirmeler duraklatılabilir, sürdürülebilir ve güncellenebilir; sınırlar yalnızca görüntü içindir."
  - title: "Sürdüğünüz yere göre hız sınırı tabelaları"
    text: "CommaView'un tabelası comma'nızın konumuna göre yedi stilden birini alır: Birleşik Krallık ve Tayvan dahil çoğu ülkede kullanılan kırmızı halkalı daire ya da ABD, Kanada, Japonya, İsveç, Finlandiya ve İzlanda, İrlanda ve Brezilya veya Avustralya tabelaları."
  - title: "Direksiyon hilali"
    text: "CommaView katmanının hız kümesinin altındaki bir hilal openpilot'un ne kadar sert yönlendirdiğini gösterir ve küme cam görünümüne geri döndü. MAKS ve hız sınırı bilinmediklerinde bile yerinde kalır."
  - title: "Ekranı doldur veya Tam kamera"
    text: "Yatayda CommaView katmanı kamerayı kırparak ekranı doldurur ya da Tam kamera ile tüm görüntüyü gösterir. Yeni kayıtlar seçtiğiniz kırpmayı korur."
  - title: "Bir tekrar oynatma kuyruğu"
    text: "Birkaç sürüşü kuyruğa alın, tekrar oynatmaları arka planda oluşturulsun; bağlantı koparsa kaldıkları yerden devam ederler. Kayıtlar'daki Kuyruk'tan duraklatın, sürdürün, yeniden deneyin veya yeniden sıralayın."
  - title: "Her ekran için kayıtlar ve haritalar"
    text: "Kayıtlar ve çevrimdışı harita kitaplığı telefonlara, tabletlere ve multimedya ünitelerine uyacak şekilde yeniden tasarlandı; Araç konumu artık kısa ekranlara ve büyük metne sığıyor."
  - title: "Daha anlaşılır kayıt sorunları"
    text: "Bir sürüş tekrar oynatmaya dönüştürülemediğinde Kayıtlar nedenini söyler; oradan gönderilen bir rapor da incelememiz için gereken ayrıntıları içerir."
  - title: "Ana sayfa ve sıralama"
    text: "Bu haftaki sürüş ve Araç konumu çevrimdışıyken de Ana sayfada kalır ve Ana sayfa bu haftanın podyumunu gösterir. Sıralamaya katıldığınızda toplamlarınız comma'nın hotspot'undan bile kendiliğinden eşitlenir."
  - title: "Uygulama güncellemesi olmadan çalışma ortamı güncellemeleri"
    text: "comma'nızın çalışma ortamı, uyumlu bir sürüm çıktığında yeni bir uygulamayı beklemeden güncellenebilir ve ilerlemesi daha anlaşılır."
  - title: "Beta girişi"
    text: "Beta süresince CommaView, davetinizin gönderildiği hesapla giriş yapmanızı ister. Eşleştirmeleriniz ve ayarlarınız korunur; erişim hakkınız geçerliyken uygulama çevrimdışı çalışır."
  - title: "Daha anlaşılır Wi‑Fi güç tasarrufu"
    text: "comma'nızın Wi‑Fi güç tasarrufu, sistem varsayılanını gösteren ve bir değişikliğin ne zaman etkili olacağını söyleyen basit bir açık/kapalı seçimi."
runtime:
  - title: "Uygulamadan yeniden başlatma"
    text: "Bir güncelleme comma'nızın yeniden başlamasını gerektirdiğinde uygulamadaki comma'yı şimdi yeniden başlat onu sizin için yeniden başlatır. Yalnızca araç kapalı veya park hâlindeyken çalışır."
  - title: "Taze GPS'ten hız sınırları"
    text: "sunnypilot'ta comma'nız önbellekteki bir konum yerine en yeni GPS konumunu gönderir; böylece çevrimdışı harita hız sınırları bulunduğunuz yeri izler."
  - title: "Daha anlaşılır sürüş durumu"
    text: "comma'nız henüz eksik olan bir sürüşü kaybolmuş olandan ayırır; böylece Kayıtlar hangisi olduğunu açıklayabilir ve biten sürüşleri sağlam tutar."
