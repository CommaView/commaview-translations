title: "Her telefona bir anahtar, 11 dil daha ve Browser View"
out:
  - title: "CommaView sizin dilinizde"
    text: "Ayarlar › Dil: İngilizcenin yanında Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文 ve 繁體中文. Hepsi makine çevirisi ve henüz anadili olanlarca gözden geçirilmedi; yanlış okunan yerleri bize söyleyin. comma'nızın kendi ekranları kendi dilinde kalır."
  - title: "Browser View"
    text: "Live View aracınızın web tarayıcısında, Tesla'nınkinde de: Live View'un Ayrıntılar bölümünden başlatın ve kısa bağlantıyı aracın tarayıcısına yazın. Görüntü telefonunuzdan araca hotspot üzerinden gider, asla internet üzerinden değil."
  - title: "Bu anı kaydet"
    text: "Live View'un Kaydet düğmesi bir sürüşün son 3 dakikasını ve sonraki dakikasını telefonunuzda bir MP4 olarak saklar; park ettiğinizde kopyalanır."
  - title: "Tüm sürüşü dışa aktar… ve Sürüşleri otomatik çek"
    text: "Bir sürüşün tamamını tek bir MP4 olarak kopyalayın ya da yeni sürüşlerin seçtiğiniz Wi‑Fi'da yaklaşık yarım saatte bir, ayırdığınız alana kadar telefona kopyalanmasını sağlayın."
  - title: "Katman paketleri mağazası"
    text: "Paketler, fork'unuzun kendi ekranında çizdiklerini Live View'a ekler. Üyeler Resmî ve Topluluk paketlerine ve comma'nız için olanlara göz atar; herkes bir dosyadan veya bağlantıdan paket ekleyebilir."
  - title: "Kendi Stadia Maps anahtarınızla navigasyon"
    text: "Üyeler için: kendi Stadia Maps hesabınızla Nereye?, rotalar ve adım adım yönlendirme; anahtar telefonunuzda mühürlü durur."
  - title: "CommaView'u kendiliğinden açma"
    text: "Bir multimedya ünitesi açıldığında, Bluetooth bağlandığında ve comma'nız bağlanınca doğrudan Live View'a. Her biri siz Ayarlar › Ekran'da açana kadar kapalıdır."
  - title: "Fork'umun geliştiricisiyle paylaş"
    text: "O bölüm için bir klip, bir özet ve CommaView'un günlüğü; Android'in paylaşım sayfasıyla fork'unuzun rapor aldığı yere paylaşılır. CommaView'a hiçbir şey gitmez."
  - title: "Live View neler olduğunu söylüyor"
    text: "comma'nın ihtiyaç duyduğu yeniden başlatmayı bekler, araç verisi durduğunda veya görüntü geciktiğinde söyler, neden yeniden bağlandığını söyler ve başka bir video kod çözücüyü deneyerek daha fazla multimedya ünitesinde oynatır."
  - title: "CommaView'u güncelleme"
    text: "Üyeler için 0.0.166'dan itibaren: güncelleme sürümünü gösterir, iptal edilebilir ve arka planda indirmeye devam eder."
  - title: "Düzeltmeler"
    text: "Kısa pencerelerde büyük metinde hiçbir şey kesilmiyor, Ses kapalıyken Yayına başla sessiz kalıyor ve sırasında comma'nın elektriği kesilen bir sürüşün tekrar oynatması kesintiye kadar olan her şeyi kullanıyor."
earlyAccessNote: "X, Twitch, Kick ve Facebook'a canlı yayın, Yalnızca video, Fork ayarları, katman paketi oluşturma ve Surround, geri bildirim toplarken özellik bayraklarının arkasında sınırlı bir test grubuna açık. Test etmeye yardım etmek için bize Discord'dan ulaşın."
earlyAccess:
  - title: "Daha fazla platforma canlı yayın"
    text: "X, Twitch, Kick ve Facebook; her biri gerçek bir hesapla yayın yapılana kadar kendi bayrağının arkasında."
  - title: "Yalnızca video"
    text: "CommaView'un görünümünü ekranına ekleyemediği FrogPilot ve KisaPilot için: kameralar ve sürüş verileri CommaView'un kendi görünümünde, fork'ta hiçbir şey değişmeden."
  - title: "Fork ayarları"
    text: "Sürüş yazılımınızın kendi ayarları comma'nızın cihaz ayarlarında; park hâlindeyken değiştirilir, yedekleri telefonunuzda durur."
runtime:
  - title: "Her telefona bir anahtar"
    text: "Her telefon comma'nız için kendiliğinden kendine ait bir anahtar alır ve kimse yeniden eşleştirme yapmaz. Eski uygulamalardaki telefonlar, ilk telefon anahtarını aldıktan sonra 90 gün çalışmaya devam eder; sonrasında 0.0.166'ya ve bir davete ihtiyaçları olur."
  - title: "BluePilot, dragonpilot ve OPGM"
    text: "Artık listelenen fork'lar; adlarıyla anılıyor ve temel aldıkları görünümle çiziliyor."
  - title: "Doğrulanmış kurulumlar, asla geriye değil"
    text: "Uygulama her çalışma ortamının imzasını yüklemeden önce kontrol eder ve comma daha eski bir çalışma ortamını reddeder."
  - title: "carrotpilot ve StarPilot 7.0"
    text: "carrotpilot'un ekranından daha fazlası, Korece, Japonca, Çince ve Tayca için kendi yazı tipiyle, ve StarPilot 7.0'ın geliştirme dalı, sınırlı destekle."
