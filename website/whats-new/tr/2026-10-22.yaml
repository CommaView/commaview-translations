title: "İki fork daha, canlı kopyalar ve Navigasyon ile Surround'a erken erişim"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView, Tesla'nın HW1 araçları için olan bu sunnypilot fork'una yüklenir, onu adıyla anar ve sunnypilot'un ekranını sunnypilot'un eklediği her şeyle çizer."
  - title: "carrotpilot"
    text: "CommaView, Hyundai, Kia ve Genesis araçları için olan bu openpilot fork'una yüklenir ve onun için openpilot'un ekranını çizer. carrotpilot'un kendi ekranına eklediği navigasyon ve hız kameraları gibi şeyler henüz çizilmiyor. carrotpilot kendini güncelledikten sonra uygulama, Live View'u geri getiren bir yeniden başlatma ister."
  - title: "Canlı kopyalar"
    text: "Ayarlar › Kayıtlar › Live View'da kayıt, Kayıt'ın ne oluşturacağını seçer: sürüşten sonra bir tekrar oynatma (en iyi görüntü, eskisi gibi en fazla 10 dakika), Live View'un gösterdiğinin durduğunuz anda hazır, 10 dakika sınırı olmayan bir canlı kopyası ya da ikisi de. Canlı kopya 720p veya 1080p'dir, telefon kilitliyken devam eder, depolama dolmadan düzgünce durur ve telefonunuzda kalır."
  - title: "Tüm ekranı kullanan ayarlar"
    text: "Kayıtlar, Ekran ve Canlı yayın sığdığında iki sütunda tüm ekranı kullanır, Ayarlar listesi her sayfada ne olduğunu söyler ve her sayfa tabletlerde, multimedya ünitelerinde ve yan tutulan telefonlarda düzgün hizalanır."
  - title: "Erişimi yenile"
    text: "Ayarlar › Hesap › Erişim ve özellikler erişiminizin ne zaman yenileneceğini söyler; Erişimi yenile de sizin için açılan veya kapanan bir özelliği, eskiden bir güne kadar süren işi, hemen uygular."
  - title: "Bir kurulum neden başarısız oldu"
    text: "Kurulum, çalışma ortamı güncellemesi veya kaldırma başarısız olursa uygulama neyin ters gittiğini ve ne yapılacağını (CommaView'un desteklemediği bir fork, aracın sürülüyor olması, comma'da internet olmaması), comma'nızın eski hâline getirilip getirilmediğini söyler; Ayrıntıları kopyala da desteğin ihtiyaç duyduğu raporu kopyalar."
  - title: "Güncellemeler için tek kart"
    text: "Bir çalışma ortamı güncellemesi yalnızca Ana sayfadaki güncelleme kartında görünür. Başarısız olan bir güncelleme orada Yeniden dene ve Kapat ile görünür."
  - title: "Daha hızlı tekrar oynatmalar"
    text: "Tekrar oynatma yalnızca gösterdiği videoyu indirir, biri oluşturulurken sonraki sürüş indirilir ve Android 9 ve sonrasında HUD'u GPU çizer. Uygulamanın kapanması, 10 dakika sınırı veya aracın kapanmasıyla yarıda kalan bir kayıt artık Tekrar oynatma oluştur seçeneğini alıyor."
  - title: "Tekrar oynatma kalitesi yine çalışıyor"
    text: "Dengeli, Yüksek ve Maks yine farklı tekrar oynatmalar üretiyor; her tekrar oynatma 40 Mbit/s ile oluşturuluyordu. Varsayılan olan Yüksek, bir comma 3X'ten yaklaşık yarı boyutta dosyalar üretir."
  - title: "Debug Clip düğmesi kaldırıldı"
    text: "Hata raporu paylaşma yalnızca günlükleri gönderir. Sakladığınız hata ayıklama klipleri Kayıtlar'da kalır."
  - title: "Düzeltmeler"
    text: "Bir multimedya ünitesi gece moduna geçtiğinde Ayarlar kendi sayfasında kalıyor. Android 15'te yan tutulan telefonlar kamera çentiğinden uzak duruyor. Kendi SSH anahtarınızı içe aktarmak, dosya seçicisi olmayan bir multimedya ünitesinde uygulamayı artık kapatmıyor."
earlyAccessNote: "Navigasyon, Surround, Yayına başla ve CommaView'a gönder erken geliştirme aşamasında. Geri bildirim toplarken bunları sınırlı bir test grubuna açıyoruz ve Navigasyon'un rotaları gibi bazıları ücretli hizmetlerle çalışıyor; bu yüzden normal kullanımın maliyetini öğrenene kadar grubu küçük tutuyoruz. Test etmeye yardım etmek için bize Discord'dan ulaşın: test edenlerden bunları sürüşlerinde kullanmalarını ve nasıl gittiğini anlatmalarını istiyoruz."
earlyAccess:
  - title: "Navigasyon"
    text: "Ana sayfadan Live View'a adım adım yönlendirme: bir yer arayın, üç rotaya kadar karşılaştırın, sonra dönüş kartını, sesli yönlendirmeyi ve CommaView ekranında şeridinize çizilen okları izleyin. Yanlış bir dönüşte birkaç saniye içinde yeni rota bulunur. Yalnızca görüntüdür: comma'nıza veya aracınıza hiçbir şey gönderilmez, yerleriniz de telefonunuzda kalır."
  - title: "Surround"
    text: "Aracınızın çevresindeki yolun 3B görünümü, dördüncü bir sürüş ekranı olarak: kameranın gördüğü yol, şerit çizgileri, kavşaklar ve yaya geçitleriyle; süzülerek giden ve fren lambalarını gösteren otomobiller, kamyonlar ve otobüsler; ve size dönük trafik ışıkları, gösterdikleri renkte yanarak. Telefonunuzda kendi araç algılayıcısını çalıştırır; bir aracın multimedya ünitesinde eskisinden yaklaşık 13 kat hızlı."
  - title: "Yayına başla"
    text: "Live View'un gösterdiğini YouTube kanalınıza veya başka bir RTMP sunucusuna 720p ya da 1080p olarak yayınlayın. YouTube'a bir kez giriş yapın; Yayına başla yayını oluşturur, başlatır ve bitirir; seçerseniz comma'nızın veya telefonunuzun mikrofonundan ses ile."
  - title: "CommaView'a gönder"
    text: "Kayıtlar'dan, kaydedilmiş bir sürüşü ne olduğunu anlatan bir notla bize gönderin. Asla sürücü kamerasını, sesi veya aracınızın VIN'ini içermez."
runtime:
  - title: "İki fork daha"
    text: "Çalışma ortamı SunnyPilot-TeslaHW1 ve carrotpilot'u tanıyor."
  - title: "Başarısız bir kurulum nedenini söylüyor"
    text: "Yükleyici, desteklemediği bir fork gibi nedeni belirtir; böylece uygulama size söyleyebilir."
  - title: "Daha hızlı tekrar oynatma indirmeleri"
    text: "Uygulama bir sürüşün videosundan bir seferde 256 KiB yerine 4 MiB'a kadar ister ve çok zayıf Wi‑Fi'daki bir telefon artık comma'nın diğer yanıtlarını bekletmiyor."
  - title: "Görülmeden biten sürüşler için tekrar oynatmalar"
    text: "comma bir kaydın sürüşü bittiğinde bunu söyler; böylece telefon sonunu görmemiş olsa bile uygulama tekrar oynatmasını oluşturabilir."
  - title: "comma'nızın mikrofonu yayında"
    text: "Yayına başla olan hesaplar için: comma'nın mikrofonu yalnızca onu bir yayın için seçtiğinizde telefonunuza gider. openpilot'un kendi ses kaydı açılmaz ve comma sesi asla saklamaz."
