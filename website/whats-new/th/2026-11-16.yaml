title: "คีย์สำหรับแต่ละโทรศัพท์ CommaView อีก 11 ภาษา และ Browser View"
out:
  - title: "CommaView ในภาษาของคุณ"
    text: "การตั้งค่า › ภาษา: Deutsch, Español, Français, 日本語, 한국어, Português (Brasil), ไทย, Türkçe, Українська, 简体中文 และ 繁體中文 นอกจากภาษาอังกฤษ ทั้งหมดแปลด้วยเครื่องและยังไม่มีเจ้าของภาษาตรวจทาน จึงบอกเราได้ว่าตรงไหนอ่านแล้วผิด หน้าจอของ comma เองยังคงเป็นภาษาของ comma"
  - title: "Browser View"
    text: "Live View ในเว็บเบราว์เซอร์ของรถ รวมถึงของ Tesla: เริ่มได้ในรายละเอียดของ Live View แล้วพิมพ์ลิงก์สั้นในเบราว์เซอร์ของรถ ภาพเดินทางจากโทรศัพท์ไปยังรถผ่านฮอตสปอต ไม่ผ่านอินเทอร์เน็ต"
  - title: "เก็บช่วงเวลานี้"
    text: "ปุ่มเก็บของ Live View เก็บ 3 นาทีที่ผ่านมาและอีกหนึ่งนาทีถัดไปของการขับ เป็น MP4 ในโทรศัพท์ คัดลอกเมื่อคุณจอดรถ"
  - title: "ส่งออกทั้งการขับขี่… และดึงการขับขี่อัตโนมัติ"
    text: "คัดลอกทั้งการขับขี่เป็น MP4 ไฟล์เดียว หรือให้คัดลอกการขับขี่ใหม่เมื่ออยู่บ้านประมาณทุกครึ่งชั่วโมงบน Wi‑Fi ที่คุณเลือก จนถึงพื้นที่ที่คุณให้ไว้"
  - title: "ร้านแพ็กโอเวอร์เลย์"
    text: "แพ็กเพิ่มสิ่งที่ฟอร์กของคุณวาดบนหน้าจอของตัวเองเข้าไปใน Live View สมาชิกเลือกดูแพ็กทางการและชุมชน และสำหรับ comma ของคุณ ใครก็เพิ่มแพ็กจากไฟล์หรือลิงก์ได้"
  - title: "การนำทางด้วยคีย์ Stadia Maps ของคุณเอง"
    text: "สำหรับสมาชิก: ไปที่ไหน? เส้นทาง และการนำทางทีละทางเลี้ยว ด้วยบัญชี Stadia Maps ของคุณเอง โดยคีย์ถูกเก็บปิดผนึกในโทรศัพท์"
  - title: "เปิด CommaView เอง"
    text: "เมื่อจอในรถเริ่มทำงาน เมื่อ Bluetooth เชื่อมต่อ และเข้า Live View ทันทีเมื่อ comma เชื่อมต่อ แต่ละอย่างปิดอยู่จนกว่าคุณจะเปิดในการตั้งค่า › การแสดงผล"
  - title: "แชร์กับผู้พัฒนาฟอร์กของฉัน"
    text: "คลิป สรุป และล็อกของ CommaView สำหรับช่วงนั้น แชร์ผ่านชีตแชร์ของ Android ไปยังที่ที่ฟอร์กของคุณรับรายงาน ไม่มีอะไรส่งไปยัง CommaView"
  - title: "Live View บอกว่าเกิดอะไรขึ้น"
    text: "รอการรีบูตที่ comma ต้องการ บอกเมื่อข้อมูลรถหยุดส่งหรือภาพล่าช้า บอกสาเหตุที่กำลังเชื่อมต่อใหม่ และเล่นได้บนจอในรถมากขึ้นด้วยการลองตัวถอดรหัสวิดีโออีกตัว"
  - title: "การอัปเดต CommaView"
    text: "สำหรับสมาชิก ตั้งแต่ 0.0.166: การอัปเดตแสดงเวอร์ชัน ยกเลิกได้ และดาวน์โหลดต่อในเบื้องหลัง"
  - title: "การแก้ไข"
    text: "ไม่มีอะไรถูกตัดเมื่อใช้ข้อความขนาดใหญ่ในหน้าต่างเตี้ย ถ่ายทอดสดเงียบเมื่อปิดเสียง และการเล่นซ้ำของการขับขี่ที่ comma ไฟดับระหว่างทาง ใช้ทุกอย่างจนถึงจุดที่ไฟดับ"
earlyAccessNote: "ถ่ายทอดสดไปยัง X, Twitch, Kick และ Facebook, วิดีโอเท่านั้น, การตั้งค่าฟอร์ก, การสร้างแพ็กโอเวอร์เลย์ และ Surround เปิดให้ผู้ทดสอบกลุ่มจำกัดผ่านแฟล็กฟีเจอร์ระหว่างที่เรารวบรวมความคิดเห็น ถ้าอยากช่วยทดสอบ ติดต่อเราใน Discord"
earlyAccess:
  - title: "ถ่ายทอดสดไปยังแพลตฟอร์มอื่น"
    text: "X, Twitch, Kick และ Facebook แต่ละแพลตฟอร์มอยู่หลังแฟล็กของตัวเองจนกว่าจะได้สตรีมด้วยบัญชีจริง"
  - title: "วิดีโอเท่านั้น"
    text: "สำหรับ FrogPilot และ KisaPilot ซึ่ง CommaView เพิ่มมุมมองลงในหน้าจอไม่ได้: กล้องและข้อมูลการขับในมุมมองของ CommaView เอง โดยไม่เปลี่ยนอะไรในฟอร์ก"
  - title: "การตั้งค่าฟอร์ก"
    text: "การตั้งค่าของซอฟต์แวร์ช่วยขับเองในการตั้งค่าอุปกรณ์ของ comma เปลี่ยนขณะจอด พร้อมสำรองข้อมูลไว้ในโทรศัพท์"
runtime:
  - title: "คีย์สำหรับแต่ละโทรศัพท์"
    text: "แต่ละโทรศัพท์ได้คีย์ของตัวเองสำหรับ comma โดยอัตโนมัติ และไม่ต้องจับคู่ใหม่ โทรศัพท์ที่ใช้แอปรุ่นเก่ายังใช้ได้ 90 วันหลังจากโทรศัพท์เครื่องแรกได้คีย์ หลังจากนั้นต้องใช้ 0.0.166 และคำเชิญ"
  - title: "BluePilot, dragonpilot และ OPGM"
    text: "เป็นฟอร์กที่อยู่ในรายการแล้ว แสดงชื่อและวาดในรูปแบบของฐาน"
  - title: "การติดตั้งที่ตรวจสอบแล้ว ไม่ถอยหลัง"
    text: "แอปตรวจลายเซ็นของรันไทม์แต่ละรุ่นก่อนติดตั้ง และ comma ปฏิเสธรันไทม์ที่เก่ากว่า"
  - title: "carrotpilot และ StarPilot 7.0"
    text: "หน้าจอของ carrotpilot มากขึ้น ในฟอนต์ของตัวเองสำหรับภาษาเกาหลี ญี่ปุ่น จีน และไทย และสาขาพัฒนาของ StarPilot 7.0 แบบเท่าที่ทำได้"
