title: "ฟอร์กเพิ่มอีกสองตัว สำเนาสด และทดลองใช้การนำทางกับ Surround ก่อนใคร"
out:
  - title: "SunnyPilot-TeslaHW1"
    text: "CommaView ติดตั้งบนฟอร์กของ sunnypilot สำหรับรถ Tesla HW1 ตัวนี้ แสดงชื่อ และวาดหน้าจอของ sunnypilot พร้อมทุกอย่างที่ sunnypilot เพิ่ม"
  - title: "carrotpilot"
    text: "CommaView ติดตั้งบนฟอร์กของ openpilot สำหรับรถ Hyundai, Kia และ Genesis ตัวนี้ และวาดหน้าจอของ openpilot ให้ สิ่งที่ carrotpilot เพิ่มบนหน้าจอของตัวเอง เช่น การนำทางและกล้องตรวจจับความเร็ว ยังไม่ถูกวาด หลัง carrotpilot อัปเดตตัวเอง แอปจะขอให้รีบูต ซึ่งทำให้ Live View กลับมา"
  - title: "สำเนาสด"
    text: "การตั้งค่า › การบันทึก › บันทึกใน Live View เลือกว่าปุ่มบันทึกจะสร้างอะไร: การเล่นซ้ำหลังขับ (ภาพดีที่สุด สูงสุด 10 นาที เหมือนเดิม) สำเนาสดของสิ่งที่ Live View แสดง พร้อมทันทีที่คุณหยุดโดยไม่จำกัด 10 นาที หรือทั้งสองแบบ สำเนาสดเป็น 720p หรือ 1080p บันทึกต่อขณะล็อกโทรศัพท์ หยุดอย่างเรียบร้อยก่อนพื้นที่จะเต็ม และอยู่ในโทรศัพท์ของคุณ"
  - title: "การตั้งค่าที่ใช้ทั้งหน้าจอ"
    text: "การบันทึก การแสดงผล และถ่ายทอดสด ใช้ทั้งหน้าจอเป็นสองคอลัมน์เมื่อพื้นที่พอ รายการการตั้งค่าบอกว่าแต่ละหน้ามีอะไร และทุกหน้าจัดแนวได้ดีบนแท็บเล็ต จอในรถ และโทรศัพท์แนวนอน"
  - title: "รีเฟรชสิทธิ์"
    text: "การตั้งค่า › บัญชี › สิทธิ์และฟีเจอร์ บอกว่าสิทธิ์ของคุณจะต่ออายุเมื่อไร และรีเฟรชสิทธิ์จะเปิดหรือปิดฟีเจอร์ให้คุณทันที จากที่เคยใช้เวลาถึงหนึ่งวัน"
  - title: "ทำไมการติดตั้งล้มเหลว"
    text: "ถ้าการตั้งค่า การอัปเดตรันไทม์ หรือการถอนการติดตั้งล้มเหลว แอปจะบอกว่าเกิดอะไรขึ้นและต้องทำอย่างไร (ฟอร์กที่ CommaView ไม่รองรับ รถกำลังขับอยู่ comma ไม่มีอินเทอร์เน็ต) บอกว่า comma ของคุณถูกคืนค่าเดิมหรือไม่ และคัดลอกรายละเอียดจะคัดลอกรายงานที่ฝ่ายสนับสนุนต้องใช้"
  - title: "การ์ดเดียวสำหรับอัปเดต"
    text: "การอัปเดตรันไทม์แสดงบนการ์ดอัปเดตของหน้าแรกเท่านั้น การอัปเดตที่ล้มเหลวจะแสดงที่นั่นพร้อมลองอีกครั้งและปิด"
  - title: "การเล่นซ้ำเร็วขึ้น"
    text: "การเล่นซ้ำดาวน์โหลดเฉพาะวิดีโอที่ใช้แสดง การขับขี่ถัดไปดาวน์โหลดระหว่างที่กำลังสร้างอีกรายการ และ GPU วาด HUD บน Android 9 ขึ้นไป การบันทึกที่ถูกตัดเพราะแอปปิด ครบ 10 นาที หรือรถดับ ตอนนี้มีสร้างการเล่นซ้ำ"
  - title: "คุณภาพการเล่นซ้ำกลับมาใช้ได้"
    text: "ระดับสมดุล สูง และสูงสุด สร้างการเล่นซ้ำที่ต่างกันอีกครั้ง ก่อนหน้านี้ทุกการเล่นซ้ำถูกสร้างที่ 40 Mbit/s ระดับสูงซึ่งเป็นค่าเริ่มต้น สร้างไฟล์ขนาดราวครึ่งหนึ่งจาก comma 3X"
  - title: "ปุ่ม Debug Clip ถูกนำออกแล้ว"
    text: "การแชร์รายงานข้อบกพร่องส่งเฉพาะล็อก คลิปดีบักที่คุณเก็บไว้ยังอยู่ในการบันทึก"
  - title: "การแก้ไข"
    text: "การตั้งค่าอยู่ที่หน้าเดิมเมื่อจอในรถสลับเป็นโหมดกลางคืน โทรศัพท์แนวนอนบน Android 15 เว้นห่างจากรอยเว้ากล้อง การนำเข้าคีย์ SSH ของคุณเองไม่ทำให้แอปปิดบนจอในรถที่ไม่มีตัวเลือกไฟล์อีกต่อไป"
earlyAccessNote: "การนำทาง, Surround, ถ่ายทอดสด และส่งให้ CommaView อยู่ในช่วงพัฒนาแรกๆ เราเปิดให้ผู้ทดสอบกลุ่มจำกัดระหว่างรวบรวมความคิดเห็น และบางอย่างใช้บริการแบบเสียเงิน เช่น เส้นทางของการนำทาง เราจึงให้กลุ่มเล็กไว้จนกว่าจะรู้ว่าการใช้งานปกติมีต้นทุนเท่าไร ถ้าอยากช่วยทดสอบ ติดต่อเราใน Discord: เราขอให้ผู้ทดสอบใช้ในการขับจริงและเล่าให้เราฟังว่าเป็นอย่างไร"
earlyAccess:
  - title: "การนำทาง"
    text: "การนำทางทีละทางเลี้ยวจากหน้าแรกไปจนถึง Live View: ค้นหาสถานที่ เปรียบเทียบได้ถึงสามเส้นทาง แล้วทำตามการ์ดทางเลี้ยว เสียงแนะนำ และบนหน้าจอ CommaView ลูกศรที่วาดในเลนของคุณ เลี้ยวผิดจะได้เส้นทางใหม่ภายในไม่กี่วินาที ใช้แสดงผลเท่านั้น: ไม่มีอะไรถูกส่งไปยัง comma หรือรถของคุณ และสถานที่ของคุณอยู่ในโทรศัพท์"
  - title: "Surround"
    text: "มุมมอง 3 มิติของถนนรอบรถ เป็นหน้าจอขณะขับแบบที่สี่: ถนนตามที่กล้องเห็น พร้อมเส้นเลน ทางแยก และทางม้าลาย รถยนต์ รถบรรทุก และรถบัสที่เคลื่อนลื่นและแสดงไฟเบรก และไฟจราจรที่หันมาทางคุณ ติดสีตามที่แสดง มันรันตัวตรวจจับรถของตัวเองบนโทรศัพท์ เร็วขึ้นราว 13 เท่าบนจอในรถ"
  - title: "ถ่ายทอดสด"
    text: "สตรีมสิ่งที่ Live View แสดงไปยังช่อง YouTube ของคุณหรือเซิร์ฟเวอร์ RTMP อื่น ที่ 720p หรือ 1080p ลงชื่อเข้าใช้ YouTube ครั้งเดียว แล้วถ่ายทอดสดจะสร้าง เริ่ม และจบการถ่ายทอด พร้อมเสียงจากไมโครโฟนของ comma หรือของโทรศัพท์ถ้าคุณเลือก"
  - title: "ส่งให้ CommaView"
    text: "ส่งการขับขี่ที่บันทึกไว้ถึงเราพร้อมโน้ตว่าเกิดอะไรขึ้น จากการบันทึก ไม่มีกล้องฝั่งคนขับ เสียง หรือ VIN ของรถคุณ"
runtime:
  - title: "ฟอร์กเพิ่มอีกสองตัว"
    text: "รันไทม์รู้จัก SunnyPilot-TeslaHW1 และ carrotpilot"
  - title: "การติดตั้งที่ล้มเหลวบอกสาเหตุ"
    text: "ตัวติดตั้งระบุสาเหตุ เช่น ฟอร์กที่ไม่รองรับ แอปจึงบอกคุณได้"
  - title: "ดาวน์โหลดการเล่นซ้ำเร็วขึ้น"
    text: "แอปขอวิดีโอของการขับขี่ได้ครั้งละถึง 4 MiB จากเดิม 256 KiB และโทรศัพท์ที่ Wi‑Fi อ่อนมากไม่ทำให้คำตอบอื่นๆ ของ comma ช้าอีกต่อไป"
  - title: "การเล่นซ้ำของการขับขี่ที่จบโดยไม่มีใครเห็น"
    text: "comma บอกเมื่อการขับขี่ของการบันทึกจบลง แอปจึงสร้างการเล่นซ้ำได้แม้โทรศัพท์ไม่เห็นตอนจบ"
  - title: "ไมโครโฟนของ comma ในสตรีม"
    text: "สำหรับบัญชีที่มีถ่ายทอดสด: ไมโครโฟนของ comma ส่งไปยังโทรศัพท์เฉพาะเมื่อคุณเลือกใช้กับสตรีม การบันทึกเสียงของ openpilot เองไม่ถูกเปิด และ comma ไม่เก็บเสียงไว้เลย"
