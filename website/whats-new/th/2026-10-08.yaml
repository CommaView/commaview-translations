title: "แผนที่ออฟไลน์และความเร็วจำกัด ป้ายตามภูมิภาค และคิวการเล่นซ้ำ"
out:
  - title: "แผนที่ออฟไลน์และความเร็วจำกัด"
    text: "ดาวน์โหลดประเทศหรือรัฐในสหรัฐฯ ได้ในการตั้งค่า › แผนที่ออฟไลน์ และ CommaView จะแสดงความเร็วจำกัดจาก GPS สดของ comma เมื่อเปิดตำแหน่งแล้ว การดาวน์โหลดหยุดชั่วคราว ทำต่อ และอัปเดตได้ และความเร็วจำกัดใช้แสดงผลเท่านั้น"
  - title: "ป้ายความเร็วจำกัดตามที่ที่คุณขับ"
    text: "ป้ายของ CommaView ใช้หนึ่งในเจ็ดแบบตามตำแหน่งของ comma: วงกลมขอบแดงที่ใช้ในประเทศส่วนใหญ่ รวมถึงสหราชอาณาจักรและไต้หวัน หรือป้ายของสหรัฐฯ แคนาดา ญี่ปุ่น สวีเดน ฟินแลนด์และไอซ์แลนด์ ไอร์แลนด์และบราซิล หรือออสเตรเลีย"
  - title: "เสี้ยวแสดงการบังคับเลี้ยว"
    text: "เสี้ยวใต้กลุ่มความเร็วของโอเวอร์เลย์ CommaView แสดงว่า openpilot บังคับเลี้ยวแรงแค่ไหน และกลุ่มความเร็วกลับมามีลุคแบบกระจก สูงสุดและความเร็วจำกัดอยู่ที่เดิมแม้ไม่ทราบค่า"
  - title: "เต็มจอหรือกล้องเต็มภาพ"
    text: "ในแนวนอน โอเวอร์เลย์ CommaView เต็มหน้าจอโดยครอปภาพกล้อง หรือแสดงภาพทั้งหมดด้วยกล้องเต็มภาพ การบันทึกใหม่ใช้การครอปที่คุณเลือก"
  - title: "คิวการเล่นซ้ำ"
    text: "ใส่หลายการขับขี่ในคิว แล้วการเล่นซ้ำจะถูกสร้างในเบื้องหลัง ทำต่อจากจุดเดิมถ้าการเชื่อมต่อหลุด หยุดชั่วคราว ทำต่อ ลองอีกครั้ง หรือเรียงใหม่ได้จากคิวในการบันทึก"
  - title: "การบันทึกและแผนที่สำหรับทุกหน้าจอ"
    text: "การบันทึกและไลบรารีแผนที่ออฟไลน์ถูกออกแบบใหม่ให้พอดีกับโทรศัพท์ แท็บเล็ต และจอในรถ และตำแหน่งรถพอดีกับหน้าจอเตี้ยและข้อความขนาดใหญ่แล้ว"
  - title: "ปัญหาการบันทึกที่ชัดขึ้น"
    text: "เมื่อสร้างการเล่นซ้ำจากการขับขี่ไม่ได้ การบันทึกจะบอกสาเหตุ และรายงานที่ส่งจากตรงนั้นมีรายละเอียดที่เราต้องใช้ตรวจสอบ"
  - title: "หน้าแรกและตารางอันดับ"
    text: "การขับขี่สัปดาห์นี้และตำแหน่งรถอยู่บนหน้าแรกแม้ออฟไลน์ และหน้าแรกแสดงโพเดียมของสัปดาห์นี้ เมื่อเข้าร่วมตารางอันดับแล้ว ยอดรวมจะซิงก์เอง แม้จากฮอตสปอตของ comma"
  - title: "อัปเดตรันไทม์โดยไม่ต้องอัปเดตแอป"
    text: "รันไทม์ของ comma อัปเดตได้เมื่อมีรุ่นที่เข้ากันได้ออกมา โดยไม่ต้องรอแอปใหม่ และความคืบหน้าชัดขึ้น"
  - title: "การลงชื่อเข้าใช้ Beta"
    text: "ในช่วง Beta CommaView ขอให้คุณลงชื่อเข้าใช้ด้วยบัญชีที่ได้รับคำเชิญ การจับคู่และการตั้งค่ายังอยู่ครบ และแอปใช้งานแบบออฟไลน์ได้ตราบที่บัตรผ่านยังใช้ได้"
  - title: "การประหยัดพลังงาน Wi‑Fi ที่ชัดขึ้น"
    text: "การประหยัดพลังงาน Wi‑Fi ของ comma เป็นตัวเลือกเปิดหรือปิดแบบตรงไปตรงมา แสดงค่าเริ่มต้นของระบบ และบอกว่าการเปลี่ยนแปลงมีผลเมื่อไร"
runtime:
  - title: "รีบูตจากแอป"
    text: "เมื่ออัปเดตต้องให้ comma รีสตาร์ท รีบูต comma ตอนนี้ ในแอปจะรีสตาร์ทให้ ใช้ได้เฉพาะเมื่อรถดับหรือจอดอยู่"
  - title: "ความเร็วจำกัดจาก GPS สด"
    text: "บน sunnypilot comma ส่งตำแหน่ง GPS ล่าสุดแทนตำแหน่งที่แคชไว้ ความเร็วจำกัดจากแผนที่ออฟไลน์จึงตามตำแหน่งที่คุณอยู่"
  - title: "สถานะการขับขี่ที่ชัดขึ้น"
    text: "comma แยกการขับขี่ที่ยังไม่สมบูรณ์ออกจากที่หายไปแล้ว การบันทึกจึงอธิบายได้ว่าเป็นแบบไหน และเก็บการขับขี่ที่จบแล้วให้สมบูรณ์"
