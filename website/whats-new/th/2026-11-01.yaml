title: "ถ่ายทอดสดสำหรับทุกคน การส่งการขับขี่ และฟอร์ก openpilot มากขึ้น แบบเท่าที่ทำได้"
out:
  - title: "ถ่ายทอดสด สำหรับทุกคน"
    text: "สตรีมสิ่งที่ Live View แสดงไปยังช่อง YouTube ของคุณหรือเซิร์ฟเวอร์ RTMP อื่น ที่ 720p หรือ 1080p พร้อมเสียงจากไมโครโฟนของ comma หรือของโทรศัพท์ถ้าคุณเลือก ตั้งค่าได้ในการตั้งค่า › ถ่ายทอดสด สตรีมเริ่มแบบไม่เป็นสาธารณะ และทุกคนที่ดูจะเห็นว่าคุณขับไปที่ไหน"
  - title: "ส่งให้ CommaView สำหรับสมาชิก"
    text: "ส่งการขับขี่หนึ่งหรือหลายรายการจากการบันทึกถึงเรา พร้อมโน้ตว่าเกิดอะไรขึ้น: วิดีโอกล้องหน้าและกล้องมุมกว้างกับล็อกของแต่ละรายการ ไม่มีกล้องฝั่งคนขับ เสียง หรือ VIN ของรถ ชีตส่งให้ CommaView ชีตเดียวรวมทุกอย่างที่คุณส่งถึงเรา ทั้งปัญหาและไอเดีย"
  - title: "หลายการขับขี่พร้อมกัน"
    text: "เลือกการขับขี่ในการบันทึกเพื่อแชร์ สร้างการเล่นซ้ำ ส่ง หรือลบพร้อมกัน"
  - title: "คำขอของคุณ"
    text: "เมื่อคุณรายงานปัญหาหรือส่งไอเดียขณะลงชื่อเข้าใช้ เราตอบกลับได้: การตั้งค่า › การสนับสนุนและการวินิจฉัย › คำขอของคุณ แสดงคำตอบของเรา คุณจะได้รับอีเมล และคุยต่อได้ที่ my.commaview.com"
  - title: "Live View พอดีทุกหน้าจอ"
    text: "ปุ่มควบคุมไม่ต้องเลื่อนหรือบังปุ่มออกอีกต่อไป: สิ่งที่ไม่พอดีจะไปอยู่ในเพิ่มเติม และข้อความขนาดใหญ่จะย้ายปุ่มควบคุมไปไว้ในเพิ่มเติมแทนการย่อสิ่งใด Live View ใช้ทรัพยากรโทรศัพท์น้อยลง และกลับมาทำงานเองแทนการค้าง"
  - title: "จัดการตั้งค่าใหม่"
    text: "ความเป็นส่วนตัวและการแชร์บอกว่าอะไรออกจากโทรศัพท์ การสนับสนุนและการวินิจฉัยคือที่สำหรับรายงานปัญหาและดูคำขอของคุณ และบัญชีปิดท้ายด้วยลบบัญชีของคุณ ช่วยพัฒนา CommaView ถามหนึ่งครั้งว่าจะส่งรายงานข้อขัดข้องและซอฟต์แวร์ช่วยขับที่ comma ใช้หรือไม่"
  - title: "ตารางอันดับ สำหรับสมาชิกทุกคน"
    text: "ไม่ต้องพึ่งแฟล็กฟีเจอร์อีกต่อไป การ์ดบนหน้าแรกรีเฟรชอย่างมากทุก 30 นาที และบอกว่ารีเฟรชล่าสุดเมื่อไร"
  - title: "สนับสนุน CommaView"
    text: "การตั้งค่า › การสนับสนุนและการวินิจฉัย › สนับสนุน CommaView เปิดหน้า Buy Me a Coffee ของเรา เพื่อช่วยค่าโฮสติ้ง การทดสอบ และแอป iOS ไม่ได้ปลดล็อกอะไร"
  - title: "การแก้ไข"
    text: "จอในรถ Android 16 ไม่ปิด CommaView ใน Live View อีกเมื่อตัวถอดรหัสวิดีโอล้มเหลว หน้าจอ comma 3X ของ StarPilot วาดภาพกล้องบนจอในรถที่เคยแสดงเป็นสีดำ และการลงชื่อเข้าใช้ YouTube และถ่ายทอดสดใช้ได้ผ่าน VPN"
earlyAccessNote: "การนำทาง, Surround, Surround V2 และเครื่องมือทดลอง ยังอยู่ในช่วงพัฒนาแรกๆ สำหรับผู้ทดสอบกลุ่มจำกัดผ่านแฟล็กฟีเจอร์ระหว่างที่เรารวบรวมความคิดเห็น บางอย่างใช้บริการแบบเสียเงิน เช่น เส้นทางของการนำทาง เราจึงให้กลุ่มเล็กไว้ ถ้าอยากช่วยทดสอบ ติดต่อเราใน Discord"
earlyAccess:
  - title: "การนำทาง"
    text: "แผนที่ใน Live View ระหว่างเดินทาง ข้างวิดีโอหรือที่มุม และไปที่ไหน? เมื่อไม่มีการเดินทาง บนแผนที่มุม ปุ่มจบและปิดเสียงอยู่ตลอด การจบยกเลิกได้ภายใน 8 วินาที และคุณพูดบอกปลายทางได้"
  - title: "ธีมแผนที่"
    text: "แผนที่ของการนำทางมีธีมสว่างและมืดแล้ว สลับตอนพระอาทิตย์ขึ้นและตกตามตำแหน่งของ comma จึงอ่านได้แม้แดดจ้า เลือกอัตโนมัติ ตามโทรศัพท์ สว่าง หรือมืด ได้ในการตั้งค่า › แผนที่และการนำทาง › ธีมแผนที่"
  - title: "Surround และ Surround V2"
    text: "Surround วางรถที่จอดอยู่ตรงตำแหน่งจริงในการเล่นซ้ำ และซ่อนรถที่เห็นจากกล้องเท่านั้นซึ่งที่จริงคือรถจากเรดาร์ Surround V2 คือตัวเรนเดอร์ตัวที่สองแบบทดลอง ในการตั้งค่า › เครื่องมือทดลอง"
runtime:
  - title: "เฉพาะโทรศัพท์ที่จับคู่ไว้"
    text: "กล้องและข้อมูลของ comma ส่งไปยังโทรศัพท์และจอในรถที่จับคู่ไว้เท่านั้น อัปเดต CommaView บนโทรศัพท์และจอในรถทุกเครื่องก่อน: เครื่องที่ค้างอยู่ที่ 0.0.164 จะไม่ได้รับวิดีโอจาก comma ที่ใช้รันไทม์นี้"
  - title: "ร่วมพัฒนาการตรวจจับรถ"
    text: "สำหรับสมาชิก: ให้ทั้งการขับขี่เพื่อฝึกตัวตรวจจับรถที่ Surround ใช้ ด้วยการแตะหรือโดยอัตโนมัติ บนเครือข่ายที่คุณเลือกจาก Wi‑Fi ที่ comma บันทึกไว้และอินเทอร์เน็ตมือถือของโทรศัพท์ แต่ละเครือข่ายตั้งขีดจำกัดรายเดือนได้ถ้าต้องการ ให้แล้วให้เลย: ลบภายหลังไม่ได้ ไม่มีอะไรระบุชื่อคุณหรือ comma ของคุณ แต่เส้นทางและวิดีโอของการขับขี่อาจแสดงว่าคุณขับไปที่ไหน"
  - title: "ฟอร์ก openpilot มากขึ้น แบบเท่าที่ทำได้"
    text: "ตอนนี้ CommaView ติดตั้งบนฟอร์ก openpilot ได้มากขึ้น แบบเท่าที่ทำได้: การตั้งค่าจะตรวจฟอร์กที่ CommaView ไม่ได้ระบุโดยไม่เปลี่ยนอะไร และเพิ่มมุมมองของ CommaView เมื่อคุณยินยอม ถอนการติดตั้งรันไทม์จะคืนไฟล์ของฟอร์กกลับ"
  - title: "การติดตั้งที่กู้คืนได้"
    text: "ไฟดับหรือรีบูตระหว่างติดตั้งจะคืนรุ่นก่อนหน้ากลับมา การดาวน์โหลดที่ค้างจะทำต่อจากจุดที่หยุด และการติดตั้งยังทำต่อเมื่อแอปหยุดรอฟัง"
  - title: "โหมดทดลองบน openpilot รุ่นใหม่"
    text: "บน openpilot nightly และ sunnypilot dev Live View แสดงโหมดทดลองแบบเดียวกับ openpilot"
