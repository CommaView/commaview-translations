title: "CommaView โฉมใหม่ โอเวอร์เลย์ของเราเอง และตารางอันดับ"
out:
  - title: "แอปโฉมใหม่"
    text: "ทุกหน้าจอถูกสร้างใหม่ในดีไซน์ใหม่: หน้าแรก Live View การบันทึก การตั้งค่า การจับคู่ และการตั้งค่าเริ่มต้น มาพร้อมไอคอนและหน้าจอเปิดแอปใหม่ และโหมดกลางวันสำหรับวันที่แดดจ้า"
  - title: "หน้าแรกใหม่"
    text: "รถของคุณบนเวทีพร้อมเปิด Live View ตามด้วยการขับขี่สัปดาห์นี้ ตำแหน่งรถ การบันทึกล่าสุด และตารางอันดับ จัดเรียงได้ด้วยปรับแต่งหน้าแรก comma แสดงว่าเชื่อมต่อแล้วเอง โดยไม่ต้องแตะเชื่อมต่อใหม่"
  - title: "ทำมาสำหรับแท็บเล็ตและจอในรถ"
    text: "บนหน้าจอที่กว้างกว่า หน้าแรกกลายเป็นแดชบอร์ด การตั้งค่าและการบันทึกเปิดข้างรายการ และการจับคู่พอดีกับจอในรถทุกรุ่น"
  - title: "โอเวอร์เลย์ CommaView"
    text: "หน้าจอขณะขับของเราเอง: ความเร็ว สูงสุด และความเร็วจำกัดในกลุ่มเดียว เส้นเลนที่แสดงว่าโมเดลมั่นใจแค่ไหน การเฝ้าระวังผู้ขับขี่และคำเตือนที่ไม่เกะกะ และป้าย MAXIMUM ของแคนาดาเมื่อใช้ได้ หน้าจอแบบ comma 3X และ comma four ก็มีให้ และคุณสลับหน้าจอได้จาก Live View โดยตรง"
  - title: "การตั้งค่าการแสดงผลที่ง่ายขึ้น"
    text: "ส่วนโอเวอร์เลย์ขณะขับส่วนเดียวพร้อมตัวอย่างสด และเลือก CommaView ไว้ให้"
  - title: "การบันทึกที่ดีขึ้น"
    text: "การเล่นซ้ำดูเหมือน Live View ทุกประการ เล่นในแอปได้ และสร้างได้ขณะรถอยู่ในเกียร์ P แสดงความคืบหน้าระหว่างสร้าง แต่ละการขับขี่มีภาพย่อ และคุณจะได้รับคำเตือนก่อน comma ลบการขับขี่"
  - title: "การบันทึกบนทุกอุปกรณ์ของคุณ"
    text: "การบันทึกตามคุณไประหว่างโทรศัพท์และจอในรถที่จับคู่ไว้"
  - title: "ข้อมูลการขับขี่และตำแหน่งรถ"
    text: "ระยะทาง เวลาขับ และจำนวนการขับขี่ของสัปดาห์จากล็อกของ comma เอง และตำแหน่งรถกับที่ที่คุณจอดบนแผนที่สีเข้ม ตำแหน่งปิดอยู่จนกว่าคุณจะเปิด"
  - title: "หน้าอุปกรณ์"
    text: "สถานะและรันไทม์ของ comma ในที่เดียว จากตรงนั้นคุณเปิด Live View จัดการการประหยัดพลังงาน Wi‑Fi ซ่อมแซม และแชร์ล็อกเมื่อต้องการความช่วยเหลือ"
  - title: "อัปเดตในแอป"
    text: "อัปเดตแอปดาวน์โหลดในเบื้องหลัง พร้อมปุ่มอัปเดตในทุกหน้าจอ การอัปเดตรันไทม์ การซ่อมแซม และการถอนการติดตั้งไม่ต้องใช้ SSH แต่ละการอัปเดตแสดงขั้นตอนระหว่างทำ และหน้าแรกคอยแจ้งความคืบหน้า สิ่งที่ทำระหว่างขับไม่ได้จะรอจนรถอยู่ในเกียร์ P"
  - title: "ตารางอันดับ"
    text: "เลือกเข้าร่วมจากหน้าแรกด้วยชื่อที่แสดง เพื่อดูโพเดียมของสัปดาห์นี้ ผลของสัปดาห์ที่แล้ว และอันดับตลอดกาล เหรียญได้จากระยะทางที่ comma ของคุณบันทึกเอง และตารางตลอดกาลของ comma.ai แสดงยอดรวมที่ comma.ai มีสำหรับ comma ของคุณ"
  - title: "รายงานข้อขัดข้อง"
    text: "ช่วยให้เราแก้ปัญหาได้เร็วขึ้น โดยตัดข้อมูลส่วนตัวออก ปิดได้ในการตั้งค่า"
  - title: "การแก้ไข"
    text: "ความเร็วสูงสุดของ comma four ไม่กะพริบเมื่อเข้าควบคุมอีกต่อไป comma 3 บอกชัดว่าไม่รองรับ CommaView ใช้ได้กับ comma 3X และ comma four"
runtime:
  - title: "อัปเดตขณะจอด แม้อยู่บ้าน"
    text: "ติดเครื่องรถไว้ในเกียร์ P โดย openpilot ยกเลิกระบบช่วยขับ หรือวาง comma ไว้บนโต๊ะ การขับจะไม่ถูกขัดจังหวะเลย"
  - title: "อัปเดตที่ปลอดภัยขึ้น"
    text: "ทีละรายการ และถ้ามีอะไรผิดพลาด comma จะกลับไปใช้เวอร์ชันเดิม"
  - title: "สิ่งที่ขับเคลื่อนฟีเจอร์ใหม่"
    text: "ข้อมูลการขับขี่ ตำแหน่งรถ การบันทึกข้ามอุปกรณ์ และการซิงก์ตารางอันดับ ล้วนมาจากรันไทม์ใหม่ แอปติดตั้งให้คุณ"
