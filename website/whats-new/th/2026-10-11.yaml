title: "StarPilot หน้าจอที่ตรงกับฟอร์กของคุณ และตารางอันดับใหม่"
out:
  - title: "StarPilot"
    text: "ตอนนี้ CommaView ใช้กับ StarPilot บน comma 3X และ comma four ได้ ติดตั้งจากตัวติดตั้งของ StarPilot เอง Live View ทำตาม Camera View ของมัน รวมถึงกล้องฝั่งคนขับ และบอกคุณเมื่อการตั้งค่า Disable Logging หยุดวิดีโอ"
  - title: "หน้าจอที่ตรงกับฟอร์กของคุณ"
    text: "หน้าจอแบบ comma four และ comma 3X วาดสิ่งที่ฟอร์กของคุณวาดบน comma: ฟอนต์ คำเตือน และการปรับสีภาพกล้อง บน StarPilot จะมี HUD เส้นทาง และวิดเจ็ตของมันเอง เช่น ป้ายความเร็วจำกัด ข้อมูลรถคันหน้า การ์ดนำทาง และแถบข้างสำหรับนักพัฒนา"
  - title: "เลือกหน้าจอในการแสดงผล"
    text: "การตั้งค่า › การแสดงผล เลือกหน้าจอขณะขับจากรายการแบบเลื่อนลง และตัวอย่างแสดงฟอร์กและกล้องของ comma ของคุณเอง"
  - title: "ทุกเฟรมใน Live View"
    text: "ตอนนี้ Live View วาดทุกเฟรมที่ comma ส่ง สูงสุด 20 เฟรมต่อวินาที จากที่เคยข้ามบางเฟรม หน้าจอแบบ comma 3X วาดด้วย GPU ของโทรศัพท์ (Android 9 ขึ้นไป) จึงตามทันวิดีโอ"
  - title: "Live View ที่กู้คืนตัวเองได้"
    text: "ไม่ค้างอยู่ที่ “Reconnecting… Attempt 1” อีกต่อไป และเมื่อรถดับอยู่ จะรอและเปิดวิดีโอเองเมื่อรถติดเครื่อง แผงสถานะเดียวบอกว่าเกิดอะไรขึ้นพร้อมปุ่มของมัน แทนการกะพริบข้อความ “openpilot Unavailable” ตอนวิดีโอเริ่ม"
  - title: "รีบูตหลังอัปเดตรันไทม์"
    text: "หลังติดตั้งหรืออัปเดตรันไทม์ของ comma แอปจะขอให้รีบูตด้วยปุ่มรีบูต และ Live View กับการบันทึกจะรอจนกว่าคุณจะรีบูต comma ไม่รีบูตเองเลย การ์ดอัปเดตบนหน้าแรกเล็กลง: แตะเพื่อดูทุกขั้นตอน"
  - title: "หน้าแรกอัปเดตทันใจ"
    text: "หน้าแรกแสดงภายในไม่กี่วินาทีว่า comma แต่ละเครื่องอยู่หรือไม่ โดยไม่ต้องดึงเพื่อรีเฟรช และแสดงกำลังตรวจสอบระหว่างตรวจ อัปเดตแอปใหม่จะแสดงไม่นานหลังออก ทุกครั้งที่คุณกลับมาที่แอป"
  - title: "ตารางอันดับโฉมใหม่"
    text: "อันดับและความสำเร็จ สำหรับสัปดาห์นี้ สัปดาห์ที่แล้ว หรือตลอดกาล: ตามหลัง comma ที่อยู่เหนือคุณเท่าไร เหลืออะไรอีกสำหรับความสำเร็จถัดไป และทั้ง 17 รายการที่ทำได้ โปรไฟล์ของคุณรวมตัวเลขและการตั้งค่า และแท็บเล็ตกับจอในรถมีแผงคุณอยู่ข้างตาราง"
  - title: "โพเดียมก่อนเข้าร่วม"
    text: "หน้าแรกแสดงโพเดียมของสัปดาห์นี้เป็นสามขั้นพร้อมเหรียญ และคุณดูตารางอันดับได้ก่อนเลือกเข้าร่วม"
  - title: "คิวการเล่นซ้ำที่สงบขึ้น"
    text: "แต่ละการขับขี่เป็นหนึ่งแถวพร้อมความคืบหน้า หยุดชั่วคราว ทำต่อ หรือลองอีกครั้ง และเมนูสำหรับย้าย รายงาน หรือนำออก และคุณลากการขับขี่เพื่อเรียงลำดับใหม่ได้ ความคืบหน้าไม่ค้างที่ 99% อีกต่อไป: การบันทึกการเล่นซ้ำที่เสร็จแล้วแสดงเป็นขั้นตอนของตัวเอง"
  - title: "การเล่นซ้ำที่ตรงกับ Live View"
    text: "การเล่นซ้ำวาดหน้าจอของฟอร์กและป้ายความเร็วจำกัดจากแผนที่ออฟไลน์เหมือนที่ Live View วาด และทำเครื่องหมายช่วงที่ comma ไม่ได้บันทึกข้อมูล HUD"
  - title: "แผนที่ออฟไลน์ที่ดีขึ้น"
    text: "การค้นหาในเพิ่มแผนที่ใช้ได้กับคีย์บอร์ดบนหน้าจอ ปุ่มดาวน์โหลดยังอยู่บนหน้าจอใน Android 15 และการดาวน์โหลดทำต่อในเบื้องหลัง ที่ที่แผนที่ไม่มีข้อมูล ป้ายจะแสดงความเร็วจำกัดของ sunnypilot"
  - title: "การแก้ไข"
    text: "โทรศัพท์หรือจอในรถที่นาฬิกาผิดไม่ล็อกคุณออกจาก Beta อีกต่อไป คำเตือนไฟเขียวและรถคันหน้าออกตัวบน sunnypilot แสดงวงกลมเสมอ และตัวเลขบนป้ายความเร็วจำกัดของ CommaView ไม่ชิดกันจนเกือบติดอีกต่อไป"
runtime:
  - title: "ทุกการขับขี่มีความหมาย"
    text: "comma บันทึกแต่ละการขับขี่ระหว่างที่คุณขับ comma ที่ดับไปพร้อมรถจึงยังเก็บการขับขี่ไว้ได้ แม้การขับขี่ที่เริ่มก่อนที่มันจะรู้เวลา สัปดาห์นี้ในตารางอันดับเพิ่มขึ้นระหว่างขับ"
  - title: "StarPilot และหน้าจอของฟอร์ก"
    text: "รันไทม์ติดตั้งบน StarPilot หาการขับขี่ที่บันทึกด้วยการตั้งค่า High Bitrate Recording หรือ Konik และส่งสิ่งที่หน้าจอของฟอร์กวาด เพื่อให้หน้าจอแบบ comma four และ comma 3X ตรงกัน"
  - title: "Live View ได้กล้องคืน"
    text: "โทรศัพท์หรือจอในรถได้กล้องคืนทันทีเมื่อเชื่อมต่อใหม่ และเครื่องที่หลุดจากเครือข่ายจะปล่อยกล้องภายในราวสิบวินาที"
  - title: "เบาลงสำหรับ comma"
    text: "รันไทม์สร้างเทเลเมทรีของ openpilot เองและส่งในรูปแบบกะทัดรัด เก็บข้อมูล HUD เฉพาะรอบการบันทึก และบอกแอปภายในไม่กี่วินาทีว่า comma อยู่หรือไม่ การบันทึกไม่ล้มเหลวอีกบน comma ที่ทำงานหนัก"
  - title: "การเล่นซ้ำที่ยังพร้อมใช้"
    text: "การขับขี่ที่จบแล้วไม่ถูกทำเครื่องหมายว่าเสียหายหลัง comma รีสตาร์ทขณะจอดอีกต่อไป และการขับขี่ยาวครั้งเดียวไม่ทำให้การเล่นซ้ำของการขับขี่อื่นหยุดอีก"
