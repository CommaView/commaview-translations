title: "หน้าแรกใหม่ ภาพรถของคุณ และที่เดียวสำหรับบัญชีของคุณ"
out:
  - title: "บัญชีของคุณที่ my.commaview.com"
    text: "ลงชื่อเข้าใช้ด้วยรหัสที่ส่งไปยังอีเมล ดาวน์โหลดแอป และดูว่ามีอะไรใหม่ ตอนนี้ Beta และอัปเดตก็มาจากที่นี่ Firebase App Distribution เลิกใช้แล้ว"
  - title: "อัปเดตจากบัญชีของคุณ"
    text: "แอปตรวจบัญชีของคุณหารุ่นใหม่และเสนอให้ในแอป แอปแต่ละรุ่นมาพร้อมรันไทม์ที่ทดสอบด้วยกัน"
  - title: "ความคิดเห็นและบอร์ดฟีเจอร์"
    text: "ส่งไอเดีย ปัญหา หรือคำชมจากการตั้งค่าในแอป พร้อมชุดข้อมูลสำหรับฝ่ายสนับสนุนถ้าอยากให้เราดูละเอียดขึ้น และโหวตว่าเราจะสร้างอะไรต่อบนบอร์ดฟีเจอร์ที่ my.commaview.com"
  - title: "ภาพรถใหม่"
    text: "รถทุกรุ่นที่รองรับมีภาพใหม่ในสไตล์เดียวกัน ขนาดและแสงเท่ากัน วางได้สวยบนทุกหน้าจอ"
next:
  - title: "หน้าแรกอุปกรณ์ใหม่"
    text: "รถของคุณบนเวทีในการ์ดเดียวพร้อมเปิด Live View ตามด้วยการขับขี่สัปดาห์นี้ ตำแหน่งรถ และการบันทึกล่าสุด"
  - title: "ทำมาสำหรับแท็บเล็ตและจอในรถ"
    text: "บนหน้าจอที่กว้างกว่า หน้าแรกกลายเป็นแดชบอร์ด และการตั้งค่ากับการตั้งค่าอุปกรณ์เปิดข้างรายการ"
runtime:
  - title: "ข้อมูลการขับขี่"
    text: "ระยะทาง เวลาขับ และจำนวนการขับขี่ของสัปดาห์ จากล็อกของ comma เอง"
  - title: "ตำแหน่งรถ"
    text: "ตำแหน่งรถระหว่างขับ และที่ที่คุณจอด ปิดอยู่จนกว่าคุณจะเปิด"
